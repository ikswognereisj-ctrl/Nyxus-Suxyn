<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body" cx="50%" cy="34%" r="72%">
      <stop offset="0%"   stop-color="#071318"/>
      <stop offset="62%"  stop-color="#040b0e"/>
      <stop offset="100%" stop-color="#020506"/>
    </radialGradient>
    <linearGradient id="rim" x1="4%" y1="0%" x2="96%" y2="100%">
      <stop offset="0%"   stop-color="#064f95"/>
      <stop offset="52%"  stop-color="#52a0ea"/>
      <stop offset="100%" stop-color="#1e03ad"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#edf1ff"      stop-opacity="0.10"/>
      <stop offset="46%"  stop-color="#edf1ff"      stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#020506"      stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#52a0ea"      stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#064f95"         stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1e03ad"         stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#064f95"         stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#1e03ad"         stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#edf1ff"      stop-opacity="0.16"/>
      <stop offset="42%"  stop-color="#edf1ff"      stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020506"      stop-opacity="0.42"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="28.4"/></clipPath>
  </defs>

  <!-- the pane -->
  <circle cx="32" cy="32" r="28.4" fill="url(#body)"/>
  <g clip-path="url(#disc)">
    <!-- the Glaze: light standing inside the pane -->
    <circle cx="32" cy="32" r="28.4" fill="url(#glaze)"/>
    <!-- the Sheen: a broad faint wash on the upper face -->
    <ellipse cx="32" cy="12" rx="26" ry="13" fill="#edf1ff" opacity="0.055"/>
    <!-- the Crown, and the Lip beneath it -->
    <path d="M8 20 Q32 5 56 20" fill="none" stroke="#edf1ff"
          stroke-opacity="0.30" stroke-width="1.4"/>
    <path d="M8 22.4 Q32 7.4 56 22.4" fill="none" stroke="#020506"
          stroke-opacity="0.34" stroke-width="1.8"/>
  </g>
  <circle cx="32" cy="32" r="28.4" fill="none" stroke="url(#rim)"
          stroke-width="2.1"/>
  <circle cx="32" cy="32" r="26.6" fill="none" stroke="#52a0ea"
          stroke-opacity="0.20" stroke-width="1"/>
  <circle cx="32" cy="32" r="15.6" fill="#52a0ea" fill-opacity="0.14"/>
  <path d="M26.4 26.6 Q26.4 20.6 32 20.6 Q37.8 20.6 37.8 26.2 Q37.8 30.4 33.4 32.6 Q32 33.4 32 36" fill="none" stroke="#52a0ea" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="42.4" r="3" fill="#52a0ea"/>
</svg>
