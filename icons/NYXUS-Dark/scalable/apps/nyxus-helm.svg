<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nyxus helm">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071318"/>
      <stop offset="1" stop-color="#020506"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe8ff"/>
      <stop offset="1" stop-color="#4f7fa6"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#7fe8ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fe8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground: near-black, which is what the glyph has to glow against -->
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#ground)"/>
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#bloom)"/>

  <!-- the ice arc every Nyxus window wears, as the suite's shared mark -->
  <path d="M80 60 H432" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- hairline, so the tile still reads on a light wallpaper -->
  <rect x="27" y="27" width="458" height="458" rx="115" fill="none" stroke="#7fe8ff" stroke-opacity="0.22" stroke-width="2"/>

  <circle cx="256" cy="256" r="40" fill="none" stroke="#edf1ff" stroke-width="24"/><circle cx="256" cy="256" r="140" fill="none" stroke="#edf1ff" stroke-width="24"/><path d="M320 256 L372 256" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M301 301 L338 338" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M256 320 L256 372" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M211 301 L174 338" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M192 256 L140 256" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M211 211 L174 174" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M256 192 L256 140" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M301 211 L338 174" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M396 256 L426 256" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M256 396 L256 426" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M116 256 L86 256" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M256 116 L256 86" fill="none" stroke="#edf1ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
</svg>
