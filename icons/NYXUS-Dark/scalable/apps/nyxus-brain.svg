<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nyxus Brain">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071318"/>
      <stop offset="1" stop-color="#020506"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe8ff"/>
      <stop offset="1" stop-color="#4f7fa6"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#7fe8ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#cd5e56" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#cd5e56" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground: near-black, which is what the glyph has to glow against -->
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#ground)"/>
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#bloom)"/>
  <!-- the app's own accent, as a low pool rather than a fill: coral is
       Brain's identity and gold-is-a-point-of-light applies to every warm
       hue here — a coral AREA over near-black goes muddy. -->
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#warm)"/>

  <!-- the ice arc every Nyxus window wears, as the suite's shared mark -->
  <path d="M80 60 H432" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- hairline, so the tile still reads on a light wallpaper -->
  <rect x="27" y="27" width="458" height="458" rx="115" fill="none" stroke="#7fe8ff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- the chat box: a speech bubble on the text ladder's top rung, with a
       tail, because a rounded rectangle alone is a card and not a bubble -->
  <path d="M136 160 H376 A34 34 0 0 1 410 194 V318 A34 34 0 0 1 376 352 H246 L182 406 V352 H136 A34 34 0 0 1 102 318 V194 A34 34 0 0 1 136 160 Z"
        fill="none" stroke="#edf1ff" stroke-width="22" stroke-linejoin="round"/>

  <!-- three nodes and their links: it is thinking, not merely talking.
       The one bright thing on the tile, in the app's accent. -->
  <path d="M176 292 L256 232 L336 292" fill="none" stroke="#cd5e56" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
  <circle cx="176" cy="292" r="20" fill="#e0ada9"/>
  <circle cx="256" cy="232" r="24" fill="#e0ada9"/>
  <circle cx="336" cy="292" r="20" fill="#e0ada9"/>
</svg>
