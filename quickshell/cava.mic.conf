# Nyxus Suxyn — cava profile for the beat feed's AMBIENT ear (Beat.qml).
#
# Owner ruling 2026-08-09: "i want the active borders to go … if they hear
# music even if im playing it on my tv or something." SUPERSEDED 2026-08-19:
# idle with nothing playing must not pulse. Beat.qml no longer starts this
# profile (fan hum on the default source was a fake beat). File kept — do
# not delete. cava.raw.conf (sink MONITOR) is the live ear.
#
# The default profile (cava.raw.conf) reads the sink MONITOR. This one
# listens on the default capture device (@DEFAULT_SOURCE@ is PulseAudio/
# PipeWire's portable name — never a hardcoded device).
#
# Same frame contract as cava.raw.conf: raw ascii, 12 bars, 0..1000.

[general]
bars = 12
framerate = 45
autosens = 0
sensitivity = 100
overshoot = 10

[input]
method = pulse
source = @DEFAULT_SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 45
