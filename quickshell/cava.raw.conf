# Nyxus Suxyn — cava profile for the shell's beat feed (Beat.qml).
# Raw ascii frames over stdout: "0;12;340;…;\n", 12 bars, 0..1000.
# One persistent process, started/stopped by Beat.qml — never per-frame.
#
# Owner 2026-08-19: this is the REAL beat (playback sink, not the mic).
# autosens OFF so a silent device cannot be pumped into a fake pulse.
# Beat.qml rewrites `source` at runtime to the sink that currently has
# playback (nyxus-beat-tap.sh). `auto` here is only the fallback: it is
# the default sink, which is wrong when the default is HDMI and music
# is on Headphones.

[general]
bars = 12
framerate = 45
autosens = 0
sensitivity = 100
overshoot = 10

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 45
