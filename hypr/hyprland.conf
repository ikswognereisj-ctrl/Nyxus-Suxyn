monitor=,preferred,auto,1

$mod = SUPER

# ── Autostart ────────────────────────────────────────────────────────────────
# PATH (rev 2026-07-29): there is deliberately NO `env = PATH,...` line here.
#
# There used to be one, spelling out an absolute PATH so ~/.local/bin was
# reachable when a display manager (not a login shell) started the session.
# Two things make that both unnecessary and actively harmful now:
#
#   1. `env = PATH,<list>` REPLACES PATH outright — Hyprland cannot prepend and
#      cannot expand $HOME. The list that shipped was captured off the BUILD
#      machine, so it hardcoded /home/gowski/... : a user that exists on no
#      installed system and not on the live ISO (the live user is `nyx`). It
#      therefore contributed three dead entries and, worse, DROPPED the real
#      user's ~/.local/bin — the very directory it was added to guarantee.
#   2. The fix belongs at the session entrypoint, and is already there:
#      nyxus-session-start (the Exec= of nyxus-hyprland.desktop, i.e. how every
#      greetd login enters the session) does
#      `export PATH="${HOME}/.local/bin:${PATH}"`. That is username-agnostic and
#      is inherited by Hyprland and every exec-once child.
#
# The exec-once lines below additionally self-heal with an explicit
# `export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"` so the bar-restore chain
# is PATH-independent no matter how the session was launched. Every NYXUS
# binary also ships in /usr/local/bin, which is on the default PATH regardless.
#
# Do NOT reintroduce a hardcoded `env = PATH,...` line — it can only ever be
# correct for the one machine it was copied from.

# A2 FIX (2026-05-12): nyxus-bootstrap MUST be started before any
# nyxus-wait-bootstrap-gated line, otherwise the marker file
# ~/.nyxus/.bootstrapped never gets written and every gated exec-once
# below blocks for 120s then runs against a half-installed system.
# Run unconditionally (it self-gates via marker + version check).
exec-once = nyxus-bootstrap >>/tmp/nyxus-bootstrap.log 2>&1
# ── THE DESKTOP SHELL ────────────────────────────────────────────────────
# One Quickshell instance renders the bottom taskbar, the Start menu and the
# quick-settings flyout. It reads ~/.config/quickshell/shell.qml (symlinked
# to the shell/ tree). eww was the previous framework and is DELETED — do not
# reference nyxus-persist-login, nyxus-eww-launch-safe, or eww anywhere here.
#
# BAR/WALLPAPER RACE (2026-07-26): exec-once lines fire in parallel, so the
# shell's exclusive-zone surface can claim screen space before the wallpaper
# exec-once (further down) has a frame up — a brief solid box behind the bar on
# a cold boot. Short head-start delay, not a bootstrap/network gate.
# THE SHELL KEEPS A LOG (2026-08-12). Until now `qs` inherited Hyprland's own
# stdout and stderr, which under greetd are BOTH /dev/null — verified on the
# owner's running session by reading /proc/<pid>/fd/1 and fd/2. So every QML
# warning, every shader compile failure and every runtime error the shell has
# ever produced was discarded at the moment it happened.
#
# That is why `WIP-393` — the Start menu's living paint not rendering — has now
# been reported three times and "fixed" twice without anyone finding a cause:
# the config was always clean, the shaders were always present, the code path
# always read correctly, and the one artefact that would have named the fault
# went to /dev/null. An investigation that cannot fail is not an investigation.
#
# Appended, never truncated, so a fault that only happens at login survives to
# be read afterwards. If it ever grows, that is a bug worth seeing, not a
# reason to silence it again.
# WIP-632 (2026-08-15): THE SHELL IS SUPERVISED NOW. This line used to start
# `qs` directly, once, and that was the whole story — so when earlyoom
# SIGKILLed the shell at 1.71 GB on the 08-13 image, the bar, the Start menu,
# the flyout and the launcher went away and STAYED away for the rest of the
# session. `nyxus-shell-supervisor` starts the shell and restarts it when it
# dies (Restart=on-failure semantics: a clean exit 0 is deliberate and is
# respected), with a crash-storm cap so a shell that cannot survive its own
# start — WIP-643's zero-output launcher crash — does not hot-loop under
# memory pressure. It also pins the shell's oom_score_adj to the session's
# floor while nyxus-session-start raises the rest of the session above it, so
# the shell is now the LAST thing an OOM killer reaches instead of the first.
# Read that script before changing this line; it carries the reasoning,
# including why this is not a systemd user unit (graphical-session.target is
# never pushed in this profile).
#
# WIP-642's SESSION-scoped guard moved INTO that script and is unchanged in
# behaviour: quickshell's own registry decides whether an instance already
# serves THIS session's display, so a nested preview beside a live desktop
# still gets its own shell, and a duplicate on the same display still skips.
# Moving it out of this file also puts it past the trap that guard was written
# around — Hyprland substitutes `$VARS` here AT PARSE TIME from its OWN
# environment, and a nested compositor's own WAYLAND_DISPLAY is its PARENT'S
# socket, so a literal `$WAYLAND_DISPLAY` in this file baked in wayland-1 and
# skipped forever. A shell script has no such parser. `$HOME`/`$PATH` below
# survive the substitution only because their parse-time and runtime values
# coincide. Also: nothing in this line may contain a literal hash — Hyprland
# comments start anywhere, including inside quotes.
#
# The supervised command is passed as an argument on purpose: this line still
# names `qs`, which is what build-iso.sh's autostart assert reads.
# Audit 2026-09-08: the shell must render on the AMD iGPU that Hyprland
# composites on. nyxus-session-start exports __NV_PRIME_RENDER_OFFLOAD=1 for
# the whole session, which put qs on the RTX 5050 (cross-GPU blit every frame,
# ~45% of a core idle) and leaked ~100 MB of NVIDIA driver memory on every
# hot-reload (35 reloads = 3.6 GB). Unset it for the shell only.
exec-once = sh -c 'unset __NV_PRIME_RENDER_OFFLOAD __GLX_VENDOR_LIBRARY_NAME; export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; exec nyxus-shell-supervisor qs' &
# [suxyn] exec-once = systemctl --user start nyxus-missiond.service
#
# ── REMOVED 2026-08-12: nyxus-dockd / -hotkeyd / -snapd / -qsd ──────────
# Four services were started here whose payloads exist in NO tree this build
# installs from. `build-iso.sh` stages `artifacts/api-server/nyxus-scripts/`
# to `/opt/nyxus-cache`, never `/opt/nyxus`, and nothing in the bake or in
# `nyxus_install.sh` ever put these four at the `ExecStart` path their units
# named — so three of them failed at every login of every ISO ever shipped,
# silently, visible only in the journal.
#
# They were never chosen. All five arrived in `7e677f2` (2026-08-03), the
# bulk copy of the 1018 files the migration had missed — "590 kept, 428
# stripped" — kept by a filter, not by a decision, and never edited since.
#
# Every one was already superseded by something this build actually ships:
#   nyxus_qsd     served the eww quicksettings panel — eww is DELETED
#   nyxus-fog     drew fog for waybars — waybar is not packaged
#   nyxus_dockd   drove the NYXUS dock — the dock is Quickshell
#   nyxus_snapd   Magnet-style snapping — `nyxus-snap-window` does that,
#                 bound to $mod+arrows in nyxus-window-mode.conf
#   nyxus_hotkeyd owned the keymap via hotkeys.toml — the binds live in this
#                 file, and Super+L is bound directly to `loginctl
#                 lock-session` below, so no lock route ever depended on it
#
# Gate 13ur holds all of it. Do not reintroduce: a dock, a snapper or a
# hotkey daemon is a decision to take in the open, not a unit file quietly
# pointing at a path that does not exist.

# ── Tier A polish (rev 2026-05-14): KDE Connect tray + EasyEffects EQ ──
# kdeconnectd: device discovery & file/text share daemon (NYXUS Drop)
# kdeconnect-indicator: tray icon w/ device list
# easyeffects --gapplication-service: keeps the audio pipeline pre-warmed
# so SoundPage's preset switcher applies instantly.
exec-once = /usr/bin/kdeconnectd
exec-once = kdeconnect-indicator
exec-once = easyeffects --gapplication-service

exec-once = hypridle
# NO dunst, and no swaync — Quickshell IS the notification daemon.
# shell/Sys.qml runs a NotificationServer that owns
# org.freedesktop.Notifications and feeds the flyout list and
# Toasts.qml. Whichever daemon takes that bus name first wins, so a
# second one here is not a fallback, it is a coin toss over which skin
# the user sees — and only Quickshell's wears Nyxus Glass.
#
# This line WAS `exec-once = dunst`, deleted at bake time by
# build-iso.sh's "notification daemon" stage. Declared here instead on
# 2026-08-05 (WIP-59): a config that reads one way in git and another
# on the stick is unreviewable, and the preview session seeds from THIS
# file, so every preview was running dunst against Quickshell while the
# ISO was not. build-iso.sh now asserts the absence rather than editing
# it in. Do not re-add either daemon without deleting the server in
# shell/Sys.qml first.
# Alien desktop companion — DISABLED until the full-body game-character
# redo lands (bust-on-saucer was wrong). Re-enable with:
#   exec-once = nyxus-wait-bootstrap sh -c 'sleep 8; nyxus-companion start'
# exec-once = nyxus-wait-bootstrap sh -c 'sleep 8; nyxus-companion start'
# NYXUS cosmic sound theme (rev 2026-07-14) — login/startup chime. The
# short sleep lets PipeWire settle so the first sound isn't dropped;
# nyxus-sound fails silent if audio is unavailable or the theme is muted.
# Alien desktop companion — DISABLED until the full-body game-character
# redo lands (bust-on-saucer was wrong). Re-enable with:
#   exec-once = nyxus-wait-bootstrap sh -c 'sleep 8; nyxus-companion start'
# exec-once = nyxus-wait-bootstrap sh -c 'sleep 8; nyxus-companion start'
# NYXUS cosmic sound theme (rev 2026-07-14) — login/startup chime. The
# short sleep lets PipeWire settle so the first sound isn't dropped;
# nyxus-sound fails silent if audio is unavailable or the theme is muted.
exec-once = sh -c 'sleep 4; nyxus-sound login'
exec-once = sh -c 'sleep 1; for p in $(pgrep -x hyprlock 2>/dev/null); do kill "$p" 2>/dev/null || true; done'
# live-wallpaper aware: starts mpvpaper if the user enabled the living
# wallpaper, otherwise falls through to the stock still-image autostart.
# USB 08-26: a lone awww-daemon exec-once mapped an empty layer for ~3s
# (greeter still / wrong wall) before img ran. Do not start the daemon
# without a picture. wallpaper-autostart starts it, waits for query, then
# imgs the hero with transition none. live-wallpaper auto after that so
# LIVE=on can replace the still. Do not start nyxus-ws-wallpaperd (13pq).
exec-once = sh -c 'export NYXUS_WALL_TRANSITION=none NYXUS_WALL_TRANSITION_DURATION=0; /usr/local/bin/nyxus-wallpaper-autostart; command -v nyxus-live-wallpaper >/dev/null && nyxus-live-wallpaper auto || true'
# Per-workspace wallpapers went with the station/deck layer. The daemon read
# workspaces.json, whose only content was the alien station matrix (OPS/FORGE/
# GHOST/PULSE/WAVE), and each entry pinned an alien wall -- so on every login
# it repainted nyxus-urban-alien.png over the theme wallpaper the bake had just
# staged. That is why the first Suxyn ISO booted wearing the alien mural.
# This build uses plain virtual desktops: one wallpaper, from wallpaper.conf.
# nyxus-ws-wallpaperd — the per-workspace wallpaper daemon — is INTENTIONALLY
# commented out; gate 13pq fails the build if this line comes back live. The
# unit still ships because nyxus-live-wallpaper's off-path hands the background
# back to it — the full intent is documented in the unit file itself, and the
# graphical-session.target class decision is WIP-529's.
# exec-once = systemctl --user start nyxus-ws-wallpaperd.service
exec-once = nyxus-wait-bootstrap sh -c 'hyprctl setcursor NYXUS-Aurora 24'
# hyprpolkitagent — the Wayland-native polkit agent. The old
# polkit-gnome agent is X11/GTK and does NOT present its prompt on
# Hyprland, so every pkexec action (Calamares install, Settings root
# helpers) silently did nothing — the REL-2 blocker, 2026-08-08.
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface accent-color slate

# ── DESKTOP COMPLETENESS ─────────────────────────────────────────────────
# Everything below was already PACKAGED and never STARTED. That is the exact
# way a build ends up feeling unfinished — not an empty box, a box full of
# parts. Each of these was found by scripts/audit.sh item 8, which checks that
# a capability has a package AND something that starts it AND a place a user
# can find it. Do not remove one without removing its package and its Settings
# page too.

# Right-click menu and desktop icons. Built, staged, and nothing launched it.
# Desktop layer: started once from conf.d/nyxus-services.conf (WIP-34).
# Do not add a second exec-once here — two BOTTOM layers race.
# Clipboard history + removable media: BOTH now start ONLY from
# conf.d/nyxus-services.conf, guarded with command -v (WIP-168, 2026-08-08).
# They used to be launched raw here AND in the shard, so cliphist got two
# watchers per type and udiskie two automount daemons every login — the same
# duplicate-daemon class as WIP-34. Removed from here; the guarded shard wins.

# XDG autostart. ~/.config/autostart/ shipped and nothing read it, so the
# entries Settings writes could never fire. dex is the reader.
exec-once = dex --autostart --environment Hyprland

# ── NYXUS Native GTK4 Apps — launch at startup ───────────────────────────────
# SysMon is on-click only (waybar icon launches it). No auto-launch on workspace 6.
# NYXUS Home — dashboard on named workspace "0" (its OWN page, completely
# outside the numbered 1-10 range so the user keeps every numbered slot free
# for future pages they're planning to add).
# Pin the home window to workspace name:0 no matter where it spawns from.
# DISABLED 2026-07-26: this launches the nyxus-home GTK app, which renders an
# EMPTY window - the grid builds fine (verified: _build_grid returns a live
# GtkGrid) but nothing ever paints. Six modules were also missing from the
# deployed ~/.nyxus/nyxus-home copy (hud/deck/hero/aurora/sentinel/notif) and
# have been restored from ~/.config/nyxus/nyxus-home.
# Owner wants persistent eww WIDGETS pinned to the HOME station instead of a
# maximised app window - re-enable only if that app is ever fixed.
# exec-once = [workspace name:HOME silent] sh -c 'sleep 1 && nyxus-home'
#
# HOME STATION DECK (2026-07-27). The eww `home-deck` window IS the home page.
# eww layer-shell surfaces bind to a MONITOR, not a workspace, so the deck
# cannot hide itself - nyxus-home-deck follows the Hyprland socket2 stream and
# opens it on HOME / closes it everywhere else. Without this exec-once nothing
# ever launches that watcher, so the deck never comes back after a reboot.
# [suxyn] exec-once = sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; exec nyxus-wait-bootstrap nyxus-home-deck'
# Super+Home → NYXUS Home workspace · Super+Shift+Home → relaunch if closed
# (was `name:0`; the station was renamed to name:HOME on 2026-07-26, so the old
#  bind landed on a stray workspace that is not the home page.)
# Super+Home/End/Delete used to jump to named HOME/START/LAB stations.
# Stations are deleted (AUDIT-PLAN item 7); keep the keys free rather than
# stranding users on a named workspace that no longer has a product meaning.
# [suxyn] bind = $mod, Home, workspace, name:HOME
# [suxyn] bind = $mod, End, workspace, name:START
# [suxyn] bind = $mod, Delete, workspace, name:LAB
# [suxyn] bind = $mod SHIFT, Home, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; pkill -f nyxus-home-deck; exec nyxus-home-deck'
# Super+End -> the big NYXUS Start panel (its own station). Replaces the
# nyxus-start GTK4 app, which sat on the OVERLAY layer and could not be
# closed or moved when it did not hold keyboard focus.
# [suxyn] bind = $mod, End, workspace, name:START
# Super+Delete -> LAB, completing the named-station nav cluster (Home=HOME,
# End=START, Delete=LAB). LAB shipped as a named workspace with NO keybind and
# NO rail pill (the rail loop only covers the numbered 1-10 matrix), so it was
# reachable only via `hyprctl dispatch workspace name:LAB` - a real gap, and the
# reason the "half-station" recommendation is: named annex stations need a bind
# added here to be first-class. See docs/PROJECT_INVENTORY / HANDOFF.
# [suxyn] bind = $mod, Delete, workspace, name:LAB
# [suxyn 2026-08-06, WIP-109] The escape hatch that killed nyxus-start is gone
# with the app. It was here because the forked build's GTK start menu sat on
# the OVERLAY layer and could trap the screen; that menu is no longer shipped
# or installed, and nyxus_install.sh's cleanup now REMOVES it from machines
# that already had it. Gate 15dead flagged this line the moment the target
# stopped existing, which is exactly the point of that gate — a keybind that
# does nothing is worse than no keybind, because the user thinks they have one.
# bind = $mod SHIFT, End, exec, pkill -f 'nyxus-start/main.py'
# Force-close the START search overlay. It is the ONE eww window that takes
# keyboard focus (eww 0.5 only offers EXCLUSIVE interactivity), so it gets a
# compositor-level escape hatch that does not depend on the window itself.
# NOTE: was $mod SHIFT, S (scratchpad) then SHIFT, X (prism-pulse) - both
# (movetoworkspace special:magic) further down this file, and the duplicate
# failed the repo's ISO-readiness validator ("duplicate keybind chords").
# [suxyn] bind = $mod SHIFT, Z, exec, eww close start-search
# WIP-36: $mod SHIFT N force-launched the alien lore terminal. Removed with its
# autostart below — a keybind is still a way for a user to meet it by accident.
# The live cheatsheet is Super+/.

# ── First-Boot Welcome Wizard ─────────────────────────────────────────────
# Runs ONCE on first interactive login. The launcher script self-gates
# via ~/.config/nyxus/welcome.done — once that file exists, this becomes a no-op.
# Quietly exits in 2s on subsequent boots (no startup-time penalty).
# Must call /usr/local/bin/nyxus-welcome (verify-profile + first-boot autostart).
exec-once = nyxus-wait-bootstrap sh -c '[ -f "$HOME/.config/nyxus/welcome.done" ] || (sleep 3; /usr/local/bin/nyxus-welcome)'

# ── Welcome Transmission (rev 2026-07-24) — borderless kitty poem/riddle ────
# ── Welcome Transmission — REMOVED 2026-08-05 (WIP-36); re-removed after
# Copilot port 02677b5 reintroduced it. Full-screen kitty horror lore has
# no place on a daily-driver first login. Script retired separately.


# ── NYXUS Floating Widgets — uncomment to pin to desktop ─────────────────────
# exec-once = /usr/local/bin/nyxus-weather &
# exec-once = python3 ~/.nyxus/nyxus_stickies.py &
# exec-once = /usr/local/bin/nyxus-notepad &

# ── Environment ──────────────────────────────────────────────────────────────
env = GTK_THEME,adw-gtk3-dark
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,NYXUS-Aurora
env = HYPRCURSOR_THEME,NYXUS-Aurora
env = HYPRCURSOR_SIZE,24
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_ENABLE_HIGHDPI_SCALING,1
env = QT_SCALE_FACTOR,1
env = QT_FONT_DPI,96
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct   # WIP-342: the Qt6 plugin registers ONLY the qt6ct key (libqt6ct.so) — qt5ct sent every Qt6 app looking for a plugin that is not there, and they all fell back UNTHEMED. Kvantum is the cross-Qt5/Qt6 answer; see WIP-343.
# Input method (WIP-118). Mirrors /etc/environment.d/95-nyxus-input.conf,
# which covers the D-Bus/user-unit population this block cannot reach; the two
# must agree. GTK_IM_MODULE is deliberately NOT set — GTK3/4 speak text-input-v3
# natively on wlroots and fcitx5 asks users to unset it. See that file for the
# citation before adding it here.
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland

# ── GPU env is now DETECTED, not forced (WIP-149, 2026-08-08) ──────────────
# The NVIDIA video/GLX env used to be hardcoded here for every machine, which
# broke hardware video on AMD/Intel-only boxes (they don't have the nvidia
# driver those vars point at). It now lives in nyxus-session-start, which
# exports it BEFORE `exec Hyprland` and ONLY when an NVIDIA card is actually
# present — so this build is no longer welded to one RTX laptop. Do not
# re-add unconditional `env = LIBVA_DRIVER_NAME,nvidia` here.

# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        # Windows convention (FAMILIARITY_SPEC §0): scrolling down moves the
        # content down. `true` is macOS's "natural" direction and was shipping
        # as this build's global default, which is neither platform's Windows
        # behaviour and the first thing a Windows user notices.
        natural_scroll       = false
        disable_while_typing = true
        tap-to-click         = true
    }
}

# ── Touchpad gestures (rev 2026-07-07) ───────────────────────────────────────
# 3-finger horizontal swipe glides between workspaces with live preview —
# pairs with the slidefade workspace animation for a liquid page-turn feel.
# (4-finger-down for Mission Control stays parked in the mission shard.)
gesture = 3, horizontal, workspace

# ── General ──────────────────────────────────────────────────────────────────
general {
    gaps_in     = 6
    gaps_out    = 14
    border_size = 1
    # EMISSION rim — fallback copy of the ring in nyxus-cometfire.conf, which
    # is sourced last and OWNS it (nyxus-hyprland-general.conf keeps a matching
    # copy for the same reason). This stays so the desktop keeps its ring if
    # the shards are ever removed.
    #
    # ⚠ IT USED TO KEEP A DIFFERENT RING, AND THAT IS THE WHOLE POINT OF THIS
    # NOTE. These two lines were the four-stop pre-rose galaxy sweep —
    # 0aa2d6 / 064f95 / 1e03ad / 521e72 at 270deg — while both shards carry the
    # eight-stop alternating rose. A fallback whose job is to preserve the look
    # when a shard goes missing, but which preserves a DIFFERENT look, is worse
    # than no fallback: it reverts the build's identity silently, at the exact
    # moment nobody is watching, and it reads as correct to anyone who opens
    # this file. nyxus-hyprland-general.conf:35 states the rule it was itself
    # breaking — "when the two disagreed, whichever was read last silently won
    # and the other looked like a lie to the next person who opened it."
    #
    # Do not "simplify" this back to the five-stop galaxy sweep. The ring is
    # deliberately ONE hue family with alternating lightness, rebuilt
    # 2026-08-08 after the owner photographed the old ten-stop version and
    # reported it as grey: adjacent dark stops on a 3 px border integrate to
    # their own mean. The reasoning and the three rules that protect it are in
    # nyxus-cometfire.conf; that file owns this, not this one.
    # ── WIP-531 · 2026-08-12 — THE HOT PINK COMES OUT OF THE WINDOW RIM ──────
    # The owner, from a photograph of his own Store window: "that pink i dont
    # want i want what i sent you in that screenshot earlier of the widgets and
    # right click". He kept the GLOW deliberately -- "thats just the glow around
    # the edge i like that" -- so only the rim colour changes here.
    #
    # It carried EIGHT stops including three near-whites: ffb3d9 (255,179,217),
    # ff8fc7 (255,143,199) and d765a2 (215,101,162), all at FULL alpha across a
    # 3px border with nothing painting over them. Measured against the two
    # surfaces he approved -- the desktop widgets and the shelf right-click menu
    # -- those run red-over-green +76 to +114 where his reference sits at +1.6
    # to +2.4. That is the whole complaint, in numbers.
    #
    # Now SIX stops peaking at #ae206c, anchored twice on #891955, which is
    # Theme.qml's `plumBody` -- the exact token the widget rim and the shelf
    # menu border already wear. Same family, same identity, no near-whites.
    #
    # Stops dropped from EIGHT to SIX on purpose: this file's own note warns
    # that too many dark stops on a thin border average out to grey, and the
    # owner has objected to "dull" before. Fewer, wider bands keep the sweep
    # readable at 3px while the peak comes down.
    #
    # ⚠ #d765a2 IS NOT BANNED -- it is still the button ACTIVE state and gate
    # 13uk asserts it at line ~7876 as "d765a2:active". It leaves the
    # WINDOW RIM only. Do not purge it globally to make this look tidier.
    #
    # ⚠ THIS DECLARATION LOSES, AND IT IS THE FALLBACK RING (WIP-351).
    # This file declares the ring inline HERE and then, much further down,
    # sources nyxus-hyprland-general.conf and afterwards nyxus-cometfire.conf —
    # both of which declare it again, so cometfire is what actually lands and
    # this line never reaches the screen while the shards are present. It exists
    # so the desktop keeps its identity if the shards are removed, which is why
    # verify-profile gate 13um already asserts this value is byte-identical to
    # nyxus-cometfire.conf's. Do NOT restate the sourcing line numbers here; the
    # ones this comment used to carry were already stale. Gate 20 in
    # scripts/audit.sh derives the order and the winner from the files.
    # scripts/nyxus-galaxy-pulse.sh keeps the brighter pulse palette
    # deliberately -- a manual SUPER SHIFT X effect, not the resting rim.
    #
    # ── WIP-777 · 2026-08-17 — THE RING CLEARS THE 3:1 STATE FLOOR ──────────
    # Owner ruling: the focused-window ring is STATE and must clear 3:1 per
    # stop. Old stops measured 1.13 / 2.27 / 1.54 / 3.14 / 1.23 / 2.27 on the
    # ground token (void #020506) — five of six positions under the floor.
    # #2e0819, #5c0f38 and #3d0a22 were in no ramp at all (they appear in
    # accent.json only inside the _unruled_darks prose string) and #891955 is
    # the RETIRED accent-hairline rung. The full derivation and the ladder gap
    # it exposed are written once, in nyxus-cometfire.conf beside the
    # declaration that lands. 08-20 ice: glacier[0]/[5], same as cometfire.
    col.active_border   = rgba(7fe8ffff) rgba(b7e6f2ff) rgba(7fe8ffff) rgba(b7e6f2ff) rgba(7fe8ffff) rgba(b7e6f2ff) 45deg
    # SEAM, not state — classified 2026-08-17. Ice hairline/deep, same alphas
    # as `$nyxInactiveBorder` in general.conf. Must match cometfire (winner).
    col.inactive_border = rgba(4f7fa633) rgba(274b7a26) 135deg

    layout           = dwindle
    resize_on_border = true
}

# ── Decoration ───────────────────────────────────────────────────────────────
decoration {
    # Owner ruling 2026-08-17: 12 -> 18. 12 is `radiusSm` in shell/Theme.qml
    # (~line 468) -- the SMALL rung -- and it was being worn by a window, the
    # largest surface in the system. NYXUS_GLASS_DESIGN_LANGUAGE.md rev 3
    # §4.14 gives a window the largest non-pill rung, which is `radius` = 18
    # (Theme.qml ~line 467). docs/DESIGN_LANGUAGE_HORIZON_2026-08-03.md
    # delegates the radius ladder to Theme.qml, so Theme.qml is where the
    # number comes from -- do not re-derive it here.
    #
    # ⚠ conf.d/nyxus-hyprland-general.conf ALSO declares `rounding` and is
    # sourced at line ~998, i.e. after this block, so ITS value is the one
    # that actually lands. Both were moved together; editing one alone is how
    # "I changed it and nothing changed" happens.
    rounding = 18

    # Inactive opacity kept light so stacked windows stay legible. The old
    # 0.88 combined with passes=3 below caused the "blurred soup" effect
    # where browser tabs underneath an active window became unreadable.
    # HIGH BLUR mode (rev 2026-05-06w): big Dual-Kawase kernel + 4 passes
    # for deep frosted-glass behind every window. Inactive opacity dropped
    # to 0.85 so the cosmic wallpaper reads strongly through stacked windows.
    # Transparent frosted desktop (Phase 5 rev 2026-07-14): windows ride a
    # touch lower so the cosmic wallpaper reads through the deep blur while
    # text stays legible. Tune here if any app gets too see-through.
    # ── FULL COLOUR. The glass is the APP's, not the compositor's. ────────
    # Owner, 2026-08-11: "i want the glass look of course but i want full
    # color as well i dont like the dull look at all."
    #
    # These were 0.90/0.80 and that was glass applied TWICE. gtk-4.0/gtk.css
    # already paints every window `background-color: rgba(3, 7, 10, 0.66)` —
    # the app carries its own glass and Hyprland blurs the wallpaper through
    # the 34% left open. Multiplying that by a further 0.90 here meant the
    # colour a window actually painted arrived at ~0.59 strength, and the
    # frost was doing the work twice while the colour only got applied once.
    # That is the dullness, and no amount of retuning the blur fixes it,
    # because the blur was never the part that was wrong.
    #
    # At 1.00 the material is unchanged — the window is still translucent,
    # still blurred, still glass — but every pixel the app draws lands at
    # full saturation. This is also what gtk.css means by "legibility no
    # longer depends on a compositor setting in a different file".
    active_opacity   = 1.00
    inactive_opacity = 1.00

    blur {
        enabled           = true
        size              = 14     # kernel radius per pass — HIGH
        passes            = 4      # 4 passes = deep frosted glass
        new_optimizations = true
        xray              = true   # sample wallpaper only, no smear
        noise             = 0.015
        # ⚠ brightness/vibrancy/contrast are NOT set here on purpose.
        # conf.d/nyxus-hyprland-blur.conf is sourced further down this file
        # (the `source =` block near the end) and sets them last, so it wins:
        # brightness 1.00, vibrancy 0.42, contrast 1.10. This block used to
        # ALSO declare brightness = 0.92 and vibrancy = 0.30, i.e. the same
        # settings at two different values in two files, with only the source
        # ORDER deciding the outcome. The stale pair sat here looking
        # authoritative and is exactly how the next person "fixes" the dull
        # look and finds nothing changes. One owner per setting.
        popups            = true
        popups_ignorealpha = 0.20
        ignore_opacity    = true   # blur even fully-opaque windows
    }

    # GALAXY drop shadow — pure ink, no bloom, no color.
    # Sits behind every window as real shadow on the wallpaper.
    shadow {
        enabled        = true
        range          = 36
        render_power   = 3
        sharp          = false
        color          = rgba(7fe8ff3d)
        color_inactive = rgba(00000033)
        offset         = 2 4
    }

    # TRK-3375 — GLACIER GLOW (native, new in Hyprland 0.55). The focused
    # window carries a soft glacier bloom the compositor draws itself; the
    # colours are the theme's own edge rungs (bright ice for focus,
    # glacier[4] for rest) at low alpha, so this is the shell's existing
    # edge-glow language, promoted to a real compositor decoration. Proven
    # live on TTY1 via hyprctl before landing here.
    glow {
        enabled        = true
        range          = 22
        render_power   = 3
        color          = rgba(7fe8ff2e)
        color_inactive = rgba(4f7fa61f)
    }
}

# ── Animations ───────────────────────────────────────────────────────────────
animations {
    enabled = true

    # ── Spring-approximating beziers (rev r15 · 2026-05-10) ─────────────
    # Hyprlang has no native spring curves (those landed in the new Lua
    # API in 0.55); these beziers fake spring physics by using overshoot
    # control points, so windows "land" onto the desktop with a subtle
    # settle instead of a flat ease-out. Tuned conservatively to stay on
    # the GALAXY side of polished — no clownish bounce.
    bezier = nyx-spring, 0.34, 1.36, 0.64, 1.0
    # ↑ gentle back.out — ~6% overshoot, settles in one motion
    bezier = nyx-glass,  0.16, 1.0,  0.2,  1.0
    # ↑ critically-damped settle — feels like landing on glass, no bounce
    bezier = nyxus,      0.05, 0.9,  0.1,  1.05
    bezier = nyx-out,    0.4,  0.0,  1.0,  1.0
    bezier = overshoot,  0.1,  0.85, 0.1,  1.18
    bezier = nyx-soft,   0.25, 0.46, 0.45, 0.94
    bezier = nyx-sharp,  0.16, 1.0,  0.3,  1.0
    bezier = linear,     0.0,  0.0,  1.0,  1.0

    animation = windows,          1, 4,  nyx-glass,  slide
    animation = windowsIn,        1, 5,  nyx-spring, popin 92%
    animation = windowsOut,       1, 3,  nyx-out,    popin 60%
    animation = windowsMove,      1, 4,  nyx-glass,  slide
    animation = border,           1, 10, default
    animation = borderangle,      0
    animation = fade,             1, 5,  nyx-out
    animation = fadeIn,           1, 4,  nyx-glass
    animation = fadeOut,          1, 3,  nyx-out
    animation = workspaces,       1, 5,  nyx-spring, slidefade 15%
    animation = specialWorkspace, 1, 5,  nyx-glass,  slidevert
}

# ── Layout ───────────────────────────────────────────────────────────────────
# rev r8-eww 2026-05-11 — Hyprland 0.55+ removed `dwindle:pseudotile`
# (the pseudotile *dispatcher* still exists; only the config option was
# dropped). `preserve_split` survives. Empty `master {}` block also
# removed — 0.55+ rejects empty plugin blocks with a parse error.
dwindle {
    preserve_split = true
}

# ── Misc ─────────────────────────────────────────────────────────────────────
# rev r8-eww 2026-05-11 — Hyprland 0.55+ removed `misc:vfr` (VFR is now
# always-on, controlled per-monitor). Other options survive.
misc {
    # ★ LOCK-SCREEN RESCUE (rev 2026-07-31). If the lock app dies while the
    # session lock is held, Hyprland keeps the session locked with nothing
    # drawing it — the "Oopsie daisy, the lockscreen app died" screen — and
    # the only way back is a TTY. With this on, the lock can be RESTORED:
    #     hyprctl dispatch exec hyprlock
    # from a TTY, instead of being stranded. The owner hit this for real.
    # Never SIGKILL hyprlock while the session is locked.
    allow_session_lock_restore = true
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    focus_on_activate        = true
    # freeform-mode motion polish (rev 2026-07-07): manual drags and
    # resizes glide with the nyx-glass bezier instead of jumping —
    # floating windows feel physical.
    animate_manual_resizes        = true
    animate_mouse_windowdragging  = true
}

# hide the cursor after 5 idle seconds — keeps the living wallpaper
# and glass stack clean when you're just reading or listening
cursor {
    inactive_timeout = 5
}

# Apps come to front when clicked via misc.focus_on_activate=true (above).
# Note: bringactivetotop is NOT a valid hyprland windowrule keyword.


# ─────────────────────────────────────────────────────────────────────────────
# KEY BINDINGS
# ─────────────────────────────────────────────────────────────────────────────

# ── Apps ─────────────────────────────────────────────────────────────────────
# rev r24 (2026-07-14 · Phase 3) — the terminal binds a REAL terminal directly
# (kitty -> alacritty -> foot). The old $mod+Return ran nyxus_terminal.py (the
# "Cosmic Terminal"), which was broken. App launching is consolidated onto ONE
# key: $mod+Space (native nyxus_launcher.py, with a rofi/wofi fallback). The old
# duplicate drun launchers $mod+D (startmenu.rasi) and $mod+R (launcher.rasi) are
# REMOVED — press Super+/ for the live cheatsheet. $mod+Shift+D stays as the raw run prompt.
# ── ONE TERMINAL (2026-08-20) ──────────────────────────────────────────
# Ghostty is the Terminal (owner). Super+Return, Super+Shift+Return, the
# Start tile, the dock pin, and nyxus-terminal.desktop all exec ghostty.
# Ghostty only. No foot/kitty/alacritty fallback. Do not exec nyxus_terminal.py.
bind = $mod,       Return,  exec, ghostty
bind = $mod SHIFT, Return,  exec, ghostty
bind = $mod SHIFT, D,       exec, sh -c '(command -v rofi >/dev/null && rofi -show run) || (command -v wofi >/dev/null && wofi --show run)'
# Super+Tab → Task View (Windows muscle memory). Alt+Tab stays the window
# switcher (nyxus-window-mode.conf). The old rofi window picker is reachable
# from Start → search if needed.
bind = $mod,       Tab,     exec, qs ipc call nyxus taskview
# Super+E → the roster's OWN Files app (WIP-662). This chain used to try
# nautilus FIRST, and nautilus is in packages.x86_64, so the fallback never ran
# and the key opened GNOME Files: a different file manager from the one the
# Start menu's Files tile opens, the one 13q13 pins in the roster, and the only
# one wearing this build's chrome. nautilus stays in the chain behind it as the
# last thing that still works if nyxus-files is ever missing — a file-manager
# key that opens nothing is worse than one that opens the wrong window.
bind = $mod,       E,       exec, sh -c '(command -v nyxus-files >/dev/null && nyxus-files) || (command -v nautilus >/dev/null && nautilus) || xdg-open $HOME'
bind = $mod,       B,       exec, sh -c '(command -v chromium >/dev/null && chromium) || (command -v firefox >/dev/null && firefox) || (command -v chrome >/dev/null && chrome)'

# ── Lock / logout ─────────────────────────────────────────────────────────────
# NYXUS cosmic sound theme (rev 2026-07-14): Super+L routes through
# loginctl lock-session so hypridle's lock_cmd/unlock_cmd own the lock +
# unlock chimes (nyxus-sound lock|unlock — see hypridle.conf). Super+Shift+M
# plays the power-down chime just before Hyprland exits.
bind = $mod,       L,       exec, loginctl lock-session
bind = $mod SHIFT, E,       exec, wlogout --protocol layer-shell --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css -b 3 -c 0 -r 0 -L 0
bind = $mod SHIFT, M,       exec, sh -c 'nyxus-sound logout; sleep 0.7; hyprctl dispatch exit'
# Global mute toggle for the NYXUS sound theme (flips ~/.config/nyxus/sound.state)
bind = $mod SHIFT, A,       exec, nyxus-sound toggle
# Windows convention (FAMILIARITY_SPEC §0): Ctrl+Alt+Delete is the security /
# power screen. It was unbound here, so the one chord every Windows user tries
# when something is stuck did nothing at all. Note this is bare Ctrl+Alt — the
# Super-prefixed $mod CTRL ALT+L below is the separate lock chord.
bind = CTRL ALT,   Delete,  exec, nyxus-powermenu
# Windows convention (FAMILIARITY_SPEC §0): Ctrl+Shift+Escape is Task Manager.
# nyxus-sysmon (nyxus_sysmon_gtk.py) shipped with no keybind anywhere.
bind = CTRL SHIFT, Escape,  exec, nyxus-sysmon

# ── Window management ────────────────────────────────────────────────────────
bind = $mod,       Q,       killactive
# Super+M minimizes the focused window (no title-bar button). It stays on
# the bar Row; click the icon to bring it back. Super+Shift+M is logout.
bind = $mod,       M,       exec, qs ipc call nyxus minimize
# Windows convention (FAMILIARITY_SPEC §0): Super+V is clipboard history on
# Windows 10+, and this build already runs the cliphist daemon — so the chord
# a Windows user reaches for existed and did nothing here. `pick` is the same
# sub-command Settings invokes, so the bind survives either shim.
# [retired 2026-08-24] SUPER+V -> nyxus-clipboard pick. Old-build residue:
# that opens a ROFI picker, and the flyout owns clipboard now (SidePanel
# CLIPBOARD section, live cliphist, with an armed Clear history). Two doors
# to one feature, one of them wearing the old chrome.
# togglefloating moves onto the free Super+Shift+V rather than disappearing.
bind = $mod SHIFT, V,       togglefloating
bind = $mod,       P,       pseudo
# rev r8-eww 2026-05-11 — `togglesplit` dispatcher removed in Hyprland
# 0.55+. The dwindle layout still alternates split direction
# automatically; if you want explicit control, use `layoutmsg, togglesplit`
# (now namespaced under the layout dispatcher).
# Phase 3 (2026-07-14): moved OFF $mod+T (claimed by nyxus-tint in
# conf.d/nyxus-signature.conf — silent duplicate) onto the free $mod+J.
bind = $mod,       J,       layoutmsg, togglesplit
bind = $mod,       F,       fullscreen, 0
bind = $mod SHIFT, F,       fullscreen, 1
bind = $mod SHIFT, C,       centerwindow

# ── NYXUS Phase 2 — launcher / powermenu / screenshot / doctor ───────────────
bind = $mod, Space, exec, qs ipc call nyxus launcher
# TRK-1804 — Condition: what the machine is doing, and what needs you.
bind = $mod, C, exec, qs ipc call nyxus condition
# [suxyn] bind = $mod,       Escape,  exec, nyxus-overlay-open powermenu
# Hub / overlay escape hatch — plain Escape closes The Hub (and ANY other
# overlay/flyout) + restores bars. rev 2026-07-15: DENY-LIST gate — fires if
# ANY active eww window is open that isn't persistent chrome (bars/osd/dock),
# so it can never miss a window name (was missing quicksettings-daemon, etc.).
# All overlays are now :focusable false so this compositor bind always fires.
# WEDGE-PROOF (r2): the probe is `timeout`-bounded — a hung eww daemon makes
# the bare CLI block forever, which silently disabled this gate. If the probe
# itself fails/times out while an eww daemon process exists, that IS the
# wedged state → run nyxus-hub-close (it hard-recovers the daemon + bars).
# [suxyn] bind = , Escape, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(timeout -k 2 4 eww active-windows 2>/dev/null); rc=$?; n=$(printf "%s" "$out" | sed "s/:.*//" | sed "s/[[:space:]]//g" | grep -vE "^(bar-top|bar-bottom|bar-left|bar-right|osd-volume|osd-brightness|osd-mic|osd|dock|dock-reveal|snap-toast|notif-popup|)$" | grep -c .); { [ "$rc" -ne 0 ] && pgrep -x eww >/dev/null; } || [ "$n" -gt 0 ] && nyxus-hub-close'
# Always-on failsafe: Super+Shift+Escape force-dismisses everything, no gate.
# The bare `eww close nyxus-hub` runs FIRST and on its own: it is one socket
# round-trip, so the Hub is off the screen in milliseconds even if the longer
# recovery that follows is slow or fails outright. Before this, every single
# way out of the Hub -- both close buttons, the backdrop, plain Escape and
# this failsafe -- funnelled into nyxus-hub-close, so that one script was the
# only thing standing between the user and a fullscreen surface they could not
# dismiss. Cheap insurance against exactly that.
# [suxyn] bind = $mod SHIFT, Escape, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; timeout -k 1 3 eww close nyxus-hub 2>/dev/null; nyxus-hub-close'
# Last resort, no NYXUS script involved at all: close every eww window, then
# bring the bars back the sanctioned way. Use this if the Hub is stuck and
# Super+Shift+Escape did not clear it.
# [suxyn] bind = $mod CTRL SHIFT, Escape, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; timeout -k 1 4 eww close-all 2>/dev/null; nyxus-eww-launch-safe'
# [suxyn] bind = $mod,       grave,   exec, nyxus-overlay-open dashboard
# Screenshots go through the `nyxus-screenshot` shim, not `python3
# ~/.nyxus/…`. The shim resolves `${NYXUS_APP_DIR:-/opt/nyxus}`, so the same
# bind works on an installed system and in the preview session, where HOME is
# redirected and `~/.nyxus/` does not exist — which is why these silently did
# nothing there.
#
# Windows convention (FAMILIARITY_SPEC §0): bare PrtScn is FULL SCREEN and
# Shift+PrtScn is the region picker. These two shipped inverted, so every
# reflex a Windows user has here produced the other capture.
bind = ,            Print,  exec, nyxus-screenshot fullscreen
bind = SHIFT,       Print,  exec, nyxus-screenshot region
# Windows convention (FAMILIARITY_SPEC §0): Alt+PrtScn captures the ACTIVE
# WINDOW. The `window` mode already existed in nyxus_screenshot.py with no
# bare-Alt chord on it. Distinct from $mod ALT+Print (Super+Alt) below.
bind = ALT,         Print,  exec, nyxus-screenshot window
#
# ── REMOVED 2026-08-12: two chords were bound TWICE, with DIFFERENT actions ──
# The owner reported it as "my Super+PrtScr, I think two are coming up".
# He was right, and both were live:
#
#     SUPER, Print        -> nyxus-screenshot            (was here)
#     $mod, Print         -> nyxus-screenshot region     (nyxus-signature.conf:71)
#     SUPER SHIFT, Print  -> nyxus-screenshot window     (was here)
#     $mod SHIFT, Print   -> nyxus-screenshot fullscreen (nyxus-signature.conf:72)
#
# `$mod = SUPER` (line 8), so those are the same chord spelled two ways —
# and the second pair does something DIFFERENT from the first. The comment at
# line 805 of this file already says signature.conf owns these chords, and
# signature.conf's own comment at line 69 calls its copies "the surviving
# copies". Both were true of the intent and neither was true of the file: the
# cleanup was written down and never finished, so the duplicates outlived the
# note describing their removal.
#
# The bare `Print` and `SHIFT Print` above stay — signature.conf binds only the
# $mod variants, so those two do not collide with anything.
#
# ⚠ Gate `16dup` could not see this. It compares chords as TEXT, so `SUPER`
# and `$mod` read as two different modifiers. A gate that cannot resolve the
# variable it is checking cannot catch the most common form of the collision.
# Fixed in the same commit.
#
# Screen recording. `nyxus-record` (a wf-recorder wrapper) has shipped in both
# trees all along and `nyxus_screenshot.py` has carried video / video-stop /
# video-toggle modes — with NO KEYBIND ANYWHERE, so the capability existed and
# could not be reached. That is this build's oldest failure shape: a package
# and a helper with no way in.
bind = $mod ALT,    Print,  exec, nyxus-screenshot video-toggle
bind = $mod SHIFT, H,       exec, ghostty -e nyxus-doctor
# ── Security & lockdown ──────────────────────────────────────────────────────
# 2026-08-05 (ship audit). These two binds read:
#   bind = $mod SHIFT, Y,    exec, sh -c 'command -v nyxus-security ... || notify-send ...'
#   bind = $mod CTRL ALT, L, exec, sh -c 'command -v nyxus-security --panic ... || notify-send ...'
# `nyxus-security` is the NYXUS security build's control center. It was
# stripped at the fork on purpose (.migration/strip-pattern.regex names it) and
# ships nowhere in this tree, so both binds could only ever reach their else
# branch: two keyboard shortcuts whose entire behaviour was a red critical
# toast telling the user a thing they never asked for is missing. That is worse
# than no bind — a fresh user pressing Super+Ctrl+Alt+L in a hurry got an alarm
# instead of a locked screen.
#
# What replaces them is what this build actually has. Super+Shift+Y opens the
# Security page of the real control center (firewall, secure boot, USB
# firewall, VPN, DoH — nyxus_settings.py section key `security`, deep-linked
# the same way `nyxus-settings sound` is). Super+Ctrl+Alt+L locks the session,
# through the same loginctl path as Super+L, so the panic muscle memory lands
# on the one thing panic reliably meant.
bind = $mod SHIFT, Y,       exec, nyxus-settings security
bind = $mod CTRL ALT, L,    exec, loginctl lock-session
# The two lines that lived here bound Super+/ and Super+Shift+/ to
#   eww open --toggle hotkey-cheatsheet
# and were commented out when eww was cut (2026-08-03), which left the build
# with a cheat sheet script on disk and no way to reach it. The script is now
# a real rofi shortcut reference that reads the live bind tree, so the chord
# is live again — and it is the chord every other desktop uses for help.
bind = $mod,       slash,   exec, ~/.config/rofi/cheatsheet.sh
bind = $mod SHIFT, slash,   exec, ~/.config/rofi/cheatsheet.sh

# ── NYXUS easter egg — secret chord ──────────────────────────────────────────
# Super+Shift+X spins the prism border gradient 3 full revolutions.
bind = $mod SHIFT, X,       exec, ~/.config/hypr/scripts/nyxus-galaxy-pulse.sh
# Dream Protocol (unlocked by welcome-note riddle)
bind = $mod ALT, D,        exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; nyxus-dream'

# ── NYXUS living wallpaper toggle ────────────────────────────────────────────
# Super+Alt+V flips between the animated video wallpaper and the still.
bind = $mod ALT, V,         exec, nyxus-live-wallpaper toggle

# Old Super+G observatory (eww) was removed. Suxyn ships none of that.

# ── shell keybinds → Quickshell IPC (see shell.qml IpcHandler) ───────────
# Declared here rather than rewritten in at bake time, for the same reason as
# the shell autostart above: a config that says one thing in git and another on
# the stick is unreviewable. These previously toggled eww windows.
bind = $mod, A, exec, qs ipc call nyxus flyout
bind = $mod, N, exec, qs ipc call nyxus flyout
# Power menu — Lock / Sleep / Log Out / Restart / Shut Down, with a confirm on
# the destructive three. Also reachable from the Start menu footer, because a
# keybind nobody knows about is not a way out.
bind = $mod, X, exec, qs ipc call nyxus power
# ── the emoji & symbol picker (WIP-704 · GAP-B7 · GAP-923) ───────────────
# Super+. — the key Windows binds for exactly this, which is the whole point
# of a desktop whose bar is "someone who has never used Linux can boot it and
# use the machine all day". FREE: `period` appears in no other bind in
# hyprland.conf or in any conf.d drop-in (aurora / flair / window-mode /
# safemode / services), checked before it was taken. Gate 13q37 re-checks it,
# so a future bind cannot silently steal it back.
#
# It is a SHELL surface, not rofi. `rofi-emoji` is packaged and referenced by
# nothing, and WIP-557 is the row that records why a second unthemed rofi
# window is the defect and not the fix.
bind = $mod, period, exec, qs ipc call nyxus emoji
# [suxyn] bind = $mod,       W,       exec, eww open --toggle wifi
# [suxyn] bind = $mod,       M,       exec, eww open --toggle mixer
# [suxyn] bind = $mod,       C,       exec, eww open --toggle calendar
# [suxyn] bind = $mod SHIFT, B,       exec, eww open --toggle bluetooth

# ── Focus (arrow keys + WASD-style) ──────────────────────────────────────────
# [suxyn] moved to Super+Alt+left — Super+left is Aero Snap now
# bind = $mod, left,  movefocus, l
# [suxyn] moved to Super+Alt+right — Super+right is Aero Snap now
# bind = $mod, right, movefocus, r
# [suxyn] moved to Super+Alt+up — Super+up is Aero Snap now
# bind = $mod, up,    movefocus, u
# [suxyn] moved to Super+Alt+down — Super+down is Aero Snap now
# bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, K,     movefocus, u
bind = $mod, semicolon, movefocus, r

# ── Move windows ─────────────────────────────────────────────────────────────
# 2026-08-05 (ship audit): these were on $mod SHIFT + left/right, which
# conf.d/nyxus-window-mode.conf:29-30 also binds — to the top-left / top-right
# QUARTER SNAP. Same for $mod CTRL + left/right against its bottom quarters.
# window-mode is sourced after this file, so the quarter snap silently won and
# `movewindow`/`resizeactive` did nothing on the horizontal axis while working
# on the vertical: half a keymap, from the same key row. This is the third
# instance of the silent-duplicate-bind class already noted twice in this file.
#
# The quarter snaps stay where they are — HANDOFF: Aero Snap is the decided
# behaviour and window-mode owns the arrow cluster. The tiling-WM verbs move
# one modifier out, next to $mod ALT + arrow, which is where window-mode
# already relocated focus movement for exactly this reason.
bind = $mod ALT SHIFT, left,  movewindow, l
bind = $mod ALT SHIFT, right, movewindow, r
bind = $mod ALT SHIFT, up,    movewindow, u
bind = $mod ALT SHIFT, down,  movewindow, d

# ── Resize ───────────────────────────────────────────────────────────────────
bind = $mod ALT CTRL, left,  resizeactive, -40  0
bind = $mod ALT CTRL, right, resizeactive,  40  0
bind = $mod ALT CTRL, up,    resizeactive,   0 -40
bind = $mod ALT CTRL, down,  resizeactive,   0  40

# ── Workspaces ───────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ── Companion ("half") stations — Super+Alt+<digit> (2026-07-28) ─────────────
# Every numbered station has a companion station: Super+<digit> reaches the
# primary, Super+Alt+<digit> reaches its companion. The left rail shows each
# one as a small dim ALIEN GLYPH (Tifinagh) under its primary number; the ten
# labels live in the `half_marks` table in stations.json.
#
# TRK-3495 · the named-workspace station binds are GONE, not disabled.
# 21 commented-out `$mod ALT` / `$mod ALT SHIFT` binds sat here pointing at
# name:RELAY/ANVIL/TRACE/BEACON/MIXER/VAULT/SCAN/BOARD/SENTRY/RANGE. They went
# inert with the station layer itself (see the note further down: "removed with
# the station layer: nyxus-stations-named.conf") — the shard that declared
# those workspaces persistent no longer ships, so every one of those binds
# referred to a workspace nothing defines. The prose above them still read as
# though the binds were live, which is the part that could mislead: a reader
# greps for name:RELAY, finds ten hits, and concludes the feature is wired.
# Settings ▸ Rooms is a DIFFERENT feature (shell/Rooms.qml + RoomGrid.qml +
# Station.qml, with conf.d/nyxus-station.conf) and is unaffected by this.

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ── Scratchpad ────────────────────────────────────────────────────────────────
bind = $mod,       S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace,        special:magic

# ── Mouse ────────────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Media / Volume ───────────────────────────────────────────────────────────
# The four volume/mic binds were casualties of the eww excision: each chained
# `&& ~/.config/eww/scripts/osd-show.sh …`, and the [suxyn] pass commented the
# WHOLE bind instead of amputating the dead OSD tail — so on the owner's first
# hardware boot the volume keys did nothing (2026-08-08 finding). Restored
# with the working half; Play/Next/Prev never chained eww and never broke.
# `-l` caps at 100% so repeat-tapping cannot push PipeWire past unity gain.
bindel = , XF86AudioRaiseVolume, exec, nyxus-volume up
bindel = , XF86AudioLowerVolume, exec, nyxus-volume down
bindl  = , XF86AudioMute,        exec, nyxus-volume mute
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioNext,        exec, playerctl next
bind = , XF86AudioPrev,        exec, playerctl previous

# ── Brightness ───────────────────────────────────────────────────────────────
# Same eww-excision casualty as the volume keys; restored the working half.
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Lid close: lock. Sleep stays a Power menu choice, not an accidental nap
# when the lid drops. bindl so it fires even while a lock is up.
bindl = , switch:on:Lid Switch, exec, loginctl lock-session

# ── LAPTOP KEYS THAT EMIT NO KEYSYM ─────────────────────────────────────────
# TRK-3702. Measured on an Alienware 15 DA15265 by reading evdev directly while
# the owner pressed every Fn key (docs/proof/hardware-0901/keycapture.py).
#
# THE FINDING WAS THE OPPOSITE OF THE ASSUMPTION. These keys were never
# unmapped: systemd's own hardware database already names them macro1/2/3 and
# performance, and they emit stable keycodes on every press. A keymap was
# written to "fix" them and then DELETED once the capture showed the kernel had
# already done that job. What they lack is a KEYSYM — X11 has no name for
# KEY_MACRO1 — so `bind = , XF86Something` can never reach them and every
# attempt to bind them by name silently binds nothing.
#
# Hyprland's `code:` form binds the raw keycode and sidesteps the missing
# keysym entirely. That is the whole fix.
#
# Codes are the kernel's, verified on the hardware:
#   656 macro1 (Fn+F1)   657 macro2 (Fn+F2)   658 macro3 (Fn+F3)
#   701 performance (Fn+F6, the speed-gauge icon)
#
# Fn+F4/F5 brightness are NOT here: they already arrive as XF86MonBrightness*
# on the ACPI video bus and are bound above. They looked dead for a different
# reason entirely - the backlight node was root-only, fixed in TRK-3698.
#
# Fn+F9 keyboard brightness is NOT here either: this chassis exposes no
# led-class keyboard backlight at all, so a bind would drive nothing. An
# inert control that looks live is the defect this build keeps finding.
#
# The three macro keys are left UNBOUND on purpose - they are the user's to
# assign, and guessing what m1/m2/m3 should do is not this file's business.
# They are listed so the codes are recorded where somebody will find them.
#   bind = , code:656, exec, <your command>
#   bind = , code:657, exec, <your command>
#   bind = , code:658, exec, <your command>

# Fn + the speed-gauge key cycles the firmware performance profile. Measured
# working on this hardware: low-power / balanced / performance all take.
#
# Bound by KEYSYM, not by code. The raw kernel code is 701, which is ABOVE the
# 255 ceiling xkb can express, so `code:701` reaches nothing — that was tried
# and it silently did not fire. The hwdb entry in
# /etc/udev/hwdb.d/90-nyxus-alienware-keys.hwdb remaps it to prog1, which
# arrives here as XF86Launch1 and binds like any ordinary key.
bind = , XF86Launch1, exec, nyxus-perf-cycle

# m1 / m2 / m3 arrive as XF86Launch2/3/4 after the same remap.
#
# m1 IS THE FAN KEY. The owner asked to turn the fans on with a key, and this
# was the free key with no printed purpose of its own to override. It steps
# auto -> low -> max and shows which one on the OSD. Three modes because three
# is all the hardware has: dell-smm takes a fan LEVEL, not a duty, so the
# "high" that used to sit between low and max rounded to the same level as max
# and was never a fourth speed. Measured 2026-09-08 - low 2417, max 6807 rpm.
#
# NO PASSWORD PROMPT. 90-nyxus-fan-keys.rules makes the dell_smm pwm nodes
# group-writable to wheel, nyxus-hwcaps notices and writes them directly, and a
# key that stopped to authenticate would not be a key worth pressing. wheel can
# already become root here, so that grants nothing that was not already held.
bind = , XF86Launch2, exec, nyxus-fan-cycle

# m2 / m3 stay unbound on purpose - they are the user's to assign, and guessing
# what a macro key should do is not this file's business.
#   bind = , XF86Launch3, exec, <your command>
#   bind = , XF86Launch4, exec, <your command>

# -- THE THREE KEYS THAT WERE PRINTED BUT DEAD --------------------------------
# Decoded from the Dell WMI hotkey device's own capability bitmap on
# 2026-09-08. These three are inside the 255 ceiling, arrive with real keysyms,
# and were bound to nothing at all - so the key had a picture on it and did
# nothing when pressed, which is the worst state a control can be in.
#
# Each does the one thing its glyph promises, and each says what happened on
# the OSD. Where the thing cannot be done - no projector plugged in, radio
# blocked by a hardware switch - it says THAT instead of failing quietly.
bind = , XF86Display, exec, nyxus-display-key
bind = , XF86WLAN,    exec, nyxus-wlan-key
bind = , XF86Battery, exec, nyxus-battery

# ── Screenshot ───────────────────────────────────────────────────────────────
# Screenshots are the Python helper on Print / SHIFT+Print (this file) plus the
# $mod+Print / $mod+SHIFT+Print / $mod+CTRL+Print chords in nyxus-signature.conf.
# Phase 3 (2026-07-14): removed the old `$mod+SHIFT+W -> hyprshot` fallback — it
# silently duplicated $mod+SHIFT+W, which nyxus-signature.conf uses for
# nyxus-accent-from-wallpaper.

# ── Wallpaper (permanent — SIERENGOWSKI) ──────────────────────────────────────
# Set via exec-once at startup. Phase 3 (2026-07-14): Wallpaper Studio moved
# $mod+Alt+W -> $mod+Alt+S ("Studio") because nyxus-signature.conf uses
# $mod+Alt+W for nyxus-wall-next (cycle wallpaper) — they were duplicated.
bind = $mod ALT, S, exec, /usr/local/bin/nyxus wallpaper_studio &

# ── Game Mode / Focus Mode toggles ────────────────────────────────────────────
bind = $mod ALT, G, exec, /usr/local/bin/nyxus-gamemode toggle
bind = $mod ALT, F, exec, /usr/local/bin/nyxus-focusmode toggle

# ── Freeform / Tiling window mode toggle (rev 2026-07-07) ─────────────────────
# FREEFORM = every new window floats at natural size — move/resize at will,
# sizes remembered per app. TILING = classic dwindle. Super+V still floats
# a single window either way.
# 2026-08-05 (ship audit): the bind that was here —
#     bind = $mod ALT, T, exec, nyxus-freeform toggle
# is character-for-character the same as conf.d/nyxus-window-mode.conf:53,
# which is sourced after this file. Two identical binds are harmless until one
# of them is edited, at which point the surviving copy wins and the edit looks
# like it did nothing. window-mode owns window behaviour; the duplicate here
# is removed, the shortcut is unchanged.

# ── Named workspaces ──────────────────────────────────────────────────────────
# RETIRED (prune 2026-07-07): the old Main/Web/Code/Chat/... naming block
# lived here and FOUGHT the newer scheme in nyxus-hyprland-general.conf
# (persistent WEB/CODE/TERM/FILES/MEDIA/COMMS on 1-6, 7-10 lazy/unnamed).
# The general shard is the single source of truth for workspace identity —
# do not re-add defaultName rules here.
# Retired duplicate: Super+W belongs to the eww wifi panel (Phase 2 block).
# Wallpaper Studio lives on Super+Alt+W via /usr/local/bin/nyxus.
# bind = $mod, W, exec, python3 ~/.nyxus/nyxus_wallpaper_studio.py

# ── Quick Settings panel — positioned by the Python script via hyprctl IPC ────
# (window rules handled at runtime; no static rules needed here)

# ── NYXUS per-app window rules ───────────────────────────────────────────────
# MOVED to ~/.config/hypr/conf.d/nyxus-hyprland-rules.conf (sourced at end of
# this file). The unified `windowrule =` form misparses `bordersize N` and
# certain rule combos in Hyprland 0.51+ — every line below this point would
# cascade into 30+ "invalid field" errors on screen. The shard uses the
# current `windowrule =` keyword which parses cleanly on every version.
# DO NOT re-add per-app rules here — they belong in the shard.

# ── Chromium / Electron / mail / browser opacity (TRK-2996) ─────────────
# Numbers are 1.0 1.0 because text must stay readable. The 2026-08-14
# 0.85/0.75 glass ask is superseded: on the live ISO the owner said
# Chromium, Thunderbird, and packaged apps were too transparent. Glass
# belongs in the app chrome, not a compositor fade of the whole window
# (that fades glyphs too). Thunderbird/Firefox are pinned here and again
# in nyxus-hyprland-opacity.conf so a later shard cannot dim them.
windowrule = opacity 1.0 1.0, match:class ^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|[Ee]lectron|VSCodium|[Cc]ode|code-oss|code-url-handler|discord|vesktop|[Ss]lack|obsidian|[Nn]otion|spotify|[Tt]hunderbird|org\.mozilla\.Thunderbird|[Ff]irefox|org\.mozilla\.firefox)$
windowrule = no_shadow on, match:class ^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|[Ee]lectron|VSCodium|[Cc]ode|code-oss|code-url-handler|discord|vesktop|[Ss]lack|obsidian|[Nn]otion|spotify|[Tt]hunderbird|org\.mozilla\.Thunderbird|[Ff]irefox|org\.mozilla\.firefox)$
windowrule = opacity 1.0 1.0, match:class ^([Ll]ibre[Oo]ffice.*|soffice)$
# Note: window-level blur is enabled globally via `decoration { blur { ... } }`
# above — these rules just adjust opacity. To opt OUT of blur for a specific
# class, add  `windowrule = noblur, class:^foo$`  here.

# ── Layer blur ───────────────────────────────────────────────────────────────
# REMOVED: previously had `layerrule = blur, namespace:^waybar$` etc. but
# Hyprland 0.54.3 mis-parses the `namespace:^X$` matcher form ("invalid field
# blur: missing a value"). The bare-regex form is the only working syntax,
# and the nyxus-hyprland-layerblur.conf shard already covers waybar / rofi /
# launcher / notifications / wlogout / hyprlock with the correct syntax —
# duplicating here just creates 4 more red errors on screen for nothing.

# ─────────────────────────────────────────────────────────────────────────────
# NYXUS modular configs (GALAXY rev 2026-05-07 r14)
# These six files live in ~/.config/hypr/conf.d/ and carry the locked
# GALAXY window rules, opacity, blur tuning, fog daemon hooks,
# layer-shell blur, and general behavior. Without these `source =` lines,
# the modular confs are orphaned and Hyprland never applies the NYXUS
# transparency / frost / opacity policy — apps render flat and opaque.
# ─────────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/conf.d/nyxus-hyprland-general.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-sharp.conf
# NYXUS Station Matrix — single source of truth for workspace 1-10 identity
# (OPS/FORGE/GHOST/PULSE/WAVE/CORE/MESH/SCRIBE/BLAST/EDGE). Matches
# ~/.config/nyxus/stations.json and the EWW left rail. Sourced right after
# general so the semantic names win (reconciliation rev 2026-07-15).
# [suxyn] removed with the station layer: nyxus-stations.conf
# Sourced right after the generated matrix: nyxus-stations.conf is rewritten
# from scratch by nyxus-hacker-mode on every mode flip and its generator only
# emits the numbered stations, so the HOME/START/LAB window pins
# live in this CURATED shard where a flip cannot delete them (2026-07-28).
# [suxyn] removed with the station layer: nyxus-stations-named.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-rules.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-opacity.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-blur.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-layerblur.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-fog.conf
# [suxyn] removed with the station layer: nyxus-hyprland-mission.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-flair.conf
source = ~/.config/hypr/conf.d/nyxus-signature.conf
# freeform/tiling mode shard — GENERATED by nyxus-freeform, sourced LAST
# so its catch-all float rules see the per-app overrides already set
source = ~/.config/hypr/conf.d/nyxus-freeform.conf
# TRK-1806 — window rules you set from the Lintel. USER-OWNED: the Lintel
# appends here and an update never clobbers it. It SHIPS PRESENT AND EMPTY on
# purpose: a source= at a missing file boots Hyprland to an error banner,
# which gate 13q39 checks. Safe to edit or empty by hand; do not delete it
# while this line stands.
#
# ORDER IS LOad-BEARING. This must stay AFTER nyxus-freeform.conf: that file
# carries a catch-all float rule, Hyprland takes the LAST match, and sourced
# above it every rule you saved from the Lintel was silently overridden.
source = ~/.config/hypr/conf.d/nyxus-user-rules.conf
# Window behaviour: Aero Snap, Alt+F4, Alt+Tab, and the tiling toggle.
# AFTER freeform so its keybinds take precedence.
source = ~/.config/hypr/conf.d/nyxus-window-mode.conf
# Window-mode after freeform so its keybinds win. Do not source a missing
# file — Hyprland then boots with an error banner.

source = ~/.config/hypr/conf.d/nyxus-hyprland-aurora.conf
# COMET-FIRE add-on. Its header says "sourced LAST from hyprland.conf" and it is
# deliberately last here, so its rules land on top of the other shards'.
source = ~/.config/hypr/conf.d/nyxus-cometfire.conf

# ── DESKTOP INTEGRATION SERVICES (added 2026-08-01) ─────────────────────────
# Removable-media automount, clipboard history, the secret store and the GTK4
# desktop layer. All four were packaged, shipped and exposed in Settings, and
# none of them was ever started by anything — three Settings pages were green
# over a dead backend. Pure exec-once autostarts, no binds and no rules, so
# ordering against the other shards does not matter.
source = ~/.config/hypr/conf.d/nyxus-services.conf
# THE STATION (TRK-1240) — walk between workspaces like rooms of a wheel:
# CTRL+ALT+arrows walk, +SHIFT carry, SUPER+ALT+M map, SUPER+ALT+Return/space
# room keys; the hub/ring/annex named workspaces. Sourced LAST of the conf.d
# shards so no later shard can rebind its chords; gate 13r60 computes that
# its chords collide with nothing else Hyprland sources.
source = ~/.config/hypr/conf.d/nyxus-station.conf
#
# NOT SOURCED, ON PURPOSE: nyxus-safemode.conf is a standalone recovery profile
# loaded only by nyxus-hypr-launch in Safe Mode. Its own header says so. Do not
# add it here.

# nyxus monitor overrides (auto-managed by Settings)
source = ./nyxus-monitors.conf

# ── WIDGET MATERIAL (audit 2026-09-08) ─────────────────────────────────────
# The widgets (Pane.qml, e1Bloom = 0) draw NO bloom. App windows were getting
# a 36–51 px ice/plum halo from BorderPulse.qml + nyxus-pulse.sh writing
# decoration:shadow:color/range every beat. Those daemons still write colour
# and range; with shadow disabled nothing is drawn, so windows sit on the
# wallpaper exactly like a widget card. Rim stays the 1 px ice/glacier line.
decoration {
    shadow {
        enabled = false
    }
}
# App-window rim = widget rim: Theme.glacier[4] #4f7fa6 at 45% resting,
# a touch stronger when focused (Pane e2Rim), never the full-strength ice line.
general {
    border_size = 1
    col.active_border   = rgba(4f7fa6a6)
    col.inactive_border = rgba(4f7fa673)
}

# ── TAPE RESUME (audit 2026-09-08) ─────────────────────────────────────────
# nyxus-tape-resume.service is WantedBy=graphical-session.target, which this
# profile never reaches (see line ~80), so after a reboot the recorder stayed
# off until toggled by hand. Start it here, the way the other daemons are.
exec-once = sh -c 'sleep 6; "$HOME/.local/bin/nyxus-tape" --resume'
