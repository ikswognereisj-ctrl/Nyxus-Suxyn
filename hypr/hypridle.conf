# ─────────────────────────────────────────────────────────────────────
# Nyxus Suxyn · hypridle configuration
# Lives at: ~/.config/hypr/hypridle.conf
#
# Idle pipeline (rev 2026-08-17 · the Starlight saver lives in the shell):
#    45s        → frost every window to glass (living wall reads through)
#   300s (5m)   → THE SCREENSAVER — the Starlight, full screen, with the hour.
#                 ⚠ NOT LAUNCHED FROM HERE. See the block below.
#   600s (10m)  → LOCK the session (nyxus-lock-guard → shell/Lock.qml, which
#                 now wears the same Starlight) and turn the panel off.
#                 Returning from here requires logging back in.
#   900s (15m)  → suspend the system.
#
# Locking: the screensaver is a VISUAL surface only — it does NOT authenticate.
# The real lock is `nyxus-lock-guard`, invoked at the 10-minute mark, on
# Super+L, and before sleep. The guard picks the engine (the Quickshell lock
# surface when the shell answers, hyprlock otherwise) and is the only thing
# that refuses to lock an account with no password. So the flow is:
#   idle → Starlight screensaver → (stay idle) → lock → log back in.
#
# ── WHY THERE IS NO `nyxus-screensaver` LINE ANY MORE ────────────────────
# There used to be one, at 300 s, and on the owner's machine it had not run for
# some time. Measured 2026-08-17, two independent reasons and neither of them
# about the saver's art:
#
#   · `/usr/local/bin/nyxus-screensaver` DID NOT EXIST on his machine at all.
#     It is an ISO-profile file and his session is a dev checkout, so the
#     program this line was told to launch was never installed. hypridle ran
#     the line, the shell reported nothing, and the screen stayed as it was.
#   · His `power.saver_on` was `0`, so the generator in `nyxus_settings.py`
#     emitted no saver listener at all — and, because the 45 s idle-glass stage
#     is gated on the same flag, no glass stage either.
#
# Both are the same shape: the screensaver was a SEPARATE PROGRAM that had to be
# installed, be on PATH, be enabled, and be reached through a config file that a
# settings page rewrites. Four things had to be true and one of them silently
# was not.
#
# So it is now `shell/Screensaver.qml`, a surface in the shell that is already
# running. It engages itself from `IdleMonitor` — Quickshell's binding for
# `ext-idle-notify-v1`, the SAME compositor protocol hypridle consumes, so this
# is not a second and weaker idle mechanism, it is the same source of truth read
# one process earlier. It reads `power.saver_on` and `power.saver_secs` out of
# ~/.config/nyxus/settings.json, which is the file THIS one is generated from,
# so the two stages cannot disagree about when "5 minutes" is.
#
# The lock stage stays here, and deliberately: every lock route in this build
# goes through `nyxus-lock-guard`, and the shell's screensaver does not know how
# to lock and must never learn.
#
# ─────────────────────────────────────────────────────────────────────

general {
  # guard prevents stacking multiple lock instances.
  # NYXUS cosmic sound theme: lock_cmd fires the lock chime for every lock
  # path (Super+L, wlogout lock, hypridle's 10-min lock, before-sleep — all
  # route through nyxus-lock-guard), and unlock_cmd fires the unlock
  # chime when logind unlocks the session. nyxus-sound fails silent if the
  # theme is muted (~/.config/nyxus/sound.state) or audio is unavailable.
  # WIP-114: guarded. The lock authenticates through PAM, and pam_unix
  # rejects an empty password -- so locking an account with no password
  # set traps the owner outside his own session with no way back but a
  # hard reset. nyxus-lock-guard checks first and explains instead.
  # The weather refresh runs BACKGROUNDED and BEFORE the guard: the lock's
  # weather layer reads a serve-stale cache, and this kick means the sky
  # matches the world the moment the lock paints instead of thirty minutes
  # ago. It can never delay the lock itself.
  lock_cmd         = nyxus-sound lock ; (nyxus-lock-weather update &) ; pidof hyprlock || nyxus-lock-guard
  unlock_cmd       = nyxus-sound unlock
  before_sleep_cmd = (nyxus-lock-weather update &) ; nyxus-lock-guard
  after_sleep_cmd  = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

# 45 s — NYXUS IDLE GLASS: fade every window to frosted glass (blur stays
# on) so the living wallpaper reads straight through the panes. The first
# input snaps the shipped opacities back. Purely visual; costs nothing while
# idle. The lock is pinned opaque by a windowrule so this never makes it
# see-through, and the screensaver is a layer surface that no window rule
# touches.
# listener {
#   timeout      = 45
#   on-timeout   = ~/.config/hypr/scripts/nyxus-idle-glass.sh on
#   on-resume    = ~/.config/hypr/scripts/nyxus-idle-glass.sh off
# }

# 300 s (5 min) — the screensaver. NO LISTENER: `shell/Screensaver.qml` engages
# itself off the same `ext-idle-notify-v1` clock hypridle is reading, at
# `power.saver_secs` from ~/.config/nyxus/settings.json. This comment is here so
# that the next person to read this file for the idle pipeline finds the stage
# rather than concluding there isn't one.
#
# There is also no `brightnessctl -s set 10%` any more. It used to accompany the
# launch, and under the Starlight it would be working against the picture: the
# saver is a field of small bright points on true black, and dimming the panel
# to 10% dims the points and not the black. The black IS the power saving.

# 600 s (10 min) — LOCK + panel off. Lock the session (the guard picks the
# Quickshell lock surface when the shell answers), then dpms off. Returning from
# here lands on the lock, so the user must log back in.
#
# Nothing tears the screensaver down here and nothing needs to: `shell.qml`
# binds `Screensaver.blocked` to `Lock.locked`, so the saver stands down the
# moment the lock engages, in the shell, where it can be seen. The old
# `pkill -f nyxus_screensaver` that used to lead this line went with the program
# it was killing.
# listener {
#   timeout      = 600
#   on-timeout   = nyxus-lock-guard ; hyprctl dispatch dpms off
#   on-resume    = hyprctl dispatch dpms on
# }

# 900 s (15 min) — suspend
# listener {
#   timeout      = 900
#   on-timeout   = systemctl suspend
# }
# ── STAY AWAKE (owner, 2026-09-06: "make it so it stays awake both machines") ──
# Every listener below is commented out, so hypridle still runs and still
# answers dbus inhibits but never dims, locks, blanks or suspends on its own.
# The daemon is left RUNNING on purpose: killing it would come back at the next
# login and look like the setting had not stuck.
#
# What was turned off:
#    45s  idle glass (frost the surfaces)
#   600s  lock + dpms off
#   900s  systemctl suspend
#
# To put it all back:  cp ~/.config/hypr/hypridle.conf.bak-* ~/.config/hypr/hypridle.conf
#                      then: pkill hypridle ; hypridle &
