# ============================================================
#  Nyxus Suxyn — Hyprlock · FROSTED GLASS
#  ~/.config/hypr/hyprlock.conf
#
#  Everything is glowing lettering floating on a heavily-blurred wall,
#  layered for depth: the clock sits FORWARD (bright, big glow), the corner
#  chrome sits BACK (dim, small, soft). Two low-alpha frosted panes give the
#  glass its body without a card. Target: design/mockups/set-lockscreen.png.
#
#  ⛔ HARD RULE: nothing in this file may poll faster than 1000 ms.
#
#  The previous header called the live audio spectrum "one of a kind" and
#  promised it "never breaks the lock". It broke the lock. Two labels ran
#  subprocesses every 50 and 55 ms, which starved the event loop so the
#  password field drew but never accepted input — leaving a hard reset as the
#  only way back into the machine. It was measured on the 2026-08-01 ISO and
#  then hit again in the first Suxyn preview session.
#
#  A lock screen has one job: let the owner back in. Decoration that can cost
#  someone their session is not a feature. Anything smoother than 1 Hz belongs
#  in the Quickshell lock surface (WlSessionLock), where it is an animated
#  property rather than a process spawn per frame.
#
#  ── STARLIGHT STILL (owner 08-20) ────────────────────────────────────
#  Lock #2 ground is GRUB themes/nyxus/background.png — the same bytes as
#  shell/lock-still.png / headliner-still.png (md5 1b7bf223). Weather
#  frames still ship; reload_cmd reprints the still so they cannot replace
#  the stars after 1 s. Labels may still call nyxus-lock-weather for TEXT
#  (header/line), which is not the ground. 1000 ms floor unchanged.
#
#  Accent rides hyprlock-accent.conf (nyxus-apply-accent §3).
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

general {
    hide_cursor        = true
    ignore_empty_input = false
    text_trim          = true
    immediate_render   = true
}

# ── ANIMATIONS · cinematic frosted entrance ─────────────────
animations {
    enabled = true
    bezier = nyx-glass,  0.16, 1.0,  0.2,  1.0
    bezier = nyx-spring, 0.34, 1.36, 0.64, 1.0
    bezier = nyx-out,    0.4,  0.0,  1.0,  1.0
    animation = fadeIn,           1, 8,  nyx-glass
    animation = fadeOut,          1, 4,  nyx-out
    animation = inputFieldColors, 1, 5,  nyx-glass
    animation = inputFieldFade,   1, 6,  nyx-glass
    animation = inputFieldWidth,  1, 6,  nyx-spring
    animation = inputFieldDots,   1, 4,  nyx-spring
}

source = ~/.config/hypr/hyprlock-accent.conf

# ── BACKGROUND · Starlight still (owner 08-20) ──────────────
# path= is GRUB themes/nyxus/background.png (byte-identical to
# shell/lock-still.png and headliner-still.png). 13ua and bake assert that
# path and cmp the bytes — they must NOT force wallpaper.conf ED_WALL
# (glacier-altitude) onto this line. reload_cmd reprints the same path
# (preview already did this with the repo lock-still.png).
background {
    monitor           =
    # The fallback ground when the wallpaper is missing. Was rgb(05010D),
    # a violet-black; on the Nyxus Glass axis at the same luma (WIP-57).
    color             = rgb(020506)
    path              = /usr/share/grub/themes/nyxus/background.png
    reload_time       = 1
    reload_cmd        = printf '%s\n' /usr/share/grub/themes/nyxus/background.png
    crossfade_time    = 0.45
    blur_size         = 0
    blur_passes       = 0
    brightness        = -0.06
    contrast          = 1.04
    vibrancy          = 0.10
    vibrancy_darkness = 0.20
}

# ══ THE GLASS LIVES IN THE FRAMES NOW (2026-08-07, hardware finding) ═════
# The four `shape` blocks that used to stand here (two panes, the Crown, the
# Lip) drew flat translucent rectangles — hyprlock shapes cannot blur what
# is behind them, so on the owner's panel they read as slabs, not glass.
# render-lock-scenes.py now bakes both panes into every weather frame: the
# scene genuinely blurs and tints behind the glass (rain softens through it,
# stays crisp beside it) and the Crown/Lip edge-light is part of the art.
# Same geometry the shapes had (outer 1180×720 centred, inner 720×430 at
# +40 in 1080p terms), so every label below still sits on its pane.

# ══ FORWARD LAYER · the hero content ════════════════════════

# THE HEADER — one cool line, painted big and faint into the sky like a tag
# on the glass (owner ask 2026-08-07). It knows the weather and the hour:
# rain gets rain lines, storms get storm lines, night gets night lines.
# Served from the same no-network cache as everything else; rotates hourly.
label {
    monitor     =
    text        = cmd[update:600000] nyxus-lock-weather header
    color       = rgba(127, 232, 255, 0.34)
    font_size   = 46
    font_family = Permanent Marker
    shadow_passes = 3
    shadow_size   = 18
    shadow_color  = rgba(127, 232, 255, 0.28)
    shadow_boost  = 1.2
    position = 70, -96
    halign   = left
    valign   = top
}

# GREETING (script flourish)
label {
    monitor     =
    text        = welcome back, <span foreground='##edf1ff'>$USER</span>
    color       = rgba(168, 174, 204, 1.0)
    font_size   = 22
    font_family = Inter Display Light
    shadow_passes = 3
    shadow_size   = 14
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.5
    position = 0, 300
    halign   = center
    valign   = center
}

# CLOCK — the forward hero (chunky Orbitron, big prism glow)
label {
    monitor     =
    text        = $TIME
    color       = $nyxus_accent_rgba
    font_size   = 132
    font_family = Orbitron ExtraBold
    shadow_passes = 4
    shadow_size   = 30
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 2.0
    position = 0, 170
    halign   = center
    valign   = center
}

# WEEKDAY · DATE (one calm line under the clock)
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +%A) · $(date '+%B %d' | tr '[:lower:]' '[:upper:]' | sed 's/./& /g')"
    color       = rgba(201, 208, 232, 0.92)
    font_size   = 18
    font_family = Caveat
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.7)
    position = 0, 78
    halign   = center
    valign   = center
}

# ── REMOVED: the two live audio-spectrum labels ─────────────────────────
# They ran `cmd[update:55]` and `cmd[update:50]` → `nyxus-lock-cava frame`,
# i.e. ~38 subprocess spawns every second for as long as the screen stayed
# locked. That starves hyprlock's event loop: the password field renders, but
# keystrokes are never processed, so the only way out of a locked machine is a
# hard reset. Measured on the 2026-08-01 NYXUS ISO as defect LK-02 — 2,969
# dropped label updates in 40 seconds — and hit again in the first Suxyn
# preview session on 2026-08-02.
#
# Nothing here should ever poll faster than ~1000 ms. A lock screen has exactly
# one job and it is not decoration: it has to let the owner back in.
#
# The spectrum is also absent from design/mockups/set-lockscreen.png, so this
# removes a defect rather than a feature. If a visualiser is wanted later it
# belongs in the Quickshell lock surface (WlSessionLock), where it is an
# animated property rather than a subprocess per frame.

# PASSWORD INPUT (prism gradient rim, frosted inner)
input-field {
    monitor =
    size              = 380, 54
    outline_thickness = 2
    dots_size         = 0.26
    dots_spacing      = 0.22
    dots_center       = true
    dots_rounding     = -1
    outer_color = $nyxus_accent_rgba $nyxus_accent2_rgba 45deg
    inner_color = rgba(4, 11, 14, 0.62)
    font_color  = rgba(237, 241, 255, 0.95)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout  = 1200
    placeholder_text = <span foreground='##c9d0e8'>u n l o c k</span>
    rounding = 12
    check_color     = rgba(216, 164, 100, 1.0)
    fail_color      = rgba(255, 45, 85, 1.0)
    fail_text       = ACCESS DENIED
    capslock_color  = rgba(216, 164, 100, 1.0)
    numlock_color   = -1
    bothlock_color  = -1
    invert_numlock  = false
    swap_font_color = false
    shadow_passes = 4
    shadow_size   = 16
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.3
    position = 0, -90
    halign   = center
    valign   = center
}

# WRONG PASSWORD
label {
    monitor     =
    text        = $FAIL
    color       = rgba(255, 45, 85, 0.95)
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(255, 45, 85, 0.5)
    position = 0, -150
    halign   = center
    valign   = center
}

# KEYBOARD LAYOUT / CAPS (rim goes gold on caps)
label {
    monitor     =
    text        = K B D · $LAYOUT[en]
    color       = rgba(216, 164, 100, 0.72)
    font_size   = 9
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(216, 164, 100, 0.28)
    position = 0, -178
    halign   = center
    valign   = center
}

# ══ BACK LAYER · corner chrome (dim, small, set back) ═══════

# top-left — host / kernel
label {
    monitor     =
    text        = cmd[update:600000] echo "$(cat /etc/hostname 2>/dev/null || echo nyxus) · $(uname -r)" | tr '[:lower:]' '[:upper:]'
    color       = rgba(201, 208, 232, 0.92)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.8)
    position = 56, 112
    halign   = left
    valign   = bottom
}

# top-left, second line — battery. Pure sysfs reads, empty (so the label
# does not render) on a desktop with no battery.
label {
    monitor     =
    text        = cmd[update:60000] cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); if [ -n "$cap" ]; then s=""; [ "$st" = "Charging" ] && s=" · CHARGING"; echo "BAT ${cap}%${s}"; fi
    color       = rgba(168, 174, 204, 0.92)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.8)
    position = 56, 92
    halign   = left
    valign   = bottom
}

# top-left, third line — network. Empty (no render) when offline.
label {
    monitor     =
    text        = cmd[update:60000] s=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2 | head -1); [ -n "$s" ] && echo "NET ${s}" || { ip route get 1.1.1.1 >/dev/null 2>&1 && echo "NET WIRED"; }
    color       = rgba(168, 174, 204, 0.92)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.8)
    position = 56, 72
    halign   = left
    valign   = bottom
}

# top-left, fourth line — uptime, because a daily driver should brag a little.
label {
    monitor     =
    text        = cmd[update:60000] echo "UP $(uptime -p | sed 's/^up //' | tr '[:lower:]' '[:upper:]')"
    color       = rgba(168, 174, 204, 0.72)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.8)
    position = 56, 52
    halign   = left
    valign   = bottom
}

# top-right — the weather cluster. The sky behind it IS the condition; these
# three lines say it in numbers. All served instantly from the same cache the
# scene engine keeps (serve-stale, refreshed in the background) — no label
# here can ever block on the network.
label {
    monitor     =
    text        = cmd[update:60000] nyxus-lock-weather big
    color       = rgba(237, 241, 255, 0.92)
    font_size   = 34
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size   = 12
    shadow_color  = rgba(0, 0, 0, 0.75)
    position = -46, -34
    halign   = right
    valign   = top
}
label {
    monitor     =
    text        = cmd[update:600000] nyxus-lock-weather line
    color       = rgba(127, 232, 255, 0.92)
    font_size   = 20
    font_family = Caveat
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.7)
    position = -48, -88
    halign   = right
    valign   = top
}
label {
    monitor     =
    text        = cmd[update:600000] nyxus-lock-weather sub
    color       = rgba(168, 174, 204, 0.85)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.8)
    position = -48, -118
    halign   = right
    valign   = top
}

# ── REMOVED: the now-playing album-art image widget ─────────────────────
# It drew ~/.cache/nyxus/lock-art-placeholder.png — the old build's diamond
# sigil in a bordered tile — whenever nothing was playing, which is most of
# the time. The owner saw it on hardware as "that square on the bottom left
# we need to get rid of". The TEXT widgets stay: they print nothing when
# nothing plays, so the corner is clean until music actually runs.
label {
    monitor     =
    text        = cmd[update:5000] nyxus-lock-track title
    color       = rgba(237, 241, 255, 0.95)
    font_size   = 15
    font_family = Inter Display
    shadow_passes = 1
    shadow_size   = 5
    shadow_color  = rgba(0, 0, 0, 0.7)
    position = 56, 168
    halign   = left
    valign   = bottom
}
label {
    monitor     =
    text        = cmd[update:5000] nyxus-lock-track artist
    color       = rgba(168, 174, 204, 0.85)
    font_size   = 12
    font_family = JetBrainsMono Nerd Font
    position = 56, 140
    halign   = left
    valign   = bottom
}

# bottom-right — daily line (cyan easter egg)
label {
    monitor     =
    text        = cmd[update:60000] ~/.config/hypr/scripts/nyxus-daily-line.sh
    color       = rgba(127, 232, 255, 0.78)
    font_size   = 16
    font_family = Caveat
    shadow_passes = 1
    shadow_size   = 5
    shadow_color  = rgba(127, 232, 255, 0.22)
    position = -50, 48
    halign   = right
    valign   = bottom
}

# bottom-centre — signature
label {
    monitor     =
    text        = NYXUS
    color       = $nyxus_accent_dim
    font_size   = 18
    font_family = Permanent Marker
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.1
    position = 0, 40
    halign   = center
    valign   = bottom
}
