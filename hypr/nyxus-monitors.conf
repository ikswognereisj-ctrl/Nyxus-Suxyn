# NYXUS monitor overrides — integer 1x, native 165 Hz. Settings ▸ Display rewrites this.
#
# This repo is tuned for one Alienware 15 (eDP-1 · 1920x1200@165). On any other
# machine that line will not match a real output, so it is commented out and the
# generic rule below is used instead: auto resolution/position on whatever panel
# is present. Re-enable the pinned line only on the target machine.
# monitor = eDP-1, 1920x1200@165, 0x0, 1
monitor = , preferred, auto, 1
