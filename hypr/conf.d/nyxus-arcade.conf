# ============================================================================
#  nyxus-arcade.conf — BLAST FROM THE PAST session shard
#
#  Sourced from hyprland.conf. Harmless on a normal Nyxus login:
#  nyxus-arcade-autostart exits unless NYXUS_ARCADE=1, and Super+Escape
#  only terminates the session when that env is set.
# ============================================================================

exec-once = nyxus-arcade-autostart
bind = SUPER, Escape, exec, sh -c 'if [ "${NYXUS_ARCADE:-}" = 1 ]; then loginctl terminate-session "$XDG_SESSION_ID"; fi'

# Cabinet wheel on the HDMI output when one exists. TV-only boxes still
# fullscreen-match whatever monitor Hyprland places the window on.
windowrule = workspace 2 silent, match:class ^(emulationstation)$
windowrule = float on, match:class ^(emulationstation)$
windowrule = fullscreen on, match:class ^(emulationstation)$
windowrule = monitor HDMI-A-1, match:class ^(emulationstation)$
