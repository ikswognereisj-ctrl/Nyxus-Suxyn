# ============================================================
#  NYXUS — Hyprland window rules (GALAXY rev 2026-05-07 r16)
#  ~/.config/hypr/conf.d/nyxus-hyprland-rules.conf
#
#  r11 · 2026-05-10 — DEFINITIVE Hyprland 0.54.3 reality, proven by
#                     four `hyprctl configerrors` round-trips on a
#                     live MSI GS77. Stop flipping. Read carefully:
#
#                       * `windowrule = RULE, class:REGEX`
#                         → DOES NOT PARSE. Throws "invalid field
#                         RULE: missing a value" cascading 50+ red
#                         errors on the on-screen Hyprland overlay.
#                         Genuinely broken in 0.54.3 hyprlang for
#                         class-matched rules. NEVER use this form.
#
#                       * `windowrule = RULE, class:REGEX`
#                         → WORKS. Hyprland prints a "windowrule
#                         is deprecated" line into `configerrors`
#                         (forward-looking warning for the 0.55+
#                         Lua migration), but the rules ARE applied
#                         and the on-screen error overlay STAYS
#                         CLEAN. This is the form to use.
#
#                     Same logic applies to nyxus-hyprland-opacity
#                     and the per-app overrides in this file. Keep
#                     EVERYTHING on `windowrule =` until we
#                     migrate to Hyprland 0.55+ (which means a
#                     full lua rewrite anyway). LOCKED. r11 final.
#
#  All 11 godsapp-family apps + the flyout (panel) + the catch-alls
#  float, center, and size to a consistent 900x650.
#
# ============================================================

# -- NYXUS class apps (anything starting with "nyxus") --
windowrule = float on, match:class ^([Nn]yxus.*)$
windowrule = center on, match:class ^([Nn]yxus.*)$
windowrule = size 900 650, match:class ^([Nn]yxus.*)$

# -- 11 godsapp-family product launchers (`home` excluded — desktop dashboard) --
windowrule = float on, match:class ^(godsapp|intel|notepad|notes|passwords|phantom|sage|shield|start|store|studio|weather)$
windowrule = center on, match:class ^(godsapp|intel|notepad|notes|passwords|phantom|sage|shield|start|store|studio|weather)$
windowrule = size 900 650, match:class ^(godsapp|intel|notepad|notes|passwords|phantom|sage|shield|start|store|studio|weather)$

# -- io.nyxus.* / org.nyxus.* / app.nyxus.* / com.nyxus.* application IDs --
windowrule = float on, match:class ^((io|org|app|com)\.nyxus\..*)$
windowrule = center on, match:class ^((io|org|app|com)\.nyxus\..*)$
windowrule = size 900 650, match:class ^((io|org|app|com)\.nyxus\..*)$

# -- Glass Settings / Condition (Quickshell FloatingWindow) --
# app_id is org.quickshell, which the io.nyxus.* catch-all does not match.
# Freeform ON already floats everything; freeform OFF would tile this into
# a sliver, which reads as "Settings opens nothing" (owner live ISO 08-24).
windowrule = float on, match:class ^(org\.quickshell)$
windowrule = center on, match:class ^(org\.quickshell)$
# TRK-3584 · SIZE BY TITLE, NOT BY CLASS — and 960 was starving the grid.
# `org.quickshell` is the app_id of BOTH surfaces this build floats: Settings
# and Condition. One class rule therefore sized them the same, and it sized
# them at 960x640 — a number this file inherited from before the settings
# rebuild. Settings.qml's own `implicitWidth: 1180` and the comment beside it
# say what 1180 buys: "the smallest size at which SetPage's grid takes two
# 480-wide cards inside pageMax with the rail and the frame still paid for".
# At 960 the page slot is 660, SetPage's body is 620, and two 360 px columns
# need 732 — so this rule silently forced EVERY settings page in the shipped
# product into ONE column, which is the "empty space to the side" the owner
# reported on 2026-08-31. The window asked for two columns and the compositor
# refused it. Lowering SetPage's `cardMin` to fit 620 was tried and measured
# WORSE (see the note at that property: labels elided to "Ad...", descriptions
# one word per line), so the width is what has to give.
# 1120x760 is the size the owner's own live session already runs
# (~/.config/hypr/conf.d/nyxus-hyprland-rules.conf); this brings the committed
# profile up to it. Condition keeps 960x640 — it is a small readout, it was
# never the surface with the grid in it, and splitting the rule by title is
# what lets the two differ at all.
windowrule = size 1120 760, match:title ^(Settings)
windowrule = size 960 640, match:title ^(Condition)
windowrule = size 960 640, match:title ^(Notes)
windowrule = size 400 720, match:title ^(Calculator)
windowrule = size 1180 760, match:title ^(Media)
windowrule = size 1180 760, match:title ^(Files)
windowrule = size 1180 760, match:title ^(Store)
windowrule = size 1160 760, match:title ^(Reader)
windowrule = size 1020 640, match:title ^(Calendar)
windowrule = size 1150 760, match:title ^(Viewer)
windowrule = size 880 620, match:title ^(Archive)
windowrule = size 1020 740, match:title ^(Weather)
windowrule = size 760 600, match:title ^(Clock)
windowrule = size 560 480, match:title ^(Screenshot)
windowrule = size 1020 720, match:title ^(Help)
windowrule = size 980 640, match:title ^(Hardware)
windowrule = size 1100 720, match:title ^(Monitor)

# -- The flyout (panel) — float, pin to right edge, fixed 460x680 --
windowrule = float on, match:class ^(panel|nyxus-panel)$
windowrule = pin on, match:class ^(panel|nyxus-panel)$
windowrule = size 460 680, match:class ^(panel|nyxus-panel)$

# -- NYXUS Home (pinned to workspace 0 by main hyprland.conf; no overrides here) --

# ============================================================
#  PER-APP SIZE OVERRIDES (rev r8 · 2026-05-10)
#  Migrated out of main hyprland.conf where the unified
#  `windowrule =` form was misparsing `bordersize N` and
#  cascading 30+ "invalid field" errors on screen.
#  Using `windowrule =` here — the current keyword that
#  parses cleanly on Hyprland 0.51-0.54.x.
#  These OVERRIDE the catch-all 900x650 above for apps
#  that need different dimensions.
# ============================================================

# ── FLOATING HEIGHT CEILING: 760px on a 1080p panel ──────────────────────
# SS-08. Hyprland's `center` rule centres a floating window in the MONITOR,
# not in the usable area, so a centred window of height H lands at
# y = (1080 - H) / 2 with its bottom edge at (1080 + H) / 2. The bars reserve
# [0, 40, 0, 158], which puts the bottom bar's top edge at y=922, so anything
# taller than 764 has its bottom hidden behind the bar:
#
#   H = 920 (welcome-note)  ->  y=80,  bottom=1000   78px swallowed
#   H = 800 (sysmon etc.)   ->  y=140, bottom=940    18px swallowed
#
# 760 is the largest round number that clears it (y=160, bottom=920). Raising
# any of these above 764 puts the footer of that window under the bar again.

# -- NYXUS SysMon (1280x760, bordered) --
windowrule = size 1280 760, match:class ^(io\.nyxus\.sysmon)$
windowrule = border_size 1, match:class ^(io\.nyxus\.sysmon)$

# -- NYXUS Control (1280x760, bordered) --
windowrule = size 1280 760, match:class ^(io\.nyxus\.control)$
windowrule = border_size 1, match:class ^(io\.nyxus\.control)$

# -- NYXUS Notepad (compact 760x540) --
windowrule = size 760 540, match:class ^(io\.nyxus\.notepad)$

# -- NYXUS Stickies (1280x760, bordered) --
windowrule = size 1280 760, match:class ^(io\.nyxus\.stickies)$
windowrule = border_size 1, match:class ^(io\.nyxus\.stickies)$

# -- NYXUS Weather (380x560 widget, top-left) --
# r17 · 2026-07-07: pin REMOVED — pinned windows ride along on every
# workspace, which broke the "whatever I open stays on its workspace"
# contract. The widget now lives on whichever workspace it was opened on.
windowrule = size 380 560, match:class ^(io\.nyxus\.weather)$
windowrule = move 20 100, match:class ^(io\.nyxus\.weather)$

# -- NYXUS Terminal (1280x760, bordered) --
windowrule = size 1280 760, match:class ^(io\.nyxus\.terminal)$
windowrule = border_size 1, match:class ^(io\.nyxus\.terminal)$

# -- NYXUS Settings (1280x760, bordered) --
windowrule = size 1280 760, match:class ^(io\.nyxus\.settings)$
windowrule = border_size 1, match:class ^(io\.nyxus\.settings)$

# ── Quickshell layer rules ───────────────────────────────────────────────
# Namespaces are the ones the staged shell opens (WlrLayershell.namespace).
# Kind of each rule is the analogue this file already used; blur-on is not
# transferred — nyxus-hyprland-layerblur.conf sources after this shard and
# holds every nyxus-* surface at blur off (Nyxus Glass, one thickness).
# OSDs stay no_anim-free (default fade) so volume taps feel instant.

# Persistent chrome (was nyxus-dock): no_anim + ignore_alpha, no blur.
layerrule = no_anim on, match:namespace nyxus-bar
layerrule = ignore_alpha 0.05, match:namespace nyxus-bar

# USB 08-27: nyxus-desktop (fullscreen Bottom) stacked ABOVE the widget
# chips on the same layer, so clock/calendar/notes ate no clicks.
# Later-declared surfaces sort higher; pin widgets above the icon layer.
layerrule = order 10, match:namespace ^(nyxus-widget-.*)

# Fullscreen overlays bloom with popin 88% (was dashboard / powermenu / cheatsheet).
layerrule = animation popin 88%, match:namespace nyxus-launcher
layerrule = animation popin 88%, match:namespace nyxus-power
layerrule = animation popin 88%, match:namespace nyxus-emoji

# Overview fades (was nyxus-mission). ignore_alpha kept; blur-on is not.
layerrule = ignore_alpha 0.05, match:namespace nyxus-taskview
layerrule = animation fade, match:namespace nyxus-taskview

# Bar-anchored flyout slides (was nyxus-quicksettings).
layerrule = ignore_alpha 0.05, match:namespace nyxus-side
layerrule = animation slide, match:namespace nyxus-side

# Context picker popin 90% (was nyxus-snap-picker).
layerrule = ignore_alpha 0.05, match:namespace nyxus-menu
layerrule = animation popin 90%, match:namespace nyxus-menu

# Drawers from the bar edge (was nyxus-notifications / nyxus-calendar).
layerrule = animation slide bottom, match:namespace nyxus-toasts
layerrule = animation slide bottom, match:namespace nyxus-clock

# ── SCREENSAVERS: `pin` and `fullscreen` are MUTUALLY EXCLUSIVE ─────────
# ⚠ Do NOT add `pin on` back to either saver. Hyprland refuses to put a
# pinned window into fullscreen (pin implies floating), so `pin on` silently
# defeated the `fullscreen on` beside it and BOTH savers mapped as ordinary
# floating windows. Measured live 2026-07-30, Hyprland 0.55.4:
#   with `pin on`     -> at [0,-59] 1920x1080, fullscreen 0, pinned true
#   without `pin on`  -> at [0,0]   1920x1080, fullscreen 2
# The -59 is the same arithmetic as the eww overlays: a 1080-tall window
# centred in the 882px usable area left by the bars' reserved [0,40,0,158].
# So the idle screen has been showing a strip of live desktop below it, and
# for the alien saver a 900x650 card floating mid-screen.
# `pin` bought nothing here: a fullscreen saver already covers its
# workspace, and it quits on any input. Gate 13pb.

# ── NYXUS Matrix-Rain Screensaver (rev 2026-07-15) ──────────────────────
# Standalone GTK4 app launched by hypridle at idle. Must cover the whole
# screen, sit on top, and carry NO chrome/blur/anim so the rain reads
# crisp. It quits on any input, so fullscreening it is safe.
windowrule = fullscreen on, match:class ^(com\.nyxus\.matrixsaver)$
windowrule = border_size 0, match:class ^(com\.nyxus\.matrixsaver)$
windowrule = rounding 0, match:class ^(com\.nyxus\.matrixsaver)$
windowrule = opacity 1.0 1.0, match:class ^(com\.nyxus\.matrixsaver)$

# ── NYXUS Alien-Wallpaper Screensaver (rev 2026-07-21) ──────────────────
# Same treatment as the matrix saver: the alien-wallpaper idle saver
# (app.nyxus.Screensaver) must cover the whole screen and carry no chrome.
# It quits on any input, so fullscreening it is safe.
windowrule = fullscreen on, match:class ^(app\.nyxus\.Screensaver)$
windowrule = border_size 0, match:class ^(app\.nyxus\.Screensaver)$
windowrule = rounding 0, match:class ^(app\.nyxus\.Screensaver)$

# ── Invisible NYXUS terminal + GLOWING BORDER (rev r2 · 2026-07-21) ──────
# The main terminals render a 0-opacity background (opaque text — see
# kitty.conf / alacritty.toml), so all you see is the text floating over
# whatever is behind the window. Instead of stripping the frame, we keep a
# thick ANIMATED PRISM BORDER (the global col.active_border gradient +
# `borderangle` loop already rotate it) and a bright neon shadow, which
# together read as a GLOWING OUTLINE around nothing but the text. The
# inactive border drops to the faint global gradient so only the focused
# terminal glows. Full window opacity is pinned in the opacity shard so the
# text stays crisp. Rounding kept so the glow is a smooth capsule.
windowrule = border_size 4, match:class ^([Kk]itty|[Aa]lacritty|foot|footclient)$
windowrule = rounding 10, match:class ^([Kk]itty|[Aa]lacritty|foot|footclient)$
# A colored, wide, offset-free shadow = a glow/halo hugging the border.
windowrule = no_shadow off, match:class ^([Kk]itty|[Aa]lacritty|foot|footclient)$

# ── Welcome Transmission (rev 2026-07-24) ────────────────────────────────
# Borderless void glass — Orbitron kitty, poetic boot note. Must OVERRIDE
# the glowing-border kitty rules above (same class family would otherwise
# keep the prism frame). Match the dedicated class only.
windowrule = float on, match:class ^(nyxus\.welcome-note)$
windowrule = center on, match:class ^(nyxus\.welcome-note)$
windowrule = size 980 760, match:class ^(nyxus\.welcome-note)$
windowrule = border_size 0, match:class ^(nyxus\.welcome-note)$
windowrule = rounding 0, match:class ^(nyxus\.welcome-note)$
windowrule = no_shadow on, match:class ^(nyxus\.welcome-note)$
windowrule = opacity 0.96 0.96, match:class ^(nyxus\.welcome-note)$
windowrule = pin on, match:class ^(nyxus\.welcome-note)$

# ── First-boot WIZARD — a different window from the note above (WIP-325) ─────
# `nyxus.welcome-note` is the poetic boot message. THIS is
# `dev.nyxus.welcome`, the eight-step setup wizard.
#
# TRK-3251 (2026-08-28) — PROBED, NOT READ. The owner has reported the wizard
# "windowed" through three fixes. Every one of them was written from a config
# read. This one was measured: a HEADLESS nested compositor
# (`scripts/capture-harness.sh --size 1600x900` with `WLR_BACKENDS=headless`),
# a throwaway Adw window carrying this exact `application_id`, each candidate
# rule injected with `hyprctl keyword windowrule` and `hyprctl -j clients`
# read back. Full method, table and limits:
# docs/proof/wizard-fullscreen-0828/. Hyprland 0.55.4 — the ISO ships 0.56.2,
# so re-measure on the next bake; every finding below is 0.55.4.
#
#   no rule          + client maximize()    -> at [23,23] size [1554,770] fs 0
#   no rule          + client fullscreen()  -> at [0,0]   size [1600,900] fs 2
#   float off/tile on+ client maximize()    -> at [23,23] size [1554,770] fs 0
#   float off/tile on+ client fullscreen()  -> at [0,0]   size [1600,900] fs 2
#   + suppress_event fullscreen             -> at [23,23] size [1554,770] fs 0
#   windowrule `fullscreen on` / `maximize on` -> both answer "ok",
#                                              `hyprctl configerrors` empty
#
# READ LINES ONE AND THREE TOGETHER: with `float off` + `tile on` the geometry
# is IDENTICAL to no rule at all. The window is laid out inside `gaps_out`
# (20px, nyxus-hyprland-general.conf) plus the border, i.e. inset on all four
# sides with the wallpaper showing round it. THAT is the "windowed" the owner
# keeps reporting, and no combination of `maximize`/`tile`/`float off` was ever
# going to close it.
#
# The ONE mechanism that reaches [0,0] [1600,900] is the client asking for it
# over xdg-shell — and line five is the whole bug: adding
# `suppress_event fullscreen`, and changing nothing else, puts the geometry
# straight back to the inset card. That rule stood right here, beside a comment
# saying fullscreen "does not work". It worked; this rule was refusing it. It
# is the only line removed from this block. nyxus_welcome.py asks once, on the
# first idle after present() (TRK-3251).
#
# `fullscreen on` / `maximize on` as WINDOWRULES both PARSE CLEAN — `hyprctl
# keyword` answers "ok" and `configerrors` stays empty — so a config read
# cannot tell either from a working rule. `maximize on` is what TRK-3205's
# predecessor shipped and it moved nothing. Neither is used here; a rule that
# does nothing reads as a fix and stops the next person looking.
#
# ⚠ NOT MEASURED, DO NOT ASSERT: what the bar does under `fs 2`. The nested
# monitor reported `reserved [0,0,0,0]` — the bar never took an exclusive zone
# in that run — so this seat has NO evidence for or against the old note's
# claim that true fullscreen makes "the Line paint through Hello and
# Appearance". A draft of this comment stated the opposite as measured fact and
# cited a screenshot that was never produced; both are gone. It is owed a look
# on the next bake.
#
# `float off` + `tile on` stay as the FALLBACK GEOMETRY, not as the mechanism:
# if a compositor ever refuses the fullscreen request, the wizard tiles into
# the exclusive-zone remainder instead of floating at its 1100x760 default.
# `float off` is also what gate 13u80 reads (welcome is its documented
# float-off exception).
windowrule = float off,     match:class ^(dev\.nyxus\.welcome)$
# ── TRK-3718 · 0.56.2 IGNORES THE CLIENT'S FULLSCREEN REQUEST ───────────────
# The block above says the client asking over xdg-shell is "the ONE mechanism
# that reaches [0,0]", and it also says every measurement behind that was taken
# on 0.55.4 while the ISO ships 0.56.2, so re-measure on the next bake. That was
# the right instruction and the answer is: it stopped working.
#
# MEASURED on 0.56.2 over ssh into a live boot of the 09-01 ISO, 1920x1200:
#
#     no rule, client asks   ->  at [336,167]  1249x783  fs 0  FLOATING
#     + the rule below       ->  at [0,0]     1920x1200  fs 2
#
# The build machine is 0.55.4 and CANNOT reproduce this, which is why three
# previous attempts closed without fixing it.
#
# Verified with `hyprctl keyword` on that session: answers ok, `configerrors`
# stays empty, and the geometry above is what `hyprctl -j clients` returned.
#
# ALSO ANSWERS THE "NOT MEASURED, DO NOT ASSERT" NOTE ABOVE: under fs 2 the
# monitor still reports reserved [0,0,0,84] — the bar keeps its exclusive zone —
# and the captured frame shows the wizard edge to edge with no bar and no
# wallpaper visible. The Line does NOT paint through it.
windowrule = fullscreen on, match:class ^(dev\.nyxus\.welcome)$

windowrule = tile on,       match:class ^(dev\.nyxus\.welcome)$
windowrule = border_size 0, match:class ^(dev\.nyxus\.welcome)$
windowrule = rounding 0,    match:class ^(dev\.nyxus\.welcome)$
windowrule = no_shadow on,  match:class ^(dev\.nyxus\.welcome)$

# ══ Correctly-cased app sizes (2026-08-11, Agent S) ══════════════════════
#
# The per-app rules above are written in lowercase — `io\.nyxus\.weather`,
# `io\.nyxus\.calculator` — and Hyprland's regex is CASE SENSITIVE. Several
# of these apps register a capitalised application_id:
#
#   io.nyxus.Calculator   io.nyxus.Weather   io.nyxus.Viewer
#   io.nyxus.Archive      io.nyxus.Calendar  io.nyxus.Reader
#
# so none of their rules ever matched, and every one of them fell through to
# the catch-all `size 900 650` near the top of this file. The owner saw the
# result on 2026-08-11 — every app opening at the same wrong size, with
# Calculator ~900px wide and its keypad stretched into slabs — and the cause
# was never in the apps: they ask for their own size and the compositor
# overrides it. Weather even HAS a `size 380 560` rule up there; it has
# simply never applied.
#
# Rather than re-case the ids (that is WIP-330, and changing an application
# id changes .desktop association, icons and notifications), these rules
# name the classes as they ACTUALLY are. Verified against `hyprctl clients`
# rather than against the source.
#
# Sizes are per app and deliberate. A calculator is a narrow object; a PDF
# reader is a tall one.
# ⚠ 2026-08-11: this asked for `430 780` and the window still opened 884
# tall, because a windowrule cannot push a window below GTK's natural
# minimum and the Calculator's minimum WAS 884x357. The rule was not being
# disobeyed -- it was being clamped, silently. The app's density was tuned
# (key height 52->40, display 96->62, result 46->32px, tighter margins),
# which took the minimum to 716x327; only then could this number shrink.
# Measure the minimum before changing a size here, or it will clamp again.
windowrule = size 390 680,   match:class ^(io\.nyxus\.Calculator)$
windowrule = size 900 760,   match:class ^(io\.nyxus\.Weather)$
windowrule = size 1150 760,  match:class ^(io\.nyxus\.Viewer)$   # 820 -> 760: over the 764 bar ceiling
windowrule = size 860 620,   match:class ^(io\.nyxus\.Archive)$
# Calendar is wide and data-dense by SPEC §1. 1100x740 is chosen against
# its MEASURED minimum of 1058x698 (2026-08-11), not guessed -- the old
# `1000 720` was BELOW the app's own floor of 1184 at the time and was
# therefore being clamped, exactly like the Calculator's rule was.
windowrule = size 1020 640,  match:class ^(io\.nyxus\.Calendar)$

# Notes is a workstation: sidebar + editor + optional preview.
# Measured floor 360x204, so this opens comfortably above it.
windowrule = size 1180 760,  match:class ^(io\.nyxus\.Notes)$
windowrule = size 1160 760,  match:class ^(io\.nyxus\.Reader)$   # 820 -> 760: over the 764 bar ceiling
windowrule = size 470 620,   match:class ^(com\.nyxus\.clipboard)$
windowrule = size 1040 740,  match:class ^(org\.nyxus\.notes)$
windowrule = size 1120 740,  match:class ^(com\.nyxus\.files)$
windowrule = size 820 600,   match:class ^(com\.nyxus\.backup)$
windowrule = size 820 600,   match:class ^(com\.nyxus\.updater)$
windowrule = size 1200 760,  match:class ^(io\.nyxus\.wallpaperstudio)$

# ══════════════════════════════════════════════════════════════════════
#  MEASURED SIZES — 2026-08-11 (WIP-345, Agent T)
#
#  Every size below was chosen against the app's MEASURED natural minimum,
#  not guessed. This block is appended deliberately: Hyprland takes the
#  LAST matching rule, so these override anything above without editing
#  rules another agent may be working on.
#
#  Two rules were being silently CLAMPED because they asked for less than
#  the app's own floor -- the failure that made the Calculator open 884
#  tall against a rule of 780 for weeks (WIP-339):
#
#     app          floor measured     old rule        now
#     Files        828 x 189          (700 default)   1100 x 720
#     Clipboard    567 x 162          (460 default)    640 x 600
#     Calendar    1184 x 728 -> 1058  1000 x 720      1100 x 740
#
#  And two apps defaulted TALLER than this file's own documented ceiling:
#  on a 1080p panel a centred floating window taller than 764 has its
#  bottom swallowed by the bar. Viewer defaulted to 800 and Reader to 820.
#  Both are capped at 760 here.
#
#  ⚠ Case matters. Hyprland's regex is case sensitive and these ids are
#  taken from each app's own `application_id` / `APP_ID`, verified against
#  the source rather than assumed (WIP-330 is still the real fix: one
#  prefix convention instead of io./com./app./dev.).
# ══════════════════════════════════════════════════════════════════════

# -- document apps: wide, and capped under the 764 bar ceiling --
windowrule = size 1150 760,  match:class ^(io\.nyxus\.Viewer)$
windowrule = size 1160 760,  match:class ^(io\.nyxus\.Reader)$
windowrule = size 1080 720,  match:class ^(io\.nyxus\.Media)$
windowrule = size 1100 720,  match:class ^(com\.nyxus\.files)$
windowrule = size  900 640,  match:class ^(io\.nyxus\.Archive)$

# -- utilities: compact, sized to their own job --
windowrule = size  640 600,  match:class ^(com\.nyxus\.clipboard)$
windowrule = size  720 560,  match:class ^(io\.nyxus\.Clock)$
windowrule = size  660 620,  match:class ^(io\.nyxus\.Reminders)$
windowrule = size  560 400,  match:class ^(io\.nyxus\.screenshot)$
windowrule = size  720 560,  match:class ^(com\.nyxus\.account)$
windowrule = size  860 640,  match:class ^(com\.nyxus\.backup)$
windowrule = size  860 640,  match:class ^(com\.nyxus\.updater)$

# -- workbenches --
windowrule = size 1000 700,  match:class ^(io\.nyxus\.stickies)$
windowrule = size 1100 720,  match:class ^(io\.nyxus\.store)$
windowrule = size 1000 640,  match:class ^(io\.nyxus\.terminal)$
windowrule = size 1200 760,  match:class ^(io\.nyxus\.wallpaperstudio)$
