# ============================================================================
#  NYXUS — desktop integration services   (DE completeness Wave 1, 2026-08-01)
#  The subsystems that were packaged, shipped, exposed in Settings and never
#  started by anything. See docs/DE_COMPLETENESS_AND_EDITIONS_2026-07-31.md
#  §1.2-C/D/E/G and §2.1.
#  Sourced explicitly from hyprland.conf (conf.d is not auto-globbed).
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================================
#
# EVERY LINE HERE USES A BARE COMMAND NAME. ~/.local/bin ships EMPTY; the tools
# live in /usr/local/bin, which is on the default PATH. Gate 13z hard-fails on
# the ~/.local/bin form and that bug silently killed ~21 tools on every stick.
#
# Every line is `command -v`-guarded even though every package is listed in
# packages.x86_64, because a missing binary in an unguarded exec-once produces
# nothing but a line in the Hyprland log that nobody reads. Gate 13pi asserts
# each pairing below still exists.

# ── Removable media automount (§1.2-E) ──────────────────────────────────────
# udisks2 + udiskie have been packaged for weeks. Repo-wide, `udiskie` appeared
# in exactly two runtime places, both of them `nyxus-security` calling
# `udiskie-umount -a` to UNMOUNT everything during a panic. Nothing ever
# started the mount daemon, so plugging in a USB stick did nothing at all:
# no mount, no notification, no icon.
#
# Flags: -a automount, -n desktop notifications (dunst is up), -T NO tray.
# The study's §2.1 line says `udiskie -at`; `-t` is deliberately NOT used.
# There is no system tray on this desktop — §2.5 rules a systray daemon off
# the path, and the Bluetooth row in §1.1 records the same absence — so `-t`
# asks udiskie for a StatusNotifierItem host that does not exist. If that made
# udiskie exit, the automount this line is here to provide would be dead and
# would look exactly like the bug being fixed.
exec-once = sh -c 'command -v udiskie >/dev/null && exec udiskie -a -n -T'

# ── Clipboard history (§1.2-D) ──────────────────────────────────────────────
# cliphist and wl-clipboard are packaged, nyxus_clipboard.py ships, and
# Settings ▸ Clipboard manages history size / persistence / a secrets filter.
# The two lines that actually populate the store existed in exactly one place
# in the tree: inside a Python string literal in nyxus_clipboard.py, where they
# were PRINTED TO THE USER as setup instructions. So the store was permanently
# empty and the Settings page was green over nothing.
exec-once = sh -c 'command -v cliphist >/dev/null && command -v wl-paste >/dev/null && exec wl-paste --type text --watch cliphist store'
exec-once = sh -c 'command -v cliphist >/dev/null && command -v wl-paste >/dev/null && exec wl-paste --type image --watch cliphist store'

# ── Input method (WIP-118) ──────────────────────────────────────────────────
# The build shipped noto-fonts-cjk, so CJK text RENDERED everywhere — and there
# was no input method at all, so none of it could be TYPED. A system that
# displays a language flawlessly reads as supporting it right up until someone
# tries to write in it.
#
# `-d` daemonises. No `-r` (replace): if something already provides an input
# method this should lose, not fight it. Guarded like every line in this file,
# because an unguarded exec-once for a missing binary produces nothing but a
# log line nobody reads.
#
# Note there is no tray flag and no tray here — same reason as udiskie above.
# fcitx5's own configuration UI is `fcitx5-configtool`, which Settings ▸
# Keyboard opens; the daemon needs no panel icon to work.
exec-once = sh -c 'command -v fcitx5 >/dev/null && exec fcitx5 -d'

# ── Secret store (§1.2-G) ───────────────────────────────────────────────────
# gnome-keyring is packaged (packages.x86_64) and its daemon binary is on the
# ISO — but until 2026-08-22 nothing started it and there was no
# pam_gnome_keyring line in the greetd PAM chain, so anything using libsecret
# (a browser saving a password, any app storing a token) found no secret
# service. NetworkManager is unaffected; it has its own store.
#
# SINCE 2026-08-22 (CS-1056 / TRK-1210) the greetd PAM stack — airootfs
# etc/pam.d/greetd, twin nyxus-scripts/greetd/greetd.pam — carries
# `auth optional pam_gnome_keyring.so` + `session optional pam_gnome_keyring.so
# auto_start`, so on a greetd login the daemon is ALREADY running and the
# "login" keyring is UNLOCKED with the login password before Hyprland starts.
# This line is kept as the belt to that brace: gnome-keyring-daemon --start is
# idempotent (it finds the PAM-started daemon via the control socket and just
# re-prints its env), and it is the only start on any path that does not go
# through greetd's PAM (the tty1 preview session, a VM `Hyprland` from a TTY,
# a recovery login). On those paths the keyring is running but LOCKED until
# the first prompt — that is the unavoidable half without a PAM password.
#
# --components=secrets only: the ssh-agent and gpg-agent components are left
# out on purpose so this does not fight gpg-agent or a user's own ssh-agent.
exec-once = sh -c 'command -v gnome-keyring-daemon >/dev/null && exec gnome-keyring-daemon --start --components=secrets'

# ── The desktop layer (§1.2-C) ──────────────────────────────────────────────
# /opt/nyxus/desktop/nyxus_desktop.py is a complete GTK4 layer-shell desktop
# client — wallpaper/click surface per monitor at the BOTTOM layer, right-click
# dispatched to nyxus-context-menu.sh, multi-monitor hot-plug, an IPC socket.
# build-iso.sh stages the payload AND generates /usr/local/bin/nyxus-desktop.
# It has never run: `gtk4-layer-shell` was not packaged (only `gtk-layer-shell`,
# which is the GTK3 library) and no exec-once or unit ever launched it.
#
# ⚠ ADDING THE PACKAGE IS NECESSARY BUT NOT SUFFICIENT, AND THE FAILURE IS
# INVISIBLE. The import guard's fallback is os.execvp("swaybg", …) with one
# line on stderr, so a broken desktop layer and a working one look IDENTICAL
# until you right-click. Verify with `hyprctl layers -j`: there must be a
# `nyxus-desktop` namespace on the `bottom` array. Do not judge it by eye.
#
# It does NOT take the wallpaper over. skel ships ~/.config/nyxus/desktop.toml
# with `bg_color = "transparent"` and no wallpaper of its own, because the
# still wallpaper belongs to nyxus-ws-wallpaperd (awww) and the animated one to
# mpvpaper, and both paint on the BACKGROUND layer — one layer BELOW this
# surface. An opaque desktop here would cover both, silently killing
# per-workspace wallpapers and the living wallpaper.
#
# The sleep keeps it off the critical path to first paint; the background
# painters win the login race and this surface composites over them.
# WIP-34: the ONLY nyxus-desktop autostart (hyprland.conf must not duplicate this).
exec-once = sh -c 'sleep 2; command -v nyxus-desktop >/dev/null && exec nyxus-desktop'

# ── THE WEATHER STORE NEEDS AN OWNER THAT RUNS ──────────────────────────────
# `Widgets.qml` is right that the weather chip must never fetch -- "a widget is
# a view of a store an app owns (two fetchers is how the eww build rotted)".
# But the store had no owner at login. `nyxus-lock-weather update` was invoked
# from exactly two places, both in hypridle.conf: `lock_cmd` and
# `before_sleep_cmd`.
#
# So on a fresh boot ~/.cache/nyxus/lockweather/ does not exist, and the desktop
# weather widget renders its empty state -- a box containing one dash -- until
# the first time the screen locks. That is ten idle minutes at best and never at
# all if you are using the machine. It reads as a broken widget, and it was
# photographed as one.
#
# This does NOT add a second fetcher. nyxus-lock-weather remains the only thing
# that talks to the network; this just makes the one owner actually run:
#   * once at login, so the chip is populated before you look at it
#   * every 30 min, so a long session without a lock does not go stale
#
# The 25 s delay keeps it off the critical path to first paint -- the shell and
# the wallpaper painters win the login race, and a weather fetch is never
# urgent. `|| true` so a DNS failure on a laptop that booted off-network cannot
# take the loop down; the next tick retries.
exec-once = sh -c 'sleep 25; while :; do nyxus-lock-weather update >/dev/null 2>&1 || true; sleep 1800; done'
