# ============================================================
#  NYXUS — COMET-FIRE add-on layer (rev r1 · 2026-07-11)
#  ~/.config/hypr/conf.d/nyxus-cometfire.conf
#
#  Self-contained add-on shard, sourced LAST from hyprland.conf.
#  Everything fire-related lives here so it can be removed with
#  one `rm` + `hyprctl reload` and never collides with the other
#  shards (bars/flyouts are being restyled in parallel).
#
#  ── SHARED DESIGN TOKENS (galaxy comet ramp) ────────────────
#  The comet rides the Suxyn emission sweep, not the old fire ramp.
#  Keep every comet consumer (borders, trails, lock, terminals) on
#  this exact ramp — it is a slice of theme/accent.json:
#     core   #5cc6ea   comet head, desaturating toward white
#     teal   #0aa2d6   inner corona
#     azure  #064f95   body
#     indigo #1e03ad   trailing plasma
#     tail   #521e72   violet fade into the void
#     ink    #03040c   void
#
#  ── REVERT IF YOU HATE IT ───────────────────────────────────
#    rm ~/.config/hypr/conf.d/nyxus-cometfire.conf
#    hyprctl reload
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── 1 · COMET BORDER — rotating plasma ring ─────────────────────────
# The focused window wears the comet: a near-white head into teal/azure
# plasma, indigo tail fading through violet into the void, mirrored so
# the rotating gradient reads as one continuous comet orbiting the
# frame when music plays (BorderPulse steps the angle on cava kicks).
# Idle is STILL — the borderangle loop is OFF (owner 2026-08-19: do not
# fake a pulse with nothing playing).
#
# NOTE: the per-app tint daemon (nyxus-tintd, Super+T) REPLACES these
# colors while it runs — the ring below is the house baseline the
# desktop returns to when tint is off.
# ── REBUILT 2026-08-08, from the owner's first look at it on hardware ──
# "the active border as you can see there grey and you can slightly see the
#  swirls but not really"
#
# He was describing an arithmetic problem, not a colour problem. The ring above
# this comment used to carry TEN stops:
#   0aa2d6 064f95 1e03ad 521e72 ae206c cd5e56 ae206c 521e72 1e03ad 064f95
# across a border_size of 2. Ten colours each get a tenth of the perimeter, and
# five of them are dark navy/indigo — at 2 px, adjacent dark stops blend into
# each other and average out to exactly what he photographed: grey. WIP-169
# "fixed the palette" here by dropping ae206c into the list and left the ten
# stops alone, which is why the sweep changed and nothing looked different.
#
# A gradient this thin can carry THREE stops legibly, and they have to be far
# apart in both hue and lightness or the eye integrates them into mud. So the
# ring is now the rose itself, at full alpha, with real contrast between stops:
# plum body → plum → the glow rung. The comet head is the bright one, and it is
# genuinely visible sweeping a corner because it is no longer competing with
# four near-identical blues.
#
# Full alpha on purpose. Theme.qml § THE RATION: the focused border is a STATE
# signal, and state is solid — "don't do glass or transparent, nothing, just
# the colour so it actually shows".
# ── THE ANIMATED PRISM BORDER — the swirls, made visible ──────────────
# The design is the one nyxus-hyprland-rules.conf:204 names: "a thick ANIMATED
# PRISM BORDER (the global col.active_border gradient + `borderangle` loop
# already rotate it)". The rotating multi-stop gradient IS the swirl. It was
# working -- the owner saw it: "it looked like swirls to me just very faint."
#
# Faint is the whole bug, and it was never the stop COUNT. The ring used to be:
#   0aa2d6 064f95 1e03ad 521e72 ae206c cd5e56 ae206c 521e72 1e03ad 064f95
# Six of those ten are dark navy/indigo/violet sitting within a few percent of
# each other in lightness. Adjacent stops that close together do not read as
# bands at all -- across 2px they integrate into their own mean, which is the
# grey he photographed. WIP-169 swapped one hex to rose and left the structure,
# so the palette moved and the ring still averaged to grey.
#
# What makes a rotating gradient read as SWIRLS rather than as a smear is
# alternating LIGHTNESS, not more hues. So the ring keeps its many bands -- the
# swirl needs them -- but every other stop is now near-black plum against a
# near-white rose, the widest contrast the family allows. Eight stops, four
# dark/bright pairs, so four distinct bands orbit the frame instead of one
# comet head. Same hue family as the bar's paint, so the simulated swirl and
# the rotated one read as the same material.
#
# The rules, so this cannot quietly go grey again:
#   1. ONE hue family. Mixed hues at this width average to their mean.
#   2. Contrast in LIGHTNESS. Two stops within ~15% lightness of each other
#      are one stop as far as the eye is concerned.
#   3. Alternate dark/bright. Never place two darks or two brights adjacent.
general {
    # ── WIP-531 · 2026-08-12 — THE HOT PINK COMES OUT OF THE WINDOW RIM ──────
    # The owner, from a photograph of his own Store window: "that pink i dont
    # want i want what i sent you in that screenshot earlier of the widgets and
    # right click". He kept the GLOW deliberately -- "thats just the glow around
    # the edge i like that" -- so only the rim colour changes here.
    #
    # It carried EIGHT stops including three near-whites: ffb3d9 (255,179,217),
    # ff8fc7 (255,143,199) and d765a2 (215,101,162), all at FULL alpha across a
    # 3px border with nothing painting over them. Measured against the two
    # surfaces he approved -- the desktop widgets and the shelf right-click menu
    # -- those run red-over-green +76 to +114 where his reference sits at +1.6
    # to +2.4. That is the whole complaint, in numbers.
    #
    # Now SIX stops peaking at #ae206c, anchored twice on #891955, which is
    # Theme.qml's `plumBody` -- the exact token the widget rim and the shelf
    # menu border already wear. Same family, same identity, no near-whites.
    #
    # Stops dropped from EIGHT to SIX on purpose: this file's own note warns
    # that too many dark stops on a thin border average out to grey, and the
    # owner has objected to "dull" before. Fewer, wider bands keep the sweep
    # readable at 3px while the peak comes down.
    #
    # ⚠ #d765a2 IS NOT BANNED -- it is still the button ACTIVE state and gate
    # 13uk asserts it at line ~7876 as "d765a2:active". It leaves the
    # WINDOW RIM only. Do not purge it globally to make this look tidier.
    #
    # ⚠ THIS VALUE HAS SEVEN DECLARATION SITES AND THE LAST ONE WINS.
    # hyprland.conf declares it inline, then sources nyxus-hyprland-general.conf
    # and AFTERWARDS nyxus-cometfire.conf, so COMETFIRE overrides general — and
    # build-iso.sh installs the artifacts/ copies OVER the profile copies, so
    # each of those three is a twinned pair (six files). The SEVENTH site beats
    # all six: shell/BorderPulse.qml asserts its own stops through
    # `hyprctl keyword` on shell start, and a keyword overrides the config. Do
    # not edit fewer than all seven — that is how "I fixed it and nothing
    # changed" happens. Do NOT restate the sourcing line numbers here; they have
    # already gone stale once. Gate 21 in scripts/audit.sh derives the order and
    # the winner from the files and asserts every stop, so the numbers live
    # where they are computed rather than in this comment.
    # scripts/nyxus-galaxy-pulse.sh keeps the brighter pulse palette
    # deliberately -- it is a manual effect on SUPER SHIFT X, not the resting
    # rim, and the owner did not ask for it to change.
    #
    # ── WIP-777 · 2026-08-17 — THE RING CLEARS THE 3:1 STATE FLOOR ──────────
    # Owner ruling: "col.active_border is the priority ... on the surface that
    # tells you which window has focus, on every window, always. Fix first."
    #
    # Measured on the ground token (theme/accent.json _tokens.edges.ground =
    # void #020506), the old six stops were 1.13 / 2.27 / 1.54 / 3.14 / 1.23 /
    # 2.27 — FIVE of six positions under the 3:1 floor, and only #ae206c passed.
    # Worse on provenance: #2e0819, #5c0f38 and #3d0a22 appear nowhere in
    # accent.json except inside the _unruled_darks PROSE STRING that says they
    # are in no ramp, and #891955 is rose[4], the rung the owner RETIRED to 1px
    # hairlines (accent-hairline, 2.27:1, "NEVER a fill").
    #
    # A rotating gradient cannot be excused by its bright bands: `borderangle`
    # loops the sweep, so any single edge shows only a dark band some of the
    # time. At those moments the whole edge sat at 1.13:1 — invisible. That is
    # why the floor is enforced PER STOP here and not on the ring's average.
    #
    # ⚠ LADDER GAP, REPORTED NOT PAPERED OVER. Rules 1-3 at the head of this
    # file require alternating DARK/bright bands. There is no dark rung in this
    # palette that clears 3:1 in ANY hue family: the darkest colour in
    # accent.json that passes is #ae206c at 3.138:1, and nothing at all sits
    # between 2.991:1 (teal_deep) and it. "Alternate dark/bright" and ">=3:1"
    # are therefore mutually exclusive — the same shape of conflict that
    # _findings.teal_alpha_bisection proved for the alpha seams. The ring
    # resolves it the only way the ladder allows: it alternates between the two
    # BRIGHTEST legal rungs of its own family instead of dark against bright.
    # Six stops and 45deg are preserved, so it still reads as a sweep. It reads
    # BRIGHTER than before and that is the cost of the floor, not an accident.
    #
    # ── 08-20 ice (owner 08-19: glacier is chrome; no leftover rose) ────────
    # The 08-17 floor still holds: every STATE stop is solid and >= 3:1 on
    # void #020506. The HUE moved with the chrome ruling. Hover glacier[5]
    # #b7e6f2 15.21:1, focus glacier[0] #7fe8ff 14.50:1 — both values in
    # accent.json, neither is the DEMOTED hairline. Six stops / 45deg kept.
    # `_tokens.edges.state` hover/active are still the rose rungs; that block
    # was not this edit. Item 21 requires provenance + floor, not those names.
    col.active_border = rgba(7fe8ffff) rgba(b7e6f2ff) rgba(7fe8ffff) rgba(b7e6f2ff) rgba(7fe8ffff) rgba(b7e6f2ff) 45deg
    # Inactive is a SEAM. build-theme.sh already emits ice
    # `$nyxInactiveBorder` (hairline #4f7fa6 @ 0x33, deep #274b7a @ 0x26)
    # into general.conf; this file is sourced AFTER that and used to
    # overwrite it with rose #891955 / #521e72 — which is FAIL 21 (dead ice
    # in general, rose on screen). Same alphas, glacier hue, so the generator
    # and the winner agree.
    #
    # ── CLASSIFIED, 2026-08-17 (WIP-777): THIS IS A SEAM, NOT STATE ─────────
    # Measured over the ground it composites to 1.074:1 (#891955 @ 0.20) and
    # 1.041:1 (#521e72 @ 0.149). Those are NOT failures and must not be
    # "fixed" to 3:1. Ladder A applies, by the documented precedent in
    # theme/accent.json _tokens.edges.state.disabled._rule: "a control that
    # cannot be operated has no state to report, so it falls back to being a
    # mere boundary." An UNFOCUSED window is that case. What identifies focus
    # is the ACTIVE ring being lit; this edge adds no information the absence
    # of that ring does not already carry, so WCAG 1.4.11 exempts it exactly as
    # _tokens.edges.seams._exemption describes. Gate 21 in scripts/audit.sh
    # applies the seam floor to col.inactive_border and the 3:1 state floor to
    # col.active_border, and derives which is which rather than being told.
    #
    # Alphas 0x33 / 0x26 are the generator's, not a named seam rung.
    # `_tokens` still has no home for a window-rim seam alpha.
    col.inactive_border = rgba(4f7fa633) rgba(274b7a26) 135deg
}

# Idle is STILL. Owner 2026-08-19: the 26 s linear loop WAS the fake
# pulse with nothing playing. BorderPulse steps the angle on real cava
# kicks only. Both this file and hyprland.conf declare 0 so a reload
# cannot resurrect the orbit from the other copy.
animations {
    animation = borderangle, 0
    # The border must settle at the SAME rate the window moves, or it visibly
    # trails behind it. The owner: "when you move the tab that's open ... that
    # grey box or where the active border is follows it after not at the same
    # time." hyprland.conf had `windowsMove, 1, 4` against `border, 1, 10` —
    # the border took 2.5× as long to arrive as the window it belongs to.
    animation = border, 1, 4, default
}

# The focused window floats on an ICE bloom, so the shadow agrees with the
# ring. Same alpha 0x3d as the rose bloom it replaces; hue is glacier[0].
decoration {
    shadow {
        color = rgba(7fe8ff3d)
        # Unfocused gets true ink, never a tint. A coloured shadow on an
        # unfocused window is what made every window look equally active.
        color_inactive = rgba(00000038)
    }
}

# ── 2 · HYPRTRAILS — comet tail on moving windows (PREPPED) ─────────
# Styling is declared here but the plugin is NOT loaded by default
# (plugin{} blocks are inert until the .so is live, so this parses
# cleanly today). Once hyprtrails is installed/loaded the trail comes
# up already wearing the fireball gradient. Install options in
# the add-on notes.
plugin {
    hyprtrails {
        color = rgba(064f95aa)
        bezier_step    = 0.025
        points_per_step = 2
        history_points  = 20
        history_step    = 2
        fade_out_time   = 1000
    }

    # ── 3 · HYPREXPO — Mission Control, comet-fire dress ────────────
    # Base config lives in nyxus-hyprland-mission.conf; these override
    # the grid chrome onto the void + emission language.
    hyprexpo {
        columns          = 3
        gap_size         = 6
        bg_col           = rgb(03040c)
        workspace_method = center current
    }
}

# hyprexpo ships pre-built against this exact Hyprland ABI in
# ~/.local/lib/nyxus-plugins — auto-load it so SUPER+F3 / SUPER+ALT+A
# work from boot. nyxus-plugins validates the ABI and no-ops cleanly
# (with a notification) after a Hyprland upgrade, so this can't brick
# a session.
# DISABLED (crashes some Hyprland builds): exec-once = sleep 2 && nyxus-plugins load hyprexpo

# ── 4 · EMBER SCREEN SHADER on boot restore ─────────────────────────
# The ember filter (warm vibrance + gentle highlight glow) is part of
# the nyxus-shader cycle: Super+O cycles filters, Super+Shift+O kills
# them, and nyxus-signature.conf already restores the saved filter at
# session start. Direct chord for the fireball look:
bind = $mod CTRL, O, exec, nyxus-shader ember

# ── 5 · ANIMATED WALLPAPER CYCLER ───────────────────────────────────
# Ambient slideshow through the walls pool with a different comet-y
# awww/swww transition each swap (grow-from-cursor stays the accent
# ripple for manual swaps on Super+Alt+W). Toggle:
bind = $mod ALT SHIFT, W, exec, nyxus-wall-cycle toggle

# ── 6 · DIMAROUND — theater lighting for popups ─────────────────────
# Auth prompts, pickers and logout dialogs dim the rest of the stage
# so the popup owns the room. (dimaround only fires while the window
# is focused — zero cost otherwise.)
windowrule = dim_around on, match:class ^(polkit-gnome-authentication-agent-1|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = dim_around on, match:class ^(gcr-prompter|pinentry-.*)$
windowrule = dim_around on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = dim_around on, match:class ^(wlogout)$
windowrule = dim_around on, match:title ^(Open File|Save File|Select Folder|File Upload)$
