# ============================================================================
#  nyxus-user-rules.conf — window rules YOU set, from the Lintel.
#
#  TRK-1806. The Lintel (Super+W, or the hot strip at the top of the screen)
#  appends `windowrulev2` lines here when you press "Always do this for <app>".
#  It shows you the exact line before it writes it, and it will not add a line
#  that is already present.
#
#  ── WHY THIS FILE EXISTS AND IS NOT `nyxus-hyprland-rules.conf` ────────────
#  That one is SHIPPED, and an update overwrites it. Anything you set by hand
#  there is lost on the next upgrade. This file is yours: nothing in the build
#  writes it except the Lintel, and no update replaces it.
#
#  hyprland.conf sources it AFTER the shipped rules, so when the two disagree
#  yours wins.
#
#  ── WHY IT SHIPS EMPTY RATHER THAN NOT AT ALL ──────────────────────────────
#  A `source =` pointing at a file that does not exist boots Hyprland to an
#  error banner instead of a desktop. Gate 13q39 in iso-builder/verify-profile.sh
#  checks exactly that, and it caught this file missing when the source line was
#  added. So it ships with these comments and no rules — present, valid, inert.
#
#  Safe to edit by hand. Safe to empty. Deleting it entirely is NOT safe while
#  hyprland.conf still sources it — empty it instead.
# ============================================================================

# Your rules are appended below this line.

# Chromium: do not open maximized / full-screen huge.
windowrule = maximize off, match:class ^(chromium)$
windowrule = fullscreen off, match:class ^(chromium)$
windowrule = size 1280 800, match:class ^(chromium)$
windowrule = center on, match:class ^(chromium)$
