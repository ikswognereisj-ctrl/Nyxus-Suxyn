# ============================================================
#  Nyxus Suxyn — THE ROOMS: your workspaces as a 2-D grid you walk through
#  ~/.config/hypr/conf.d/nyxus-station.conf            (TRK-1700, 2026-08-22)
#
#  THE FORMULA. station.json's `grid` is row-major and a room's workspace is
#        ws = row * cols + col + 1
#  so the shipped 3x3 grid is workspaces 1..9 laid out
#
#        WEB   1   NOTES 2   MAIL  3
#        FILES 4   HOME  5   DESK  6
#        MUSIC 7   CINEMA 8  GAMES 9
#
#  HOME is the centre, so every room is at most two moves away, and SUPER+1..9
#  still land you exactly where the map says. THIS SHARD DECLARES NO WORKSPACE
#  AND NO LAYER RULE: the rooms are the numbered workspaces Hyprland already
#  has, which is why turning the feature off costs nothing and why the bottom
#  bar cannot move (gate 13x13 computes both).
#
#  Walk:   CTRL+ALT + arrows        one room in that direction. Walking off an
#                                   edge does nothing unless `wrap` is on.
#  Carry:  SUPER + G                grab the focused window; it travels with you
#                                   until you press SUPER+G again to drop it.
#  Map:    SUPER+ALT + M            pin / unpin the little map, bottom-right
#  Shelf:  SUPER+ALT + Return       launch the first item on this room's shelf
#
#  WHY NOT SUPER+arrows. SUPER+arrows are nyxus-snap-window (conf.d/
#  nyxus-window-mode.conf lines 24-27), SUPER+SHIFT / SUPER+CTRL+arrows are its
#  corner snaps, SUPER+ALT+arrows are movefocus, and SUPER+ALT+SHIFT / SUPER+
#  ALT+CTRL+arrows are movewindow / resizeactive in hyprland.conf. Gate 16dup
#  fails any chord bound twice and does not read `unbind`, so taking SUPER+
#  arrows would mean deleting window snapping. CTRL+ALT+arrows is free in this
#  tree AND is the conventional workspace chord on Linux. Gate 13x10 computes
#  the freedom of every chord below against hyprland.conf and every shard it
#  sources, on every run.
#
#  Fast path: each walking bind asks the shell HUD first (shell/Station.qml
#  answers `qs ipc call house ...` with "ok" after ONE batched hyprctl call).
#  `qs ipc call` exits 0 even when the target is missing, so the wrapper
#  matches the OUTPUT and falls back to the nyxus-house script.
#  No `#` inside a bind line — Hyprland treats it as a comment even in quotes.
#  Sourced LAST from hyprland.conf; its NS twin is
#  artifacts/api-server/nyxus-scripts/nyxus-station.conf.
# ============================================================

# ── walk: one room, in the direction you pressed ─────────────────────────
bind = CTRL ALT, left,  exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(qs ipc call house walk left 2>/dev/null); [ "$out" = ok ] || exec nyxus-house left'
bind = CTRL ALT, right, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(qs ipc call house walk right 2>/dev/null); [ "$out" = ok ] || exec nyxus-house right'
bind = CTRL ALT, up,    exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(qs ipc call house walk up 2>/dev/null); [ "$out" = ok ] || exec nyxus-house up'
bind = CTRL ALT, down,  exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(qs ipc call house walk down 2>/dev/null); [ "$out" = ok ] || exec nyxus-house down'

# ── carry: grab the focused window, walk, press again to drop it ─────────
# One key, one toggle. The script is the writer of the carry state and tells
# the HUD over IPC, so the border treatment and the map chip cannot disagree
# with what actually travels. Nothing focused = nothing happens, not an error.
bind = $mod, G, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; exec nyxus-house carry'

# ── the map, bottom-right ────────────────────────────────────────────────
bind = $mod ALT, M, exec, qs ipc call house map toggle

# ── the room's shelf ─────────────────────────────────────────────────────
bind = $mod ALT, Return, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(qs ipc call house shelf 1 2>/dev/null); [ "$out" = ok ] || exec nyxus-house shelf "$(nyxus-house where | python3 -c "import sys,json; print(json.load(sys.stdin)[\"room\"])")" 1'
