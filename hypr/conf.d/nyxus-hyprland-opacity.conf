# ============================================================
#  NYXUS — Window opacity (GALAXY rev r30 · 2026-05-14)
#  ~/.config/hypr/conf.d/nyxus-hyprland-opacity.conf
#
#  rev r31 · 2026-05-17 — All rules use `windowrulev2`. The v1
#  `windowrule = RULE, class:REGEX` form mis-parses on Hyprland
#  0.50+ ("invalid field class:^...$: missing a value") because
#  `class:` / `title:` matchers are only valid with the v2
#  keyword. The previous comment claiming v2 was deprecated was
#  backwards — v1 is the one that doesn't work with matchers.
#
#  Wiki: https://wiki.hypr.land/Configuring/Window-Rules/
#
#  rev r34 · 2026-08-05 — WAS 0.92 / 0.78. Those numbers assumed the app
#  painted its own dark glass underneath them; it did not — nyxus_chrome.py
#  set the root window to `transparent`, so 0.78 on an unfocused window was
#  0.78 of nothing and you read the app BEHIND it, sharply, through the app
#  in front. The root is real glass now (rgba(6,9,18,0.94)), so the
#  compositor's job here is only to mark focus, not to supply the material.
#  0.99 / 0.96 is that: a perceptible drop on an unfocused window, and text
#  that stays crisp in both states.
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# -- Universal NYXUS class (catch-all) --
windowrule = opacity 1.0 1.0, match:class ^([Nn]yxus.*)$

# -- io.nyxus.* / org.nyxus.* / app.nyxus.* GTK4 app_ids --
# Split into 3 flat rules — nested capture groups with escaped dots
# fail in the Hyprland 0.50+ regex engine.
windowrule = opacity 1.0 1.0, match:class ^io\.nyxus\..*$
windowrule = opacity 1.0 1.0, match:class ^org\.nyxus\..*$
windowrule = opacity 1.0 1.0, match:class ^app\.nyxus\..*$

# -- 11 godsapp-family products + flyout (panel) (`home` excluded) --
windowrule = opacity 1.0 1.0, match:class ^(godsapp|intel|notepad|notes|passwords|phantom|sage|shield|start|store|studio|weather|panel|nyxus-panel)$

# -- Terminals: INVISIBLE (rev r33 · 2026-07-21) --
# The main NYXUS terminals render a 0-opacity background themselves
# (kitty background_opacity 0 / alacritty window.opacity 0), so all you
# see is the text over whatever is behind the window. Pin the Hyprland
# WINDOW opacity to 1.0 so the glyphs stay fully crisp — if we dimmed the
# whole window here, the text would fade too, and idle-glass would make it
# see-through. Frame stripping (no border/shadow/rounding) lives in
# nyxus-hyprland-rules.conf.
windowrule = opacity 1.0 1.0, match:class ^([Kk]itty)$
windowrule = opacity 1.0 1.0, match:class ^([Aa]lacritty)$
windowrule = opacity 1.0 1.0, match:class ^(foot|footclient)$
windowrule = opacity 1.0 1.0, match:class ^(org\.wezfurlong\.wezterm)$
# -- File managers: smoked glass (rev r34 · 2026-08-05) --
windowrule = opacity 1.0 1.0, match:class ^([Tt]hunar)$
windowrule = opacity 1.0 1.0, match:class ^(org\.gnome\.Nautilus)$
# -- Mail / browsers / office: opaque so body text stays readable (TRK-2996) --
# The 08-14 0.85/0.75 Chromium rule in hyprland.conf is now 1.0 as well.
# Pin these classes last-wins against any earlier dim, including idle-glass
# restore. Screensaver and welcome-note stay on their own rules below.
windowrule = opacity 1.0 1.0, match:class ^([Tt]hunderbird|org\.mozilla\.Thunderbird)$
windowrule = opacity 1.0 1.0, match:class ^([Ff]irefox|org\.mozilla\.firefox)$
windowrule = opacity 1.0 1.0, match:class ^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable)$
windowrule = opacity 1.0 1.0, match:class ^([Ee]lectron|VSCodium|[Cc]ode|code-oss|code-url-handler|discord|vesktop|[Ss]lack|obsidian|[Nn]otion|spotify)$
windowrule = opacity 1.0 1.0, match:class ^([Ll]ibre[Oo]ffice.*|soffice)$

# -- Idle screensaver stays fully opaque (rev 2026-07-21) --
# The alien-wallpaper saver is app.nyxus.Screensaver, which the app.nyxus.*
# rule above would otherwise drop to 0.92. Force it solid (last rule wins)
# so the saver is never see-through, including while idle-glass is active.
windowrule = opacity 1.0 1.0, match:class ^(app\.nyxus\.Screensaver)$

# -- Welcome Transmission (rev 2026-07-24) --
# Dedicated Orbitron kitty note. Nyxus.* catch-all above would dim it;
# pin near-solid so the poem stays readable over the wallpaper.
windowrule = opacity 0.96 0.96, match:class ^(nyxus\.welcome-note)$

# -- THE FIRST TWO MINUTES: the installer and the setup wizard (TRK-3688,
# --  TRK-3689) --
#
# THE DEFECT, observed on real hardware 2026-09-01: the Calamares window was
# see-through -- the desktop, the System Monitor and the widget cluster were
# all legible THROUGH the window that partitions disks -- and the first-boot
# wizard "you can kind of see through it until you move the mouse a little".
#
# NEITHER IS THE APP'S DOING, AND NEITHER IS A PAINT BUG. Both are the
# compositor, and the mechanism is the same one:
#
#   1. hypridle.conf's first listener fires at timeout = 45 (forty-five
#      SECONDS) and runs nyxus-idle-glass.sh on, which sets the GLOBAL
#      decoration:active_opacity / inactive_opacity to GLASS_ACTIVE /
#      GLASS_INACTIVE. In the tree those are 0.92 / 0.86; the copy deployed on
#      the owner's own machine on 2026-09-01 still carried the pre-TRK-3559
#      0.22 / 0.12 -- i.e. a window 78% GONE, which is exactly what the
#      installer screenshot shows.
#   2. Every rule in this file exists to be immune to that: a
#      `windowrule = opacity 1.0 1.0` pin outranks the global keyword, which
#      is why terminals, browsers, Electron apps and the screensaver stay
#      solid while idle-glass is on.
#   3. The first input fires hypridle's on-resume -> nyxus-idle-glass.sh off
#      -> 1.00 / 1.00. THAT is "until you move the mouse a little". The window
#      was never repainting; the compositor was handing it back its alpha.
#
# So the bug is an ABSENCE, and the enumeration above is what produced it.
# The window classes are not guesses -- they are read out of a real VM run,
# docs/proof/vm-audit-0831/frames-mission/serial.log:
#     class: io.calamares.calamares      (title "Nyxus Suxyn Installer")
#     class: dev.nyxus.welcome
# `io.calamares.calamares` is NOT matched by ^io\.nyxus\..*$, and there has
# never been a `dev.` prefix rule at all -- the reverse-DNS list above covers
# io. / org. / app. and misses com. and dev., which is four vendor prefixes
# enumerated and two forgotten. A list only ever describes the cases somebody
# thought of, so the first rule below matches ANY reverse-DNS nyxus app_id
# rather than adding a fifth spelling to the list. Flat, no capture groups --
# nested groups with escaped dots fail in the Hyprland 0.50+ regex engine,
# which is why the three rules above are three rules.
#
# THIS IS ADDITIVE AND CHANGES NOTHING ELSE. Both rules pin to 1.0/1.0, which
# is what hyprland.conf's decoration block already DECLARES
# (active_opacity = 1.00, inactive_opacity = 1.00) and what
# nyxus-idle-glass.sh's off-branch already restores. Nothing outside these two
# classes is touched, and idle-glass keeps working everywhere else.
#
# ORDER MATTERS AND THESE GO LAST: last rule wins, and neither pattern can
# match `nyxus.welcome-note` above (no dot-prefix, not calamares), so its
# deliberate 0.96 survives.
#
# ⚠⚠ AND THE FORM MATTERS, MEASURED. `opacity 1.0 1.0` DOES NOTHING HERE.
# Hyprland MULTIPLIES a plain `opacity` rule by the global
# decoration:active_opacity / inactive_opacity. With idle-glass on, 1.0 x 0.22
# is 0.22 -- the pin is arithmetic that changes nothing. Only the `override`
# form replaces the global instead of scaling it.
#
# Probed on Hyprland 0.55.4 (the version this build ships) in a nested
# compositor, global dropped to 0.22/0.12, four solid-colour windows, alpha
# read off the frame -- docs/proof/firstlook-0901/opacity-form-probe.txt:
#
#     opacity 1.0 1.0                      -> measured 0.16   NO EFFECT
#     opacity 1.0 override 1.0 override    -> measured 1.00   PINS
#     opacity override 1.0 override 1.0    -> measured 0.19   NO EFFECT
#     (control, no rule at all)            -> measured 0.14
#
# All three forms return `ok` from `hyprctl keyword windowrule` and leave
# `hyprctl configerrors` EMPTY, so nothing about parsing distinguishes the two
# dead forms from the live one. That is why this went unseen: the rules are
# syntactically perfect and behaviourally inert.
#
# ⚠ EVERY OTHER PIN IN THIS FILE IS THE DEAD FORM. Terminals, browsers,
# Electron apps, file managers, the godsapp family and
# `app.nyxus.Screensaver` are all `opacity 1.0 1.0`, and this file's own
# header ("if we dimmed the whole window here ... idle-glass would make it
# see-through") and nyxus-idle-glass.sh's header ("The screensaver + hyprlock
# windows are pinned fully opaque by a windowrule ... so this never makes the
# saver or lock screen see-through") both assert a protection that the
# compositor is not providing. NOT converted here, and deliberately so:
# switching them all to `override` would end idle-glass's recede for every app
# in the list, which is a change to what the owner asked for in TRK-3559, not
# a bug fix. Filed as its own row for his ruling. The two lines below are the
# two surfaces where see-through is a DEFECT rather than a feature.
windowrule = opacity 1.0 override 1.0 override, match:class ^[a-z]+\.nyxus\..*$
windowrule = opacity 1.0 override 1.0 override, match:class ^io\.calamares\.calamares$

# -- Tooltips / popovers / dropdowns are layer-shell, not windows; --
# -- their alpha is set inside nyxus_chrome.py CHROME_CSS instead. --
