# ============================================================
#  Nyxus Suxyn — window behaviour
#  ~/.config/hypr/conf.d/nyxus-window-mode.conf
#
#  Hyprland is a tiling compositor. This build is not a tiling desktop.
#  Windows float, you place them, and the shortcuts are the ones someone
#  arriving from Windows or macOS already knows. Tiling is still one keybind
#  away for anyone who wants it — available, never required.
#
#  Sourced AFTER nyxus-freeform.conf so these binds win.
# ============================================================

# ── Aero Snap ────────────────────────────────────────────────────────────
# Super+Left / Super+Right → half the screen. Super+Up → maximise.
# Super+Down → back to where it was. Corners give quarters.
#
# These were `movefocus` before, which is the correct binding for a tiling WM
# and the wrong one for a desktop: Win+Left is the most-used window shortcut
# on Windows and everyone tries it in the first minute. Focus movement moves
# to Super+Alt+Arrow, where it is still there for anyone who wants it.
#
# nyxus-snap-window reads the monitor's RESERVED area, so a snapped window
# never ends up underneath the taskbar.
bind = $mod, left,  exec, nyxus-snap-window left
bind = $mod, right, exec, nyxus-snap-window right
bind = $mod, up,    exec, nyxus-snap-window up
bind = $mod, down,  exec, nyxus-snap-window down

bind = $mod SHIFT, left,  exec, nyxus-snap-window tl
bind = $mod SHIFT, right, exec, nyxus-snap-window tr
bind = $mod CTRL,  left,  exec, nyxus-snap-window bl
bind = $mod CTRL,  right, exec, nyxus-snap-window br

# ── focus movement, relocated ────────────────────────────────────────────
bind = $mod ALT, left,  movefocus, l
bind = $mod ALT, right, movefocus, r
bind = $mod ALT, up,    movefocus, u
bind = $mod ALT, down,  movefocus, d

# ── the familiar ones ────────────────────────────────────────────────────
# Alt+F4 closes. Alt+Tab cycles. Nobody should have to learn a new chord to
# close a window.
bind = ALT,  F4,  killactive
bind = ALT,  Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
# 2026-08-05 (ship audit): a fourth line here read
#     bind = $mod, D, exec, hyprctl dispatch workspaceopt allfloat
# under the comment "Super+D shows the desktop". Two problems, and the second
# is the one that matters. First, `workspaceopt allfloat` does not show the
# desktop — it unfloats/floats every window on the workspace, so the promise
# in the comment was never what the key did. Second, Super+D is ALSO bound in
# conf.d/nyxus-hyprland-aurora.conf:36 to X-ray Peek, which drops every window
# to near-glass so the wallpaper reads through — which IS "show the desktop",
# and is the behaviour a Windows user pressing Super+D is reaching for.
# Aurora is sourced after this shard, so which of the two ran was decided by
# source order rather than by anyone's intent. One key, one meaning: the
# duplicate is gone and Aero Peek keeps Super+D.

# ── tiling, for anyone who wants it ──────────────────────────────────────
# Super+Alt+T flips the whole session between floating and classic dwindle
# tiling. It rewrites conf.d/nyxus-freeform.conf and reloads — see
# /usr/local/bin/nyxus-freeform. Settings calls this "Window behaviour"
# rather than "freeform", which is internal jargon.
bind = $mod ALT, T, exec, nyxus-freeform toggle
