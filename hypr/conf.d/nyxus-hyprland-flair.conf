# ============================================================
#  NYXUS — Prism Flair (rev r1 · 2026-07-07)
#  ~/.config/hypr/conf.d/nyxus-hyprland-flair.conf
#
#  The head-turner layer (no plugins — nothing to break on update):
#
#    1. PRISM TAB GROUPS   — merge windows into one frame with
#                            iridescent gradient tabs (Super+U)
#    2. DEPTH-OF-FIELD     — unfocused windows dim slightly, the
#                            scratchpad backdrop dims hard; the
#                            focused window visibly "comes forward"
#    3. NYXUS LENS         — buttery compositor zoom on
#                            Super+Alt+scroll (demo killer)
#    4. TERMINAL SWALLOW   — GUI apps launched from a terminal
#                            replace it instead of stacking
#    5. NYXUS PULSE        — audio-reactive prism halo: the focused
#                            window's bloom thumps with the music
#                            (Super+Alt+P toggles; r2 · 2026-07-07)
#
#  Plus: Picture-in-Picture auto-docks bottom-right, and any
#  fullscreen video inhibits hypridle so movies never get locked.
#
#  ── REVERT IF YOU HATE IT ─────────────────────────────────
#    rm ~/.config/hypr/conf.d/nyxus-hyprland-flair.conf
#    hyprctl reload
#
# ============================================================

# ── 1 · TAB GROUPS ──────────────────────────────────────────────────────
# Super+U merges the focused window with the next one you throw at it —
# macOS-style tabs, but the tab strip is the emission sweep over the
# triple-black glass. Cycle tabs with Super+[ and Super+].
group {
    col.border_active        = rgba(0aa2d6ff) rgba(064f95ff) rgba(1e03adff) rgba(521e72ff) 270deg
    col.border_inactive      = rgba(0aa2d622) rgba(1e03ad22) rgba(521e7222) 135deg
    # gold reads as "locked" precisely because it is the one hue the sweep
    # never uses as a field.
    col.border_locked_active = rgba(9b621bff) rgba(521e72ff) 270deg

    groupbar {
        enabled     = true
        font_family = JetBrainsMono Nerd Font
        font_size   = 11
        height      = 18
        rounding    = 8
        gradients   = true
        text_color  = rgba(edf1ffff)
        # active tab = emission sweep; inactive tabs = BLACK_SMOKE glass
        col.active   = rgba(0aa2d6cc) rgba(521e72cc) 45deg
        col.inactive = rgba(07091aaa)
    }
}

bind = $mod,       U,            togglegroup
bind = $mod SHIFT, U,            moveoutofgroup
bind = $mod,       bracketright, changegroupactive, f
bind = $mod,       bracketleft,  changegroupactive, b

# ── 2 · DEPTH-OF-FIELD ──────────────────────────────────────────────────
# Pairs with the 0.85 inactive opacity + frost: unfocused windows now sit
# a full layer back (dimmer AND blurrier through the glass), so the
# focused window with its prism ring reads like it's floating above the
# stack. dim_special darkens the desktop hard behind the Super+S
# scratchpad — proper macOS-Mission-Control theater lighting.
decoration {
    # dim_inactive OFF (owner, 2026-08-11: "i dont like the dull look at all").
    # This darkened every unfocused window by 12% on top of what was then a
    # 0.80 inactive_opacity — the two compounded, and an unfocused window was
    # the dullest thing on the desktop. Opacity is now 1.00 (hyprland.conf),
    # so the only remaining dimmer is this one; it goes too.
    #
    # dim_special STAYS. That one darkens the desktop behind the Super+S
    # scratchpad, which is theatre lighting for a deliberate overlay, not a
    # tax on every window you are not currently typing in.
    dim_inactive = false
    dim_strength = 0.00
    dim_special  = 0.35
}

# ── 3 · NYXUS LENS — compositor magnifier ──────────────────────────────
# Super+Alt+scroll zooms the whole desktop around the cursor, glass,
# blur, animations and all. Middle-click (or Super+Alt+0) snaps back.
# zoom_rigid=false makes the viewport glide after the cursor instead of
# hard-locking to it — the "expensive camera" feel.
cursor {
    zoom_rigid = false
}
bind = $mod ALT, mouse_down, exec, ~/.config/hypr/scripts/nyxus-lens.sh in
bind = $mod ALT, mouse_up,   exec, ~/.config/hypr/scripts/nyxus-lens.sh out
bind = $mod ALT, mouse:274,  exec, ~/.config/hypr/scripts/nyxus-lens.sh reset
bind = $mod ALT, equal,      exec, ~/.config/hypr/scripts/nyxus-lens.sh in
bind = $mod ALT, minus,      exec, ~/.config/hypr/scripts/nyxus-lens.sh out
# Was $mod ALT, 0 -- which collided with `workspace, name:RANGE`, the companion
# station for 10 (hyprland.conf binds Super+Alt+1..0 to the ten companions as a
# set). This shard is sourced after those binds, so the lens won and companion
# 10 was the one station in the row that the keyboard could not reach. Moved to
# BackSpace: unbound, and it sits next to the minus/equal zoom pair.
# Super+Alt+middle-click still resets too (mouse:274 above).
bind = $mod ALT, BackSpace,  exec, ~/.config/hypr/scripts/nyxus-lens.sh reset

# ── 4 · TERMINAL SWALLOW ────────────────────────────────────────────────
# `mpv file.mkv` from kitty: the terminal vanishes, the player takes its
# exact tile, and the terminal returns when the player exits. No dead
# terminal windows loitering behind media apps.
misc {
    enable_swallow = true
    swallow_regex  = ^([Kk]itty|[Aa]lacritty|foot|io\.nyxus\.terminal)$
}

# ── Picture-in-Picture auto-dock ───────────────────────────────────────
# Firefox "Picture-in-Picture" / Chromium "Picture in picture" pop-outs:
# pin above every workspace, dock bottom-right clear of bar-bottom, stay
# fully opaque (video should never be frosted), keep aspect on resize.
windowrule = float on,             match:title ^(Picture(-| )[Ii]n(-| )[Pp]icture)$
windowrule = pin on,               match:title ^(Picture(-| )[Ii]n(-| )[Pp]icture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture(-| )[Ii]n(-| )[Pp]icture)$
windowrule = size 512 288,         match:title ^(Picture(-| )[Ii]n(-| )[Pp]icture)$
windowrule = move 100%-w-24 100%-w-84, match:title ^(Picture(-| )[Ii]n(-| )[Pp]icture)$
windowrule = opacity 1.0 1.0,      match:title ^(Picture(-| )[Ii]n(-| )[Pp]icture)$

# ── 5 · NYXUS PULSE — RETIRED ──────────────────────────────── TRK-4175 ──
# cava taps the PipeWire monitor; the daemon maps the level to the focused
# window's shadow bloom (alpha + radius) so bass hits make the window
# visibly glow. Super+Alt+P toggled it live.
#
# RETIRED 2026-09-15. BorderPulse.qml now does this job, in-shell, and does
# it in the look you are actually wearing. nyxus-pulse.sh does not: it has
# no idea look_set exists and writes a fixed palette whose halo colour is
# magenta ae206c.
#
# It was found still running while the owner was reporting that he could
# not see the border pulse. It had been started at boot by the exec-once
# below, survived into PID 1, and was overwriting BorderPulse's magma halo
# with magenta several times a second — measured: killing it flipped
# decoration:shadow:color from 85c87a38 (BorderPulse's warm amber) back
# from ae206c immediately and permanently.
#
# Two external daemons write this same hyprctl keyword and neither is
# look-aware: this one and nyxus-beatd (see bin/nyxus-beat, and the warning
# in bin/nyxus-supernova:162). BorderPulse is the single owner now. If you
# re-enable either, expect the theme toggle to stop reaching the window rim.
#
# The keybind goes with it. Leaving Super+Alt+P wired to a daemon that
# breaks the active theme is a worse outcome than not having the shortcut,
# and the border pulse now follows the shell rather than needing a toggle.
# bind = $mod ALT, P, exec, ~/.config/hypr/scripts/nyxus-pulse.sh toggle
# exec-once = ~/.config/hypr/scripts/nyxus-pulse.sh start

# ── 5b · NYXUS BEAT — audio-reactive border ring ──────────── TRK-4134 ──
# The halo above pulses the window's SHADOW. This one spins the border
# gradient 45° on every detected beat, so the ring around the focused
# window walks in time with the track. Two different surfaces, and the
# owner had only ever seen one of them.
#
# Owner, 2026-09-14: "i havent seen the borders or edges pulsating to the
# real beat of the music ... i havent seen that happen in quit some time".
#
# The reason was four lines up: the halo has an exec-once and the ring did
# not. `nyxus-beat` was reachable from Super+Alt+B and nothing else, so it
# lasted one session and no login ever brought it back.
#
# `restore` honours the remembered on/off (~/.local/state/nyxus/beat-border,
# default on) rather than forcing it, so switching it off with the keybind
# stays off across reboots. Idempotent, like the halo's `start`.
#
# ⚠ The Super+Alt+B bind is NOT repeated here — it already exists in
# nyxus-signature.conf, and a second `bind` on the same chord is a conflict,
# not an override. Only the missing autostart belongs here.
exec-once = nyxus-beat restore

# ── Fullscreen video = no lock screen ──────────────────────────────────
# Any fullscreen window inhibits hypridle. Movie night never ends at the
# hyprlock prompt.
windowrule = idle_inhibit fullscreen, match:class ^(.*)$
