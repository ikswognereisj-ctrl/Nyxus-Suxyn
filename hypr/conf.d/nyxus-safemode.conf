# NYXUS Hyprland — Safe Mode overrides.
#
# INTENTIONALLY UNSOURCED by hyprland.conf — this is a standalone recovery
# profile, not an orphan. Do not fold it into the sourced conf.d set and do
# not delete it during config cleanups.
#
# Loaded ONLY in Safe Mode, by the wrapper /usr/local/bin/nyxus-hypr-launch,
# which checks /proc/cmdline for `nyxus.safemode=1` and, when present, runs
# `Hyprland --config <this file>` instead of the full hyprland.conf.
# (Two details here were wrong until 2026-08-13 and sent readers looking for
# files that do not exist: it is `--config` on the command line, NOT an
# HYPRLAND_CONFIG env var, and the wrapper lives under /usr/local/bin — not
# /usr/bin, which belongs to pacman and which profiledef.sh's file_permissions
# does not cover.)
#
# On the LIVE ISO the wrapper is now reached automatically: the Safe Mode boot
# entry stays on the graphical target, so greetd → the wayland session →
# nyxus-session-start greps the flag and execs it. On an INSTALLED disk the
# recovery entry masks display-manager.service, so nothing calls the wrapper
# and the user must run it from the TTY by hand — still an open gap.
#
# Goals: get the user a usable session with NO custom daemons, NO GPU
# acceleration features, and ONLY the keybinds needed to recover.

monitor = , preferred, auto, 1

# No fog, no blur, no animations — keep things alive on broken GPUs.
# prune 2026-07-07: rewritten for Hyprland 0.55+ syntax. The old form used
# `drop_shadow`, `misc:vfr` and `misc:no_direct_scanout` — ALL removed in
# 0.55 — so safe mode itself threw a config-error cascade in exactly the
# broken-GPU scenario it exists to rescue. (vfr is always-on now and
# direct scanout defaults off, so those two need no replacement.)
animations {
    enabled = no
}
decoration {
    blur { enabled = no }
    shadow { enabled = no }
    rounding = 0
}

# Bare minimum apps — terminal + file manager + a clean way out.
$mod = SUPER
# 2026-08-05 (ship audit): this line used to read
#     exec-once = mako --config /etc/skel/.config/mako/config
# and neither half of it existed. `mako` is not in packages.x86_64 (dunst and
# swaync are) and there is no /etc/skel/.config/mako. It is dunst here, with
# its own config, which IS staged — and safe mode is the one session where
# dunst rather than Quickshell owns the bus, because safe mode starts no
# Quickshell. Its final `notify-send` badge below therefore had nothing
# listening: the one line telling the user they are in recovery never drew.
exec-once = dunst
exec-once = ghostty

bind = $mod, RETURN, exec, ghostty
bind = $mod, E,      exec, nyxus-files || ghostty -e ranger
bind = $mod, Q,      killactive
bind = $mod CTRL, R, exec, systemctl reboot
bind = $mod CTRL, S, exec, systemctl poweroff
bind = $mod, M,      exit

# Big visible badge so the user knows they are in safe mode.
exec-once = sh -c 'notify-send -u critical "NYXUS Safe Mode" "Recovery session — most NYXUS daemons disabled. Reboot via Super+Ctrl+R."'
