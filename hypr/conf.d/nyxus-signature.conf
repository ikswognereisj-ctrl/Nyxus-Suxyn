# ============================================================
#  NYXUS — Signature layer (rev r1 · 2026-07-07)
#  ~/.config/hypr/conf.d/nyxus-signature.conf
#
#  Binds + autostarts for the Signature feature set:
#    1. ACCENT SYNC        — Super+Shift+W re-skins the whole
#                            desktop from the current wallpaper
#    (more sections land here as the set is built out)
#
#  ── REVERT IF YOU HATE IT ─────────────────────────────────
#    rm ~/.config/hypr/conf.d/nyxus-signature.conf
#    hyprctl reload
#
# ============================================================

# ── 1 · ACCENT SYNC ─────────────────────────────────────────────────
# Extract a neon palette from whatever is on screen (still wall or a
# frame of the living wallpaper) and pipe it through nyxus-apply-accent.
bind = $mod SHIFT, W, exec, nyxus-accent-from-wallpaper

# ── 2 · WALLPAPER RIPPLE ────────────────────────────────────────────
# Super+Alt+W cycles to a random wallpaper. The new wall ripples out
# from the cursor (swww grow transition) and, with follow_wallpaper on
# in accent.json, the whole desktop re-themes to match in the same beat.
bind = $mod ALT, W, exec, nyxus-wall-next

# ── 3 · CAPS-LOCK OSD ───────────────────────────────────────────────
# REMOVED 2026-08-05 (ship audit). The bind read:
#     bindn = , Caps_Lock, exec, ~/.config/eww/scripts/osd-capslock.sh
# eww was deleted from this build on 2026-08-03 and ~/.config/eww is not in
# skel, so every Caps_Lock press forked a shell to run a file that is not
# there. `bindn` is non-consuming, so nothing user-visible broke — which is
# precisely why it survived: a dead bind that fails silently is invisible
# until someone greps for the path. There is no OSD in its place yet; that is
# a shell surface and belongs to whoever builds it, not to a config shard.

# ── 4 · NYXUS FILTERS (screen shaders) ──────────────────────────────
# Full-screen GLSL post-processing, pure compositor. Super+O cycles
# off → night → vignette → crt → noir; Super+Shift+O kills it.
# The active filter survives restarts via shader.state.
bind = $mod, O, exec, nyxus-shader next
bind = $mod SHIFT, O, exec, nyxus-shader off
exec-once = nyxus-shader restore

# ── 5 · BEAT — audio-reactive border ────────────────────────────────
# Super+Alt+B toggles the beat daemon: the prism ring around the
# focused window spins in time with whatever is playing (cava bass
# energy → gradient angle). Silence = ring at rest. Off by default.
# (Was Super+Shift+P, which collided with the wall-fx toggle in
# nyxus-fx.conf — both fired on one press.)
bind = $mod ALT, B, exec, nyxus-beat toggle

# ── 6 · SHOT + LENS ─────────────────────────────────────────────────
# de-dup 2026-07-09: the grimblast nyxus-shot wrapper is retired.
# ~/.nyxus/nyxus_screenshot.py is the CANONICAL screenshot app
# (grim+slurp GTK: region/window/fullscreen/picker, --annotate,
# --ocr, --delay). Plain Print (region) and Shift+Print (picker)
# stay in hyprland.conf pointing at the same app; the Super chords
# below cover the other modes. LENS ("circle to search": drag a box,
# NYXUS OCRs the text / decodes the QR to clipboard) is unchanged.
# 2026-08-05 (ship audit): these three read
#     python3 ~/.nyxus/nyxus_screenshot.py <mode>
# ~/.nyxus is a NYXUS-era install directory that this build never creates —
# the app ships at /opt/nyxus/nyxus_screenshot.py with /usr/local/bin/
# nyxus-screenshot in front of it, which is what hyprland.conf:521-524
# already calls. So the plain Print chords worked and the Super chords did
# nothing, from the same keyboard, for the same feature. Same wrapper now.
# ($mod SHIFT Print and $mod SHIFT Q also duplicated hyprland.conf:522-524;
# these are the surviving copies and they agree with it.)
bind = $mod,       Print, exec, nyxus-screenshot region
bind = $mod SHIFT, Print, exec, nyxus-screenshot fullscreen
bind = $mod CTRL,  Print, exec, nyxus-screenshot window
bind = $mod SHIFT, T,     exec, nyxus-lens text
bind = $mod SHIFT, Q,     exec, nyxus-lens qr

# ── 7 · BOOT CINEMATICS ─────────────────────────────────────────────
# Session entrance: NYXUS curtain fades to wallpaper, then each bar
# slides in from its own edge. These rules give every layer-shell bar
# surface its directional entrance. (The eww-era stagger helper
# nyxus-eww-cinematic was deleted — WIP-625, owner-ruled 2026-08-15.)
layerrule = animation slide bottom, match:namespace nyxus-bar-bottom
layerrule = animation slide top,    match:namespace nyxus-bar-top
layerrule = animation slide left,   match:namespace nyxus-bar-left
layerrule = animation slide right,  match:namespace nyxus-bar-right
layerrule = animation fade, match:namespace nyxus-splash
layerrule = blur off,       match:namespace nyxus-splash

# ── 8 · PLUGINS (opt-in, never auto-loaded) ─────────────────────────
# Three plugins are built from source in ~/.local/lib/nyxus-plugins,
# managed by `nyxus-plugins <status|load|unload|toggle> <name>`:
#   hyprexpo · dynamic-cursors · hyprfocus
# NYXUS stays pure-compositor until you load one — nothing to break
# on update. REBUILD after any Hyprland upgrade before loading.
# Super+Alt+A = NYXUS Mission Control (hyprexpo disabled — crash risk).
# bind = $mod ALT, A, exec, sh -c 'nyxus-plugins load hyprexpo >/dev/null 2>&1; hyprctl dispatch hyprexpo:expo toggle'
# 2026-08-05 (ship audit): this bind called `nyxus-mission-control-toggle`,
# which was stripped at the fork (.migration/stripped-files-nyxus-scripts.txt)
# and ships nowhere. Mission Control's replacement in this build is Task View,
# the numbered-desktop surface on $mod+Tab (hyprland.conf:459), and the same
# IPC call is the honest target for the muscle memory. HANDOFF: named stations
# are deleted and do not come back; this is plain virtual desktops.
bind = $mod ALT, A, exec, qs ipc call nyxus taskview
# To auto-load at boot once you trust them, uncomment:
# exec-once = nyxus-plugins load hyprfocus
# exec-once = nyxus-plugins load dynamic-cursors
# exec-once = nyxus-plugins load hyprexpo

# ── 9 · PER-APP BORDER TINT ─────────────────────────────────────────
# Super+T: every app class hashes to its own neon — the focus ring
# re-tints live as you flick between windows (Firefox is always
# Firefox-colored, on every boot). Coexists with BEAT: tint owns the
# colors, beat owns the spin. Started by LIVING THEME below.
bind = $mod, T, exec, nyxus-tint toggle

# ── 9b · LIVING THEME ───────────────────────────────────────────────
# Super+Alt+L: the whole shell comes alive — tintd (colors follow the
# app you're on; follow_mouse=1 makes it hover-reactive) + pulsed
# (notifications/email/chat/alerts fire color pulses across the window
# borders AND the four bar rims; workspace switches sweep; critical
# alerts strobe red). Coexists with BEAT (angle) and the accent engine
# (baseline).
bind = $mod ALT, L, exec, nyxus-living toggle
# ── THE TINT DOES NOT COME UP AT LOGIN · owner ruling, 2026-08-17 ────
# "i need an agent on finding out about nyxus tint at start up ... we need
#  that off asap i dont like how it make everything dull and it ship with
#  it as well."
#
# This line was `nyxus-living on quiet`, and `nyxus-living on` is exactly
# two things: `nyxus-tint on`, then `nyxus-pulsed`. So the tint shipped
# ENABLED on every boot with no way to persist "off" — Settings ▸ Reactive
# layer shows Tint as a read-only status row, not a switch, so Super+T
# lasted until the next login and no further.
#
# Pulsed does NOT autostart. The 2026-09-08 widget-material pass (hyprland.conf
# last-wins) is the 1 px glacier[4] seam on every window, matching the glass
# furniture. `nyxus-pulsed` writes `col.active_border` through hyprctl on
# every focus/notify — a 45deg ice/plum gradient that beats the config and
# is the cyan/magenta fringe on Chromium, Ghostty, Settings, all of them.
# Super+Alt+L still brings living theme up on purpose. Super+T still tints.
#
# The login toast goes with it. `quiet` only ever suppressed LIVING's own
# notification; `nyxus-tint on` notifies unconditionally, which is why
# "◤ NYXUS ◥ TINT · every app wears its own neon" popped on every single
# login. With the tint no longer started here, it cannot.
#
# ⚠ The tint is NOT what dulled the desktop — measured 2026-08-17 on the
# live session, toggling it changed the wallpaper's on-screen gain by
# 0.001. That was `nyxus_desktop.py` wearing the app-window glass; see the
# WIP-783 block in `desktop/nyxus_desktop.py`. This line answers the
# ruling; it is not the fix for the dullness.
# exec-once = sleep 2 && nyxus-pulsed

# ── 9c · GRAFFITI FX (folded in from nyxus-fx.conf, 2026-07-09) ─────
# The old conf.d/nyxus-fx.conf was never sourced, so these were dead.
# Spray moved from Super+G (collides with the live deepcore bind) to
# Super+Z; wall-fx toggle keeps Super+Shift+P (free — beat toggle
# vacated it for Super+Alt+B long ago).
# [retired 2026-08-24] SUPER+Z -> nyxus-spray. Old-build residue: the spray
# overlay documents its OWN key as SUPER+G (see its header), and SUPER+G is
# ROOMS carry under standing ruling 3. The tool still ships and still runs
# from a terminal; it just no longer holds a global key it never claimed.
bind = $mod SHIFT, P, exec, sh -c 'nyxus-wall-fx toggle; notify-send "NYXUS wall-fx" "$(nyxus-wall-fx status)"'

# ── 10 · UI SOUND DESIGN ────────────────────────────────────────────
# Synthesized console blips (nyxus-sound-forge makes them from pure
# math). soundd rides the Hyprland event socket: open/close blips,
# workspace ticks; screenshots click; the boot curtain swells.
# Master switch: `nyxus-sounds toggle` (flag file, instant, global).
exec-once = nyxus-soundd
