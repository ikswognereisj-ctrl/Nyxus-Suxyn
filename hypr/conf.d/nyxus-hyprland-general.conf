# ============================================================
#  NYXUS — Window edges / gaps / rounding (GALAXY rev 2026-05-07)
#  ~/.config/hypr/conf.d/nyxus-hyprland-general.conf
#
#  r3 · 2026.08.07 — rose sweep at glass intensity (WIP-134).
#
#  ── ACTIVE BORDER ─────────────────────────────────────────
#  The art-exact rose sweep (accent.json _gradient.sweep), at
#  0.80 alpha rather than full. Full-alpha stops over the busy
#  swirl wallpaper blew out to a white halo on the owner's
#  panel; the edge should read as the glass Lip, not a lamp.
#
#  ── INACTIVE BORDER ───────────────────────────────────────
#  Same sweep at 0.48 alpha. The old 0x22 (13%) was invisible,
#  and the owner explicitly wants glass visible around
#  unfocused windows too.
#
#  ── REVERT IF YOU HATE IT ─────────────────────────────────
#    rm ~/.config/hypr/conf.d/nyxus-hyprland-general.conf
#    hyprctl reload
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

general {
    # EMISSION rim — the rose sweep on the focused window. Owner 2026-08-19:
    # idle is STILL (borderangle loop OFF). BorderPulse steps the angle only
    # while cava.raw hears the sink.
    # teal → azure → indigo → violet → rose: accent.json _gradient.sweep,
    # the same art-exact stops the shell, GRUB and the splash carry, so the
    # identity does not change between surfaces. These hexes were the OLD
    # galaxy ladder until 2026-08-07 — a flat-file mirror WIP-129 missed.
    # 2026-08-08: three stops, not five, and the rose at FULL alpha. Five dark
    # stops on a 2 px border average out to grey — see the long note in
    # conf.d/nyxus-cometfire.conf, which is sourced after this file and owns the
    # ring. These are kept in agreement with it deliberately: when the two
    # disagreed, whichever was read last silently won and the other looked like
    # a lie to the next person who opened it.
    # ── WIP-531 · 2026-08-12 — THE HOT PINK COMES OUT OF THE WINDOW RIM ──────
    # The owner, from a photograph of his own Store window: "that pink i dont
    # want i want what i sent you in that screenshot earlier of the widgets and
    # right click". He kept the GLOW deliberately -- "thats just the glow around
    # the edge i like that" -- so only the rim colour changes here.
    #
    # It carried EIGHT stops including three near-whites: ffb3d9 (255,179,217),
    # ff8fc7 (255,143,199) and d765a2 (215,101,162), all at FULL alpha across a
    # 3px border with nothing painting over them. Measured against the two
    # surfaces he approved -- the desktop widgets and the shelf right-click menu
    # -- those run red-over-green +76 to +114 where his reference sits at +1.6
    # to +2.4. That is the whole complaint, in numbers.
    #
    # Now SIX stops peaking at #ae206c, anchored twice on #891955, which is
    # Theme.qml's `plumBody` -- the exact token the widget rim and the shelf
    # menu border already wear. Same family, same identity, no near-whites.
    #
    # Stops dropped from EIGHT to SIX on purpose: this file's own note warns
    # that too many dark stops on a thin border average out to grey, and the
    # owner has objected to "dull" before. Fewer, wider bands keep the sweep
    # readable at 3px while the peak comes down.
    #
    # ⚠ #d765a2 IS NOT BANNED -- it is still the button ACTIVE state and gate
    # 13uk asserts it at line ~7876 as "d765a2:active". It leaves the
    # WINDOW RIM only. Do not purge it globally to make this look tidier.
    #
    # ⚠ THIS DECLARATION LOSES. It is kept, and kept in agreement, on purpose.
    # hyprland.conf sources THIS file and then sources nyxus-cometfire.conf,
    # which declares col.active_border again — so cometfire is what lands and
    # this line never reaches the screen. Do NOT restate the sourcing line
    # numbers here; the numbers that used to be in this comment were already
    # stale. Gate 21 in scripts/audit.sh derives the sourcing order and the
    # winner from the files themselves and asserts all three configs agree, so
    # a losing copy can never quietly disagree with the winner again.
    #
    # It is still edited in lockstep because a losing copy that disagrees is the
    # WIP-745 defect class: the next reader fixes the line that does nothing,
    # sees no change, and concludes the fix did not work.
    #
    # ── WIP-777 · 2026-08-17 — THE RING CLEARS THE 3:1 STATE FLOOR ──────────
    # Owner ruling: the focused-window ring is STATE and must clear 3:1 per
    # stop. Old stops measured 1.13 / 2.27 / 1.54 / 3.14 / 1.23 / 2.27 on the
    # ground token (void #020506) — five of six positions under the floor.
    # #2e0819, #5c0f38 and #3d0a22 were in no ramp at all (they appear in
    # accent.json only inside the _unruled_darks prose string) and #891955 is
    # the RETIRED accent-hairline rung. The full derivation, the ladder gap it
    # exposed, and the token provenance of the two replacement stops are written
    # once, in nyxus-cometfire.conf beside the declaration that actually lands.
    # 08-20 ice: glacier[0] #7fe8ff / glacier[5] #b7e6f2. Must match cometfire
    # (the winner) and BorderPulse.calmStops. Rose hover/active stay in
    # `_tokens.edges.state`; they are not the window rim.
    col.active_border   = rgba(7fe8ffff) rgba(b7e6f2ff) rgba(7fe8ffff) rgba(b7e6f2ff) rgba(7fe8ffff) rgba(b7e6f2ff) 45deg
    # col.inactive_border MOVED, 2026-08-17 (Task 0) — it is now emitted by
    # scripts/build-theme.sh from theme/accent.json `_tokens` into the
    # NYXUS-THEME-GENERATED region at the foot of this file, which is a LATER
    # declaration and therefore the one that lands. It was deleted from here
    # rather than left above and overridden, because a value present in the file
    # and dead on screen is the WIP-745 defect class.
    #
    # col.active_border is STILL NOT GENERATED and is still a reported gap, but
    # the reason changed on 2026-08-17 (WIP-777) and the old reason is no longer
    # true. It USED to be that #2e0819, #5c0f38 and #3d0a22 were in no ramp in
    # accent.json and not derivable from rose. Those three are GONE: the owner
    # ruled the ring must clear the 3:1 STATE floor, and it now carries only
    # _tokens.edges.state rungs. What remains owed is the EMITTER — build-theme.sh
    # writes col.inactive_border from `_tokens` and still leaves the active ring
    # hand-written in three files, so the two agree today only because a human
    # kept them in step. accent.json `_tokens._derivation._unruled_darks` still
    # describes the retired situation and is now stale; correcting it is an edit
    # to a file this task was not allowed to write.
    #
    # Gate 13q11's blindness is unchanged and is worth keeping in mind: Hyprland's
    # rgba() literal carries no '#', so 13q11 has never seen ANY border stop here.
    # audit.sh item 21 is what covers them now.

    # 3px, up from 2 (2026-08-08). The prism ring carries four alternating
    # bands and at 2px each band was under half a pixel on a short edge, which
    # is the other half of "very faint" — there was not enough border to draw
    # the swirl ON. 3px is the smallest width where the bands survive the
    # short edges of a tiled window.
    border_size         = 1
    gaps_in             = 10           # space between tiled windows
    gaps_out            = 20           # space to monitor edge
    layout              = dwindle      # keeps existing tiling behavior
    resize_on_border    = true

    # ── FLOATING SNAP (rev r3 · 2026-07-07) ─────────────────────────
    # Freeform mode makes floating the default, so give floats magnetic
    # edges: windows snap to each other and to monitor edges while
    # dragging — clean layouts without pixel-hunting.
    snap {
        enabled     = true
        window_gap  = 8
        monitor_gap = 12
        border_overlap = false
    }
}

# ── SMART GAPS (rev r15 · 2026-05-10) ────────────────────────────────────
# When a workspace contains exactly one TILED VISIBLE window (`w[tv1]`),
# OR has a fullscreen window (`f[1]`), kill the gaps so the window goes
# edge-to-edge. Border stays — we keep the GALAXY rim-light glow,
# which is the signature. Multi-window workspaces keep the 10/20 gaps.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0

# ── NAMED + PERSISTENT WORKSPACES (rev r15 · 2026-05-10) ────────────────
# Give workspaces 1-6 semantic identity (WEB / CODE / TERM / FILES /
# MEDIA / COMMS) and pin them so they're ALWAYS visible in waybar, not
# just when populated. Workspace 0 (NYXUS Home) is named in the main
# hyprland.conf and stays outside this numbered range. Workspaces 7-10
# remain unnamed/lazy — created on demand for ad-hoc work.
#
# `persistent:true` keeps the workspace alive even when empty (so the
# waybar pebble doesn't disappear).
# `defaultName` is the friendly label shown by waybar's
# `format-window-separator` template.
#
# ── STATION IDENTITY MOVED (rev 2026-07-15 · reconciliation) ────────────
# The old WEB/CODE/TERM/FILES/MEDIA/COMMS names lived here and WON over the
# semantic OPS/FORGE/GHOST/… scheme in nyxus-stations.conf + stations.json +
# the EWW left rail — a split-brain where the bar said OPS but Hyprland said
# WEB. Workspace identity is now defined in ONE place:
#     ~/.config/hypr/conf.d/nyxus-stations.conf   (sourced from hyprland.conf)
# which matches ~/.config/nyxus/stations.json and the EWW rail. Do NOT
# re-add workspace defaultName lines here or the split-brain returns.

decoration {
    # Owner ruling 2026-08-17: 12 -> 18, and the GALAXY exception that kept it
    # at 12 is retired. 12 is `radiusSm` in shell/Theme.qml (~line 468) -- the
    # SMALL rung -- worn by a window, the largest surface in the system.
    # NYXUS_GLASS_DESIGN_LANGUAGE.md rev 3 §4.14 gives a window the largest
    # non-pill rung, which is `radius` = 18 (Theme.qml ~line 467). The ladder
    # is delegated to Theme.qml by docs/DESIGN_LANGUAGE_HORIZON_2026-08-03.md.
    #
    # ⚠ This file is sourced from hyprland.conf (~line 998) AFTER that file's
    # own decoration block, so THIS declaration is the one that lands. Its
    # twin is hyprland.conf ~line 412 and the two are moved together.
    rounding            = 18
    # circular corners (owner 2026-08-19): power 2 so the compositor rim
    # MEETS at the corners. Power 3 (squircle) left a gap between the
    # rounded window curve and the gradient border. 2.0 = quarter-circle.
    rounding_power      = 2.0
    # NOTE: blur params live in nyxus-hyprland-blur.conf (don't dupe here)

    # Drop shadow stays ink-black (real shadow on the wallpaper, not bloom).
    shadow {
        enabled        = true
        range          = 18
        render_power   = 3
        sharp          = false
        # EMISSION halo — focused window floats on ice (glacier[0] @ 0x3d).
        # Unfocused windows keep a plain ink shadow so focus is obvious.
        color          = rgba(7fe8ff3d)
        color_inactive = rgba(00000038)
        offset         = 0 6
    }
}

# ══ NYXUS-THEME-GENERATED-BEGIN ══ scripts/build-theme.sh ══
# GENERATED by scripts/build-theme.sh from theme/accent.json `_tokens`.
# DO NOT HAND-EDIT between the markers — the next run overwrites it. Edit
# `_tokens` (or the `_paint_layers` stops it derives from) and re-run.
#
# SCOPE OF THE BYTE-IDENTITY CLAIM. The generator owns the theme VALUES in
# its own target list and NOTHING ELSE. It writes both trees for every
# twinned target and asserts they match. It does not read, write or verify
# the other ~328 hand-maintained files under
# artifacts/api-server/nyxus-scripts/. A green build-theme.sh means the
# GENERATOR'S OWN outputs agree — it does NOT mean the two trees agree, and
# it does not lift the two-copy rule.
#
# NOT EMITTED, deliberately, so that no surface is silently skipped:
# AGS/Astal SCSS (no such surface — the bar is Quickshell) · a Kvantum theme
# (packaged, but a 9-patch SVG cannot be authored blind — OWED) ·
# shell/shaders/*.frag (they take uniforms from Theme.qml).
#
# The alphas below are the EDGE LADDER's, preserved byte-for-byte from the
# hand-written value this region replaced: only the HUE is token-derived.
# rev 3 §1.4 defines four alpha steps and gives them no numbers, and
# `_tokens` has no home for them either — a spec gap this run reports
# rather than invents its way past.
$nyxAccentInteractive = rgba(7fe8ffff)
$nyxAccentDeep        = rgba(274b7aff)
$nyxAccentHairline    = rgba(4f7fa6ff)
$nyxAccentPrimary     = rgba(b7e6f2ff)
$nyxAccentPeak        = rgba(eefcffff)
$nyxAccentPinned      = rgba(ae206cff)
$nyxInactiveBorder    = rgba(4f7fa633) rgba(274b7a26) 135deg
general {
    col.inactive_border = $nyxInactiveBorder
}
# ══ NYXUS-THEME-GENERATED-END ══
