# ============================================================
#  NYXUS — Hyprland LAYER blur (SUXYN rev 2026-08-09b)
#  ~/.config/hypr/conf.d/nyxus-hyprland-layerblur.conf
#
#  ── ONE MATERIAL AT ONE THICKNESS — THE OWNER'S 2026-08-09 MANDATE ──
#  Every shell surface wears the BOTTOM BAR's glass: CLEAR, blur off,
#  the wallpaper's texture sharp through the tint. The owner has now
#  asked for exactly this three separate times, most recently in so many
#  words: "that's the look I was wanting — like the bottom bar. I said
#  it a few times already; the other ways aren't working at all."
#
#  This deliberately supersedes the 2026-08-05 "two thicknesses"
#  decision (bar clear / page-sized panels frosted). That decision had a
#  real measurement behind it — a panel at bar clarity over an editor
#  lets you read the window behind it — and the answer to that concern
#  is the one Bar.qml already uses: legibility comes from the panels'
#  own darkening falloffs and local shading UNDER the type, never from
#  frosting the pane. If read-through turns out to bother the owner on
#  hardware, that is his call to make looking at a screen — not this
#  file's to pre-empt.
#
#  ── HE MADE THAT CALL · 2026-08-10 (WIP-259) ───────────────────────
#  He reported it a third time, and the sentence above ended "(they all
#  still carry them)" — which was simply not true. Grep `scrim` across
#  shell/: ONE file has it, Bar.qml. Every other surface was moved onto
#  the bar's body by the mandate above and given no shading at all, so
#  the clause that made this decision safe was describing something that
#  did not exist.
#
#  Measured on the live screen rather than argued: in the Launcher's own
#  rectangle, over a light window, textDim came out at 1.3:1. That is
#  invisible, and it is why two lifts of the text ladder (WIP-232,
#  WIP-250) changed nothing he could see — both measured against
#  `void_`, which is not what is behind those labels. A screenshot with
#  a terminal behind the Start menu shows its diff readable THROUGH the
#  app list.
#
#  THIS FILE DOES NOT CHANGE. Blur stays off; the clear-glass look is
#  what he asked for three times and it is not the problem. The fix is
#  the missing half of the sentence above — the panels now carry a real
#  body, as a gradient, under their type: `shell/GlassEdge.qml`'s
#  `body` property and Theme § THE SWELL BODY, held by gate 13pu check 8.
#
#  ── FILE ORDER IS LOAD-BEARING (2026-07-30) ────────────────────────
#  Hyprland applies layerrules in file order and the LAST match wins.
#  The ^(nyxus.*)$ floor comes FIRST; anything explicit below it wins.
#
#  The eww-era namespaces are gone (eww deleted 2026-08-03); their rules
#  left with rev 2026-08-09.
#
# ============================================================

# ── Floor: every nyxus-* surface is CLEAR glass — the bar's material ──────
layerrule = blur off, match:namespace ^(nyxus.*)$

# ── The bar, stated explicitly (gate 13pu greps this exact plain form) ────
layerrule = blur off, match:namespace nyxus-bar

# ── If a future surface ever NEEDS frost, it must opt in BELOW this line,
#    as a pair — blur on + an ignore_alpha clip strictly between 0 and 0.55
#    (gate 13aj) — with a comment saying why it gets to break the mandate.
#    dunst `notifications` and `rofi` are not namespaces the shell opens
#    (toasts live on nyxus-toasts; Start is nyxus-launcher). Do not point
#    frost at a surface that is never mapped.

# ══ THE FROST · nyxus-frost — the one surface that opts IN, and why ═══════
#
# This is the opt-in the block above provides for, and it is the owner's own
# ask coming back — the ORIGINAL one, from months ago, which was never built:
#
#   "blurred out so you couldn't read or see what was on a window … you see
#    the outlines of stuff but its blurred out"
#
# ⚠ IT DOES NOT BREAK THE ONE-MATERIAL MANDATE, and the distinction is the
# whole justification. The 2026-08-09 mandate is about what the shell's own
# GLASS SURFACES are made of — the bar, Start, the widgets, the flyouts: every
# pane you LOOK AT wears the bar's clear glass. `nyxus-frost` is not a pane you
# look at. It has no chrome, no border, no material and nothing drawn in it: it
# is an invisible sheet whose only job is to give the compositor something to
# blur BEHIND, over application windows that are not focused. It is a function,
# not a finish, and it wears no material for the mandate to govern.
#
# `Frost.qml` paints only the rectangles of the unfocused windows and leaves
# every other pixel at alpha 0. `ignore_alpha 0.05` is what turns that into the
# effect's SHAPE: the compositor skips blur wherever alpha ≤ 0.05, so the blur
# is clipped to exactly those rectangles. The panes ARE the mask. Nothing else
# on screen — not the bar, not the wallpaper, not the focused window — is
# touched by this rule.
#
# `xray off` is not optional and it is the trap that wastes a day. With xray
# ON, blur samples the WALLPAPER ONLY: the pane fills with blurred wallpaper
# and the window under it disappears, which looks exactly like the transparency
# defect this feature exists to REPLACE. Measured, docs/proof/frost-0831 —
# under-pane mean luminance 43.4 with xray off (the window's own brightness,
# so its shape still reads) against 20.8 with xray on (collapsed to empty
# wallpaper). hyprland.conf still sets `xray = true` globally and
# nyxus-hyprland-blur.conf overrides it to false; this line pins it for this
# namespace so neither of those two edits can silently take the feature out.
#
# ⚠ ALL THREE LINES ARE ONE DECISION. `blur on` without `ignore_alpha` blurs
# the entire screen; `blur on` without `xray off` blurs the wallpaper instead
# of the window. Removing any one of them leaves the other two drawing a
# plausible-looking tinted rectangle that does nothing — the "dead simulation
# that looks like a design decision" failure Frame.qml records.
#
# ⚠ AND IT NEEDS decoration:blur:enabled = true, which lives in
# nyxus-hyprland-blur.conf and which the owner turned OFF on 2026-08-12.
# `layerrule = blur on` is a NO-OP without it — measured both ways with only
# that global moved (captures F and G): off → text under the pane fully
# legible, on → destroyed. See that file's header for why turning it back on
# is safe here and what it costs.
layerrule = blur on,           match:namespace nyxus-frost
layerrule = ignore_alpha 0.05, match:namespace nyxus-frost
layerrule = xray off,          match:namespace nyxus-frost
