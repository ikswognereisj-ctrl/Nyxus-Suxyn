# ============================================================
#  NYXUS — Hyprland compositor blur (GALAXY rev 2026-05-07)
#  ~/.config/hypr/conf.d/nyxus-hyprland-blur.conf
#
#  r3 · 2026.05.07 — Re-tuned for GALAXY glass.
#
#  Apps now paint themselves as dark translucent glass
#  (rgba(8,12,20,0.55) panels via nyxus_chrome.py r12). The
#  blur multiplier no longer needs to whitewash the surface —
#  it should just soften what's behind so the dark glass reads
#  as a mirror, not a milk-glass cream sheet.
#
#  r6 · 2026-08-06 — RE-TUNED FOR A DARK WALLPAPER (WIP-87).
#
#  The r3 block below is kept because its reasoning is sound and its
#  PREMISE is what expired. In May the wallpaper was the forked build's
#  bright graffiti wall, so brightness was pulled 1.5 → 0.92 to darken
#  what was behind the glass, vibrancy sat low at 0.18, and
#  vibrancy_darkness 0.30 held dark areas down. Every one of those is a
#  brightness-REDUCING choice, and they were right against a bright wall.
#
#  The wallpaper is now a near-black rose. There is nothing bright left
#  to hold back, so those three settings stopped protecting legibility
#  and started erasing the material: blur takes a near-black wallpaper,
#  darkens it 8%, desaturates it, and pins the darks — and the glass has
#  nothing behind it to show. The owner's report was that the Start menu
#  and flyout "need to be that glass look more"; this is why they weren't.
#
#  So the blur now LIFTS instead of crushing. What is deliberately NOT
#  touched is the panel alpha: Theme.qml's glassFill 0.46 /
#  glassFillStrong 0.66 carry a screenshot-backed finding that 0.44 let
#  you read the editor behind an app grid — WIP-19's defect reached from
#  the other side. Alpha is not the lever here and has already been tried.
#
#  ── REVERT IF THE FROST READS TOO MILKY ─────────────────
#    sudo sed -i 's/brightness = 1.28/brightness = 0.92/;
#                  s/vibrancy           = 0.42/vibrancy           = 0.18/;
#                  s/vibrancy_darkness  = 0.12/vibrancy_darkness  = 0.30/' \
#       ~/.config/hypr/conf.d/nyxus-hyprland-blur.conf
#    hyprctl reload
#
#  ── r3 · the original reasoning, superseded above ───────
#  Brightness pulled back from 1.5 → 0.92 so the blur darkens
#  the wallpaper underneath the glass instead of brightening it.
#  Vibrancy at 0.18 keeps the wallpaper colors faintly visible
#  beneath the dark wash.
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── BLUR IS OFF (owner's ruling, 2026-08-12) ────────────────────────────────
# His words, twice: "if we could take off the thing that makes all the tabs
# open blurred too, that was something from before but it isn't how I wanted
# it either, so if we can just get rid of that too."
#
# It was `enabled = true` at size 14 ("heavy frost") with 4 passes and
# `ignore_opacity = true` — which is why EVERYTHING read as frosted rather
# than only the translucent things: ignore_opacity blurs behind a window
# regardless of how opaque that window is.
#
# This does NOT change the shell's own surfaces. `nyxus-hyprland-layerblur
# .conf` already carries `layerrule = blur off, match:namespace ^(nyxus.*)$`,
# so the bar, Start menu, widgets and flyouts were never blurred by this and
# are not affected. What changes is ordinary application windows, which is
# exactly what he was looking at when he asked.
#
# The values below are preserved rather than deleted so re-enabling is one
# word, and so the next reader can see what the frost used to be.
decoration {
    blur {
        enabled            = false         # owner 2026-08-12 — was true
        size               = 14            # heavy frost (inert while disabled)
        passes             = 4             # smooth, no banding (inert)
        new_optimizations  = true
        # r4 · 2026-08-05 — was `false`, which means "do not blur behind a
        # window that a windowrule made translucent". Every NYXUS app IS
        # made translucent by a windowrule, so the one class of window this
        # setting was written for was the only class it excluded, and the
        # apps sat over raw wallpaper and each other with no frost at all.
        ignore_opacity     = true
        xray               = false
        brightness         = 1.00          # LIFT what is behind the glass (r6; was 0.92
                                           # for a bright wall, 1.5 before that)
        contrast           = 1.10          # hold edges crisp once brightness lifts
        vibrancy           = 0.42          # let the rose's blues and violets through (r6)
        vibrancy_darkness  = 0.12          # r6: this is the most anti-glass setting on a
                                           # dark wallpaper — it pins the darks flat
        noise              = 0.06          # subtle etched-glass grain

        # r5 · 2026-08-05 — POPUPS. Hyprland defaults `popups` to false, so
        # menus, dropdowns and tooltips were the one class of our own surface
        # the frost never reached. That did not show while they were opaque
        # hexes; it shows the moment they become glass, and it shows as
        # WIP-19's window-shaped hole at menu size — you would read the
        # desktop through your own right-click menu.
        #
        # So this line and the popover rules in gtk-3.0/gtk.css,
        # gtk-4.0/gtk.css and nyxus_chrome.py are ONE decision. Turning this
        # back off without making those popovers opaque again puts the hole
        # back. Gate 13pu checks the pair.
        popups             = true
        popups_ignorealpha = 0.2           # same floor the layer rules use
    }
}
