# NYXUS — pixel fidelity. Integer pixels, no XWayland smear, no texture upsample.
# Sourced from hyprland.conf. Do not re-enable compositor blur from here.
# Owner 2026-09-10: every pixel razor-sharp. Blur stays OFF (nyxus-hyprland-blur.conf).

xwayland {
    force_zero_scaling   = true
    use_nearest_neighbor = true
}

cursor {
    no_hardware_cursors  = false
    enable_hyprcursor    = true
    sync_gsettings_theme = true
    hotspot_padding      = 0
}

render {
    expand_undersized_textures = false
    direct_scanout             = 0
}

opengl {
    nvidia_anti_flicker = true
}

misc {
    vrr         = 0
    font_family = Inter
}
