# Toolkit theme for processes Hyprland `env =` never reaches (D-Bus, user units).
# HARD RULE: GPU vendor env does NOT live here. LIBVA_DRIVER_NAME and
# __GLX_VENDOR_LIBRARY_NAME are set per-machine by nyxus-session-start
# (and, on disk, firstboot / nyxus-hwcaps). An NVIDIA-only default would
# break Intel/AMD boxes.
GTK_THEME=adw-gtk3-dark
QT_QPA_PLATFORMTHEME=qt6ct
ADW_DEBUG_COLOR_SCHEME=prefer-dark
