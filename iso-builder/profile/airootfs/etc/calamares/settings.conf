---
# Nyxus Suxyn installer sequence — NEW image, Sep 2 pipeline without Core lab.
# install_dir=suxyn (unpackfs + copykernel paths).
modules-search: [local, /usr/lib/calamares/modules]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - luksbootkeyfile
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@copykernel
      - shellprocess@initramfs
      - grubcfg
      - bootloader
      - packages
      - shellprocess
      - preservefiles
      - umount
  - show:
      - finished

instances:
  - id: copykernel
    module: shellprocess
    config: shellprocess_copykernel.conf
  - id: initramfs
    module: shellprocess
    config: shellprocess_initramfs.conf

branding: nyxus
prompt-install: true
dont-chroot: false
