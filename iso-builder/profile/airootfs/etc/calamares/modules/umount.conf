# Deliberately empty, and the file stays so the reasoning does (2026-08-13).
#
# Two wrong versions preceded this. The original said
# `srcLog: "/var/log/Calamares.log"` — the DESTINATION path from upstream's
# example in the source slot, so nothing was ever found to copy. The 08-13
# audit "fixed" it to srcLog=/root/.cache/calamares/session.log +
# destLog=/var/log/Calamares.log — and a full install then proved the target
# still carried no log, because this build's Calamares 3.3.15 ships the C++
# umount job, which reads NO configuration at all: neither key exists in
# libcalamares_job_umount.so (checked with `strings`). srcLog/destLog are the
# 3.2 python module's schema.
#
# Log preservation is the `preservefiles` module's job on 3.3 — see
# modules/preservefiles.conf (`from: log`) and its slot in settings.conf
# between shellprocess and umount. Do not put srcLog/destLog back here; they
# read as a fix and do nothing.
