# ============================================================================
# NYXUS · Calamares · shellprocess@fdeprep
#
# Make sure the FDE tooling on the TARGET is the live session's copy.
# (TRK-1370, CS-1052)
#
# In a normal install this is a byte-identical no-op: unpackfs already put
# /usr/local/bin/nyxus-fde-wire and nyxus-fde-check on the target, because
# they ship in airootfs. It exists for the same reason as the copykernel
# instance above it in the sequence — the live session is the one place an
# install-time truth can be taken from — and it is what makes the VM proof
# of this path honest: the 08-13 install audit injected fixed files into the
# LIVE overlay over ssh, but unpackfs copies the READ-ONLY squashfs, so an
# injected fix would silently not be the code that runs in the chroot. This
# copy closes that gap: the wire script that runs on the target is always
# the one the live session carries, injected or baked.
#
# dontChroot, because /usr/local/bin of the LIVE system is only visible
# outside the chroot; $ROOT is substituted by Calamares with the target
# mount point. `|| true`: on a hypothetical image where the live copy is
# missing, the unpackfs copy is still there and the chroot step that needs
# it will speak up itself — this step must not fail an unencrypted install
# over a convenience copy.
#
# NO $word variables beyond $ROOT — the shellprocess module validates every
# $word against its two-variable table up front, and one stray $var disarms
# the whole command list (the 2026-08-13 lesson in shellprocess.conf).
#
# © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================================
---
dontChroot: true
timeout: 30

script:
  - command: "sh -c \"cp -f /usr/local/bin/nyxus-fde-wire /usr/local/bin/nyxus-fde-check $ROOT/usr/local/bin/ 2>/dev/null && chmod 0755 $ROOT/usr/local/bin/nyxus-fde-wire $ROOT/usr/local/bin/nyxus-fde-check 2>/dev/null || true\""
    timeout: 15
