# ============================================================================
# Nyxus Suxyn · Calamares · post-install shellprocess
# Scrub live-only artifacts. No Core lab scripts (kage grub, hemera, FDE).
# ⚠ NO $word variables except $USER / $ROOT (Calamares expands those only).
# ============================================================================
---
dontChroot: false
timeout: 30

script:
  - command: "rm -f /etc/sudoers.d/10-nyxus-live"
    timeout: 10
  - command: "test ! -e /etc/sudoers.d/10-nyxus-live"
    timeout: 10
  - command: "visudo -c"
    timeout: 10
  - command: "sed -i '/^# LIVE-ONLY-AUTOLOGIN/,/^# END-LIVE-ONLY-AUTOLOGIN/d' /etc/greetd/config.toml"
    timeout: 10
  - command: "bash /usr/local/bin/nyxus-remove-live-user $USER"
    timeout: 30
  - command: "systemctl disable --now nyxus-live-user.service >/dev/null 2>&1 || true"
    timeout: 10
  - command: |
      bash -c '
      set +e
      if ! command -v snapper >/dev/null 2>&1; then
        echo "[shellprocess] snapper not installed — skipping snapshot setup"
        exit 0
      fi
      if [ "$(findmnt -no FSTYPE / 2>/dev/null)" != "btrfs" ]; then
        echo "[shellprocess] root is not btrfs — skipping snapshot setup"
        exit 0
      fi
      echo "[shellprocess] root is btrfs — configuring snapper"
      if [ ! -f /etc/snapper/configs/root ]; then
        umount /.snapshots 2>/dev/null
        rmdir /.snapshots 2>/dev/null
        if snapper --no-dbus -c root create-config /; then
          mv /.snapshots /.snapshots-tmp
          mkdir -p /.snapshots
          if mount /.snapshots 2>/dev/null; then
            btrfs subvolume delete /.snapshots-tmp >/dev/null 2>&1 || rm -rf /.snapshots-tmp
            echo "[shellprocess] snapper root config created, @snapshots remounted"
          else
            rmdir /.snapshots 2>/dev/null
            mv /.snapshots-tmp /.snapshots
            echo "[shellprocess] WARN could not remount @snapshots via fstab"
          fi
          snapper --no-dbus -c root set-config \
            TIMELINE_CREATE=yes TIMELINE_CLEANUP=yes NUMBER_CLEANUP=yes \
            NUMBER_LIMIT=10 NUMBER_LIMIT_IMPORTANT=10 \
            TIMELINE_LIMIT_HOURLY=5 TIMELINE_LIMIT_DAILY=7 \
            TIMELINE_LIMIT_WEEKLY=4 TIMELINE_LIMIT_MONTHLY=3 TIMELINE_LIMIT_YEARLY=0
        else
          echo "[shellprocess] WARN snapper -c root create-config failed"
        fi
      fi
      if [ -d /home ] && [ "$(findmnt -no FSTYPE /home 2>/dev/null)" = "btrfs" ] && [ ! -f /etc/snapper/configs/home ]; then
        if snapper --no-dbus -c home create-config /home; then
          snapper --no-dbus -c home set-config \
            TIMELINE_CREATE=yes TIMELINE_CLEANUP=yes NUMBER_CLEANUP=yes \
            NUMBER_LIMIT=10 NUMBER_LIMIT_IMPORTANT=10 \
            TIMELINE_LIMIT_HOURLY=0 TIMELINE_LIMIT_DAILY=7 \
            TIMELINE_LIMIT_WEEKLY=4 TIMELINE_LIMIT_MONTHLY=3 TIMELINE_LIMIT_YEARLY=0
        else
          echo "[shellprocess] WARN snapper -c home create-config failed"
        fi
      fi
      if [ -f /etc/snapper/configs/root ]; then
        snapper --no-dbus -c root create --type single --cleanup-algorithm number \
          --description "initial installation" 2>/dev/null \
          && echo "[shellprocess] initial root snapshot taken" \
          || echo "[shellprocess] WARN initial snapshot failed (non-fatal)"
      fi
      systemctl enable btrfs-scrub@-.timer >/dev/null 2>&1 \
        && echo "[shellprocess] monthly btrfs scrub enabled on /" \
        || true
      if command -v grub-mkconfig >/dev/null 2>&1 && [ -f /boot/grub/grub.cfg ]; then
        grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1 \
          && echo "[shellprocess] GRUB regenerated" \
          || echo "[shellprocess] WARN grub-mkconfig failed"
      fi
      exit 0
      '
    timeout: 120
  - command: "rm -f /usr/share/applications/install-nyxus.desktop /etc/skel/Desktop/install-nyxus.desktop"
    timeout: 10
  - command: |
      bash -c 'rm -f /home/*/Desktop/install-nyxus.desktop /root/Desktop/install-nyxus.desktop 2>/dev/null; true'
    timeout: 10
