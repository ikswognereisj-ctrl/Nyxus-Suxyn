# ============================================================================
# NYXUS · Calamares · preservefiles — the install log reaches the disk
#
# (2026-08-13, found by mounting an installed target and looking.) This build
# ships Calamares 3.3.15, whose umount module is C++ and reads NO srcLog /
# destLog keys — `strings` on libcalamares_job_umount.so shows neither. The
# log-preservation duty moved upstream to THIS module: `from: log` is a
# special source meaning "the running session's own log", and the module
# resolves it without needing the /root/.cache path spelled out. Runs in the
# exec sequence after shellprocess and before umount, while the target is
# still mounted.
#
# Without this, a failed first boot leaves the user with a disk that carries
# no record of what the installer did — the exact situation the audit's
# "read the full install log" requirement exists to prevent.
#
# © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================================
---
# The top-level key is `files:`, not `preserve:` — the shipped C++ module
# logs "No 'files' key for preservefiles." and FAILS the whole install
# otherwise (seen live 2026-08-13 07:41, one job from the finish line).
# Key names verified against the binary: `strings
# libcalamares_job_preservefiles.so` lists files/from/dest/perm.
files:
  - from: log
    dest: /var/log/Calamares.log
    perm: root:root:600
