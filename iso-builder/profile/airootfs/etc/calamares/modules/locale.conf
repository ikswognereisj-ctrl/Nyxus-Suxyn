---
# ── the default timezone lives HERE, not in a timezone.conf (WIP-318) ───────
# These two keys used to sit in `modules/timezone.conf`, config for a
# `timezone` module that this Calamares does not have and never had — and
# listing that module in settings.conf stopped the installer starting at all.
#
# Upstream folded timezone selection into `locale` long ago: this module draws
# the world map with the region/zone pickers, and reads exactly these keys for
# where the pin starts. So the default is preserved, on the module that
# actually exists.
region: "America"
zone: "New_York"
