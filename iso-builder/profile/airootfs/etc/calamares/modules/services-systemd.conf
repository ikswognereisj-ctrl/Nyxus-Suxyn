---
# ============================================================
#  NYXUS · Suxyn — Calamares services-systemd
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
#  rev 2026-08-10 — WIP-253: this file named `sddm`, a display manager
#  this build does not ship.
# ============================================================
#
# THREE BUGS LIVED HERE AT ONCE. All were invisible to every gate, because
# every gate reads the tree and the tree looked fine.
#
# ── BUG 1 · it enabled the wrong display manager ────────────────────────
# This list said `- name: sddm` and never named greetd. `sddm` is not in
# packages.x86_64 (see the note at its line 688: "SDDM is not installed")
# and has not been since the greeter moved to greetd — greetd's Wayland
# greeter is what dodges the SDDM X11 hybrid-GPU crash this laptop has a
# documented history of. So on the Calamares path the installer asked the
# target to enable a unit that does not exist, and never asked for the one
# that does.
#
# Why an installed system still booted anyway: `unpackfs` copies the LIVE
# root onto the disk, and `customize_airootfs.sh:313` already ran
# `systemctl enable greetd.service` inside that root at bake time. The
# enable state is therefore INHERITED, and this module's greetd entry is
# belt-and-braces rather than the only thing standing between the user and
# a console. That is exactly why `mandatory` stays false below — see the
# note on abort semantics further down.
#
# ── BUG 2 · the schema this file used is not the schema the module reads ─
# Upstream `services-systemd/main.py` reads ONE key:
#
#     return_value = systemctl(cfg.get("units", []))
#
# There is no fallback for the older `services:` / `targets:` keys this
# file used — a 3.3-era Calamares parses this config, finds no `units`,
# and enables NOTHING. Silently. It does not warn that it understood none
# of the file. So the sddm line was not merely wrong, it was probably not
# even reaching systemctl.
#
# `services:` + `targets:` IS the correct 3.2-era schema, and this build
# pulls calamares from [blackarch] (packages.x86_64:736), whose version we
# do not pin and cannot read from here. So this file now declares BOTH.
# Each version reads its own key and ignores the other as an unknown
# mapping; there is no version in which declaring both is worse than
# declaring one. Keep them in sync — gate 13q12 fails the build if the two
# blocks disagree, or if either one ever names a display manager that is
# not greetd.
#
# ── BUG 4 · the two blocks DID disagree, and the gate did not look ──────
# (2026-08-15, CC.) The comment above promised 13q12 compares the blocks.
# It did not: it asserted only that both KEYS exist and that `greetd` is
# named at least twice. Under that gate the snapshot stack —
# snapper-timeline.timer, snapper-cleanup.timer, grub-btrfsd.service — sat
# in `units:` only for as long as it had existed. On a 3.2-era calamares
# that is not a cosmetic asymmetry: snapper-timeline would not be enabled,
# so no timeline snapshots; and snapper-CLEANUP would not be enabled, so
# nothing prunes what snap-pac takes around every pacman transaction. The
# disk fills. The owner hit 99% on 2026-08-15, which is what moved this
# from tidy-up to defect. The three are now in both blocks and 13q12
# actually compares them, name by name.
#
# ── The 3.2 suffix trap, recorded rather than silently worked around ────
# The 3.2 module appends the unit suffix itself:
#     systemctl(services, "enable", "service")  →  "{}.{}".format(name, suffix)
# So a `services:` entry is written BARE and comes out as `<name>.service`.
# Four entries in that block below carry an explicit `.timer` — fstrim,
# paccache, reflector and the two snapper timers — which a 3.2-era module
# would turn into `fstrim.timer.service` and fail to enable (non-fatally:
# every entry here is non-mandatory). They are left spelled that way on
# purpose, because changing them is a behaviour change on a calamares
# generation nobody here has ever run, and because a `.timer` cannot be
# expressed in the 3.2 `services:` schema AT ALL — that schema predates
# the module learning about timers. Filed as its own row rather than
# guessed at. The 3.3 `units:` block above, which is what a modern
# calamares actually reads, spells every one of them correctly.
#
# So: the honest scope of the 3.2 half of this fix is `grub-btrfsd`, which
# does become `grub-btrfsd.service` and does enable. The two snapper timers
# are declared for symmetry and for the gate; on a 3.2 installer they would
# still not arm, and no wording here should be read as claiming otherwise.
#
# ── BUG 3 · the target was named twice ──────────────────────────────────
# The old file said `targets: - name: graphical.target`. In the 3.2 schema
# the module APPENDS the unit suffix, so that asked systemd to enable
# `graphical.target.target`. Under `targets:` the name is bare; under
# `units:` it carries its suffix. Both spellings below are correct for the
# block they sit in.
#
# ── on `mandatory` ──────────────────────────────────────────────────────
# Upstream default is False (`unit.get("mandatory", False)`): a failed
# systemctl is a warning and the install continues. Every entry here is
# deliberately non-mandatory, greetd included. A mandatory:true that trips
# on a spurious chroot failure aborts the whole install and blocks REL-2;
# a warning leaves the user with a system that still boots, because the
# enable was already inherited from unpackfs. The guarantee that greetd is
# named correctly is the GATE, not a runtime abort.

# ── 3.3-era schema ──────────────────────────────────────────────────────
units:
  # The btrfs snapshot stack. Installed since forever, never enabled — see
  # partition.conf. snapper-timeline takes the periodic snapshots,
  # snapper-cleanup prunes them so they cannot fill the disk, and
  # grub-btrfsd regenerates the GRUB entries that let you BOOT into one.
  # mandatory:false throughout: on an ext4 install these units are
  # meaningless and must not fail the installation.
  - name: "snapper-timeline.timer"
    action: "enable"
    mandatory: false
  - name: "snapper-cleanup.timer"
    action: "enable"
    mandatory: false
  - name: "grub-btrfsd.service"
    action: "enable"
    mandatory: false
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: false
  - name: "greetd.service"
    action: "enable"
    mandatory: false
  - name: "bluetooth.service"
    action: "enable"
    mandatory: false
  - name: "cups.service"
    action: "enable"
    mandatory: false
  - name: "avahi-daemon.service"
    action: "enable"
    mandatory: false
  - name: "chronyd.service"
    action: "enable"
    mandatory: false
  - name: "thermald.service"
    action: "enable"
    mandatory: false
  - name: "power-profiles-daemon.service"
    action: "enable"
    mandatory: false
  # switcheroo-control (TRK-1205 / CS-1058, 2026-08-22): dual-GPU reporter for
  # hybrid boxes (AMD iGPU + NVIDIA dGPU = the owner's Alienware 15). D-Bus
  # activated, so mandatory: false — a single-GPU box just never wakes it.
  - name: "switcheroo-control.service"
    action: "enable"
    mandatory: false
  - name: "acpid.service"
    action: "enable"
    mandatory: false
  - name: "firewalld.service"
    action: "enable"
    mandatory: false
  - name: "earlyoom.service"
    action: "enable"
    mandatory: false
  - name: "irqbalance.service"
    action: "enable"
    mandatory: false
  - name: "systemd-zram-setup@zram0.service"
    action: "enable"
    mandatory: false
  - name: "fstrim.timer"
    action: "enable"
    mandatory: false
  - name: "paccache.timer"
    action: "enable"
    mandatory: false
  - name: "reflector.timer"
    action: "enable"
    mandatory: false
  # Firmware metadata. `fwupd` ships in both package lists and Settings →
  # Firmware Updates runs `fwupdmgr get-updates`, which reads the LOCAL
  # metadata cache — and nothing refreshed it, so the page reported against
  # whatever happened to be cached (on a fresh install: nothing) and said
  # "no updates" about a machine it had never checked.
  - name: "fwupd-refresh.timer"
    action: "enable"
    mandatory: false
  # Disk-failure warning (owner ruled YES 2026-08-15). smartmontools is new
  # in both package lists; /etc/smartd.conf routes the warning to the
  # logged-in desktop via nyxus-smart-toast instead of mailing root on a
  # machine with no MTA.
  - name: "smartd.service"
    action: "enable"
    mandatory: false
  - name: "nyxus-firstboot.service"
    action: "enable"
    mandatory: false
  # chrony and systemd-timesyncd fight over the clock; customize_airootfs.sh
  # disables timesyncd in the live root and nyxus-postinstall does the same on
  # the TUI path. The Calamares path had no equivalent until now.
  - name: "systemd-timesyncd.service"
    action: "disable"
    mandatory: false
  - name: "graphical.target"
    action: "enable"
    mandatory: false

# ── 3.2-era schema · same set, same order ───────────────────────────────
# Every name here must have a counterpart in `units:` above and vice versa;
# gate 13q12 compares them name by name (a `.service` suffix is the one
# difference it forgives, because the 3.2 module appends that suffix itself
# — see "the 3.2 suffix trap" in the header).
services:
  # The btrfs snapshot stack. These three were in `units:` and NOT here
  # until 2026-08-15, which on a 3.2-era calamares meant snapper-cleanup
  # never enabled and snapshots grew until the disk filled.
  - name: snapper-timeline.timer
  - name: snapper-cleanup.timer
  - name: grub-btrfsd
  - name: NetworkManager
  - name: greetd
  - name: bluetooth
  - name: cups
  - name: avahi-daemon
  - name: chronyd
  - name: thermald
  - name: power-profiles-daemon
  - name: switcheroo-control
  - name: acpid
  - name: firewalld
  - name: earlyoom
  - name: irqbalance
  - name: systemd-zram-setup@zram0
  - name: fstrim.timer
  - name: paccache.timer
  - name: reflector.timer
  - name: fwupd-refresh.timer
  - name: smartd
  - name: nyxus-firstboot
disable:
  - name: systemd-timesyncd
targets:
  - name: graphical
