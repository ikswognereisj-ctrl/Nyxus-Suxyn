---
# ============================================================
#  NYXUS · Suxyn — Calamares displaymanager
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
#  rev 2026-08-10 — WIP-253
# ============================================================
#
#  ★ THIS MODULE IS DELIBERATELY NOT IN THE SEQUENCE. ★
#
#  See settings.conf — `displaymanager` was removed from the `exec` list.
#  The file is kept, not deleted, because the reasoning below is the whole
#  point and a future agent WILL otherwise "fix" the sequence by adding the
#  module back. Read this before you do that.
#
# ── what it used to say, and why that was wrong ─────────────────────────
# `displaymanagers: [sddm]`. sddm is not in packages.x86_64 and this build
# has used greetd since the SDDM X11 greeter crashed on the hybrid
# Intel+NVIDIA target. With no listed DM installed, upstream's run() logs a
# warning and returns None — so it was a silent no-op, not a crash. Wrong,
# but harmless.
#
# ── why repointing it at greetd would be WORSE than leaving it broken ───
# Upstream `DMgreetd.set_autologin()` is called UNCONDITIONALLY (it is not
# gated on basicSetup, and not gated on whether autologin was requested),
# and it does this:
#
#     elif os.path.exists(self.os_path("usr/bin/tuigreet")):
#         tuigreet_base_cmd = "tuigreet --remember --time --issue --asterisks --cmd "
#         self.config_data['default_session']['command'] = tuigreet_base_cmd + de_command
#
# `greetd-tuigreet` IS in packages.x86_64 (line 690) — it is step 3 of
# nyxus-greeter's never-lock-out fallback chain. So on every install this
# module would find /usr/bin/tuigreet and OVERWRITE
#
#     command = "/usr/local/bin/nyxus-greeter"     (regreet, themed, graphical)
# with
#     command = "tuigreet --remember ... --cmd Hyprland"   (text login)
#
# Every installed system would land on a TEXT greeter while the live stick
# showed the branded graphical one. That is precisely the "green gates,
# wrong skin" failure this repo has already shipped once.
#
# It gets worse: config_write() is `toml.dump()`, which reconstructs the
# file and DROPS EVERY COMMENT. /etc/greetd/config.toml's live-autologin
# block is delimited by two comments —
#
#     # LIVE-ONLY-AUTOLOGIN  ...  # END-LIVE-ONLY-AUTOLOGIN
#
# — and shellprocess.conf strips that block with a sed keyed on exactly
# those two lines. toml.dump would delete the delimiters, the sed would
# then match nothing, and any autologin left in the file would survive onto
# the installed system: a machine that logs itself in with no password.
#
# ── what does the job instead ───────────────────────────────────────────
#   · the greeter config ships fully-formed in airootfs and arrives on the
#     target via unpackfs — /etc/greetd/config.toml, regreet.toml,
#     regreet.css, nyxus-login-bg.png
#   · /etc/systemd/system/display-manager.service is a committed symlink to
#     greetd.service, so the alias exists before systemctl is ever asked
#   · customize_airootfs.sh:313 enables greetd.service in the live root,
#     and unpackfs carries that enable onto the disk
#   · services-systemd.conf names greetd explicitly as belt-and-braces
#   · shellprocess.conf strips the live-only autologin block
#
# Nothing in that chain needs this module, and this module cannot join it
# without breaking it.
#
# ── if you ever DO re-enable it ─────────────────────────────────────────
# The list below says greetd rather than sddm so that a re-enable is at
# least aimed at the right daemon — but re-enabling still costs you the
# regreet chain and the comment delimiters. Gate 13q12 fails the build if
# `displaymanager` reappears in settings.conf's sequence.

displaymanagers:
  - greetd
defaultDesktopEnvironment:
  executable: "Hyprland"
  desktopFile: "hyprland"
basicSetup: false
sysconfigSetup: false
