---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: /dev/pts
    fs: devpts
    mountPoint: /dev/pts
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  # ── efivarfs, or grub-install cannot register the boot entry (2026-08-13) ──
  # A fresh sysfs mount does NOT bring /sys/firmware/efi/efivars with it —
  # efivarfs is its own filesystem and must be mounted explicitly. The
  # bootloader module runs `grub-install --target=x86_64-efi ...` inside the
  # chroot with no --no-nvram, and grub-install ends by calling efibootmgr to
  # write the NVRAM boot entry; with no efivarfs in the chroot that write
  # fails, check_target_env_call raises, and every UEFI install dies at the
  # bootloader step after twenty minutes of copying. Upstream's own mount.conf
  # and every Arch-family distro (EndeavourOS, CachyOS) carry exactly this
  # entry. `efi: true` keeps it off BIOS installs, where there is nothing to
  # mount.
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# ── SUBVOLUMES — the half that makes snapshots actually safe ───────────────
# Without a layout, btrfs installs to a single top-level volume and a snapper
# snapshot of / CONTAINS /home. Rolling back a bad update would then drag the
# user's documents back in time with it — worse than having no snapshots at
# all, and the failure would only show up the first time someone relied on it.
#
# @            the system, and the only thing rollback touches
# @home        excluded from system snapshots on purpose
# @snapshots   snapper's store, mounted where snapper expects it
# @log, @pkg   excluded so a rollback does not erase the logs that explain
#              why you rolled back, or blow away the package cache
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /var/cache/pacman/pkg
    subvolume: /@pkg
