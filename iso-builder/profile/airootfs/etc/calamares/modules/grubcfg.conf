---
overwrite: true

# The installed system's kernel command line. THIS MUST BE kernel_params.
# The shipped Calamares grubcfg module (main.py) copies every defaults: key
# into the dict it is about to write, then overwrites GRUB_CMDLINE_LINUX_DEFAULT
# unconditionally from kernel_params (a YAML list; default ["quiet"] if the
# key is absent). Putting the tokens under defaults.GRUB_CMDLINE_LINUX_DEFAULT
# therefore assembles a line and throws it away: every install got ["quiet"]
# plus whatever the module appends itself, and nothing reported it — the key
# is legal YAML and defaults: is additionalProperties: true.
#
# kernel_params is a LIST of strings, not a string (grubcfg.schema.yaml).
#
# Do not list tokens the module appends by itself. overwrite: true means it
# never reads the existing file, so it never de-duplicates:
#   splash   — when `which plymouth` succeeds in the target. plymouth is in
#              packages.x86_64, so it always does.
#   resume= / rd.luks.uuid= / cryptdevice= — from the installed partitions.
# GRUB_DISTRIBUTOR is also overwritten from branding bootloaderEntryName
# ("Nyxus Suxyn") unless keep_distributor: true. Product is Nyxus Suxyn.
kernel_params:
  - quiet
  - loglevel=3
  - rd.udev.log_priority=3
  - vt.global_cursor_default=0
  - acpi_backlight=native

defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_INPUT: "console"
  GRUB_GFXMODE: "auto"
  GRUB_DISABLE_OS_PROBER: false
  GRUB_DISTRIBUTOR: "Nyxus Suxyn"
