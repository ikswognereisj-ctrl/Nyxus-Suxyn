# ============================================================================
# Nyxus Suxyn · Calamares · shellprocess@copykernel
#
# mkarchiso strips /boot from airootfs. Copy vmlinuz + ucode from the ISO
# (install_dir=suxyn) onto the target before mkinitcpio / grub-mkconfig.
# ============================================================================
---
dontChroot: true
timeout: 60

script:
  - command: "sh -c \"cp -f /run/archiso/bootmnt/suxyn/boot/x86_64/vmlinuz-* $ROOT/boot/\""
    timeout: 30
  - command: "sh -c \"cp -f /run/archiso/bootmnt/suxyn/boot/intel-ucode.img $ROOT/boot/ || true\""
    timeout: 15
  - command: "sh -c \"cp -f /run/archiso/bootmnt/suxyn/boot/amd-ucode.img $ROOT/boot/ || true\""
    timeout: 15
