---
efiSystemPartition: "/boot/efi"
# ── the swap choices, and which one is the DEFAULT (CS-1059/1066, 08-22) ───
# The page shows these as No Swap / Swap (no Hibernate) / Swap (with
# Hibernate) / Swap to file.
#
# ⚠ THE DEFAULT IS `file`, NOT `none` — SUP ruling on TRK-1305, 2026-08-22
# (owner delegated the call): "Hibernate must work on a default install where
# the disk can afford it. No silent impossibility." Leading with `none` meant
# every default install was incapable of hibernating and nothing ever said so.
# Both mechanisms are set on purpose, because they are not the same key and
# only one of them is load-bearing on any given Calamares build:
#   · the list ORDER — the first entry is what the page pre-selects when
#     `initialSwapChoice` is absent or unhonoured;
#   · `initialSwapChoice` — the explicit key (verified present in the shipped
#     partition module's .so alongside userSwapChoices / ensureSuspendToDisk).
# Setting both means the default cannot silently revert to the list head.
#
# WHAT SIZES IT. Not this file, and NOT the shipped fstab module, which
# hardcodes `desired_size = 512 MiB` — a swapfile that can never hold a
# hibernation image on any machine this build targets. `nyxus-hibernate
# --setup` (shellprocess@hibernate) re-sizes the file the module created:
# ceil(RAM) + 2 GiB, capped at 40 GiB, and only when ≥ 25 GiB stays free
# afterwards. When it does not fit, the small swapfile stays as ordinary swap,
# no resume= is written, and the REASON is recorded in
# /var/lib/nyxus/hibernate.state so Settings and the PowerMenu can say
# "hibernate unavailable: <why>" instead of quietly hiding the tile.
#
# `suspend` remains for anyone who wants a real swap PARTITION sized against
# RAM by the module itself (upstream swapSuggestion with ensureSuspendToDisk);
# `small` is a partition below RAM and cannot hibernate — `--check` says so.
# Gate 13s24 computes the default from this file; it does not read this
# comment.
userSwapChoices: [file, suspend, small, none]
initialSwapChoice: file

# ── The "Encrypt system" checkbox is OFF, by the owner's ruling (WIP-585) ───
# Decided 2026-08-13 after the audit proved the trap live: the checkbox
# rendered on the erase-disk page, but nothing behind it was wired — no
# luksbootkeyfile/luksopenswaphookcfg in the sequence, no `encrypt` hook in
# the shipped mkinitcpio HOOKS, no GRUB_ENABLE_CRYPTODISK — so a user who
# ticked it got a LUKS container GRUB cannot open: an unbootable machine from
# the one page that lets users make choices. Hiding the option removes the
# trap; it does not close the door. If encryption is ever wired for real,
# WIP-585 lists every piece that has to land together, and this key (name
# verified against the shipped partition module's .so) flips back to true —
# never before.
#
# ── UPDATE 2026-08-22 (TRK-1370..1375, CS-1052): the wiring EXISTS now ──────
# Every piece WIP-585 listed is in the tree: luksbootkeyfile in the exec
# sequence, nyxus-fde-wire putting `encrypt` in HOOKS + the keyfile in FILES
# before mkinitcpio -P, crypttab via fstab.conf, cryptdevice= +
# GRUB_ENABLE_CRYPTODISK from the grubcfg module itself, luksGeneration
# below. The key still ships FALSE because the owner's ruling stands until
# the whole path is PROVEN install→boot→unlock in a VM on BOTH firmware
# paths ON THIS SHA (TRK-1375 records that proof's state). The runtime arm
# switch is `touch /etc/nyxus/fde-enabled` on the live session before
# launching the installer — nyxus-install-live then flips this exact line
# to true (gate 13s81 pins the pattern so the sed can never silently miss).
# The flag file ships absent; a bake never turns it on.
enableLuksAutomatedPartitioning: false
# ── LUKS2, decided with the wiring (TRK-1370) ───────────────────────────────
# Calamares defaults this to luks1, a fossil from GRUB's pre-Argon2 years —
# pre-2.13 GRUB could not open a LUKS2 header keyed with argon2id, so
# distros formatted down to LUKS1 to keep an encrypted /boot bootable. The
# grub this tree installs (2:2.14) ships cryptodisk WITH argon2.mod, so the
# modern header is safe here and a 2026 install does not get 2018's KDF.
# Key name verified against the shipped partition module's .so
# (luksGeneration / Luks2), same method as the enableLuks key above.
luksGeneration: luks2
# ── btrfs BY DEFAULT (2026-08-11) ──────────────────────────────────────────
# This was "ext4", and that meant a default install shipped the ENTIRE btrfs
# snapshot stack switched off:
#
#   · packages.x86_64 installs btrfs-progs, snapper AND grub-btrfs
#   · fstab.conf already carries a tuned btrfs line
#     (noatime,compress=zstd:3,space_cache=v2,autodefrag)
#   · nyxus-backup-helper is written around snapper — its list/create/restore
#     are snapper calls, with timeshift only as a fallback
#
# On ext4 none of that does anything: no snapshots, no boot-into-snapshot, and
# the Backup app is a UI over nothing. That is the same "ships but does not
# run" shape as the Store execing a path nothing creates, or Media shipping
# without its launcher — the build keeps paying for it.
#
# btrfs also earns its keep on size here: compress=zstd:3 on a distro whose
# airootfs is ~5.8 GB is real disk back, and this profile already switched
# squashfs to zstd for measured reasons.
#
# ext4/xfs/f2fs stay available for anyone who wants them.
defaultFileSystemType: "btrfs"
# btrfs FIRST: on the 2026-08-13 live run the erase-disk filesystem combo
# displayed "ext4" (this list's first entry) while the summary page and the
# actual install applied btrfs (the default above). A user who wanted ext4
# would have read the combo as already-correct, not touched it, and gotten
# btrfs. Leading with the default makes the combo show what will happen.
availableFileSystemTypes: ["btrfs", "ext4", "xfs", "f2fs"]
swapPartitionName: swap

# ── ONE swap style, not two (WIP-318) ──────────────────────────────────────
# `userSwapChoices` above is the modern key. `ensureSuspendToDisk: true` and
# `neverCreateSwap: false` were the pre-3.2 pair, and Calamares logs
#
#   ERROR: Partition-module configuration mixes old- and new-style swap settings.
#
# on every start when both are present — seen in the 2026-08-11 boot log
# alongside the fatal timezone error. Nothing is lost by dropping them: the
# choices they expressed are already IN the new list — `suspend` is
# ensureSuspendToDisk, and `none` is neverCreateSwap — and the new key lets the
# user pick rather than pinning it at build time.
