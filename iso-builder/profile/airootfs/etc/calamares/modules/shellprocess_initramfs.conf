# ============================================================================
# Nyxus Suxyn · Calamares · shellprocess@initramfs
#
# Strip the live archiso mkinitcpio drop-in, derive MODULES from this
# machine (nyxus-hwdetect), then mkinitcpio -P. No Core FDE wire.
# ============================================================================
---
dontChroot: false
timeout: 900

script:
  - command: "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    timeout: 10
  # Live linux.preset is PRESETS=('archiso'). Restore default+fallback
  # BEFORE mkinitcpio -P or the disk rebuilds a live initramfs.
  - command: "bash /usr/local/bin/nyxus-restore-linux-preset"
    timeout: 10
  - command: "bash -c '/usr/local/bin/nyxus-hwdetect || true'"
    timeout: 60
  - command: "mkinitcpio -P"
    timeout: 900
