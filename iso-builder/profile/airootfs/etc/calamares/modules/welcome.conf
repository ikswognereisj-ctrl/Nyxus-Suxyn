# NYXUS · Calamares welcome module
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: true

requirements:
    # ── 20 GB, because the unpacked root is 15.6 GiB (measured 2026-08-13) ──
    # This said 12.0 while `unsquashfs -ll` on the 08-12 ISO's airootfs sums to
    # 15.6 GiB of files. A 12-15 GB disk PASSED the welcome check and then died
    # mid-unpackfs with a full disk — the exact half-installed brick this gate
    # exists to prevent. 20 gives the real payload plus the ESP, the initramfs
    # rebuild, and enough slack that the first snapper snapshot and a pacman
    # cache do not land on a 100%-full btrfs (which wedges: a full btrfs cannot
    # even delete). If the airootfs grows past ~17 GiB, raise this again.
    requiredStorage:   20.0
    requiredRam:       2.0
    internetCheckUrl:  https://archlinux.org

    check:
      - storage
      - ram
      - power
      - internet
      - root
      - screen

    required:
      - storage
      - ram
      - root
