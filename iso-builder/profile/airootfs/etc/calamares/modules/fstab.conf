---
mountOptions:
  default: defaults,noatime
  btrfs: defaults,noatime,compress=zstd:3,space_cache=v2,autodefrag
ssdExtraMountOptions:
  ext4: discard
# ── crypttab options are ARCH's, not Debian's (TRK-1370) ───────────────────
# This carried `luks,keyscript=/bin/cat` — `keyscript=` is a Debian
# cryptsetup-initramfs option that nothing on Arch implements:
# systemd-cryptsetup logs "Encountered unknown /etc/crypttab option
# 'keyscript=/bin/cat', ignoring" on every unlock. The fstab module writes
# these options on each crypttab line it generates (secondary LUKS
# partitions — an encrypted swap — unlocked via /crypto_keyfile.bin once
# the root is open; the root's own line gets `none` + no options when /boot
# is unencrypted, computed by the module itself).
crypttabOptions: luks
