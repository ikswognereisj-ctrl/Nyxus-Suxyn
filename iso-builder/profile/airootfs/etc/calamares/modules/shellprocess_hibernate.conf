# ============================================================================
# NYXUS · Calamares · shellprocess@hibernate                    (CS-1059/1066)
#
# Wire hibernation on the freshly-installed target. One command, in the
# chroot, no arguments: /usr/local/bin/nyxus-hibernate --setup reads the
# TARGET's /etc/fstab, and
#   · swap PARTITION (the installer's "Swap (with Hibernate)" choice, or
#     "Swap (no Hibernate)") → resume=UUID=<swap> on the kernel command line;
#   · SWAPFILE (the "Swap to file" choice; Calamares makes /swap/swapfile on
#     btrfs, /swapfile elsewhere) → resume=UUID=<fs> resume_offset=<pages>;
#   · no swap → any stale resume= token is stripped and nothing else changes.
# It also guarantees the `resume` initramfs hook is present in the winning
# HOOKS line (it ships there already; this covers repair/upgrade paths) and
# normalises GRUB_CMDLINE_LINUX_DEFAULT to double quotes.
#
# ORDER IS LOAD-BEARING: this instance must run AFTER `grubcfg` — grubcfg
# REWRITES /etc/default/grub (overwrite: true), so anything written earlier
# is discarded — and BEFORE `bootloader`, whose grub-mkconfig turns the file
# into the grub.cfg both firmware paths (UEFI GRUB and BIOS GRUB) boot from.
# Gate 13s22 computes that ordering from settings.conf.
#
# Degrade-safe like the snapper and Hemera blocks: --setup warns and exits 0
# on a missing swap or tool, because failing the whole install over hibernate
# would cost more than it protects. And per the standing shellprocess rule:
# NO $word shell variables in the command — a bare path only.
#
# © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================================
---
dontChroot: false
timeout: 120

script:
  - command: "/usr/local/bin/nyxus-hibernate --setup"
    timeout: 120
