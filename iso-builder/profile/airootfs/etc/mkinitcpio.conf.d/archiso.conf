# LIVE ISO initramfs — unknown PCs, not the baker's chassis.
#
# HARD RULE:
#   No `autodetect`. Autodetect on the bake host would shrink this
#   image to that host's loaded modules (one Alienware) and brick
#   every other machine.
#   MODULES is the common GPU set. Proprietary nvidia.ko is not in-tree,
#   so it must be named (kms would only pull i915/amdgpu/nouveau).
#   NEVER merge 20-nyxus-hardware.conf into the live image.

MODULES=(i915 amdgpu nvidia nvidia_modeset nvidia_drm)
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
