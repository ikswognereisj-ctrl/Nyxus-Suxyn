# Installed-system HOOKS override (plymouth after kms, resume after filesystems).
# Live ISO ignores this: linux.preset points mkinitcpio at archiso.conf only.
#
# This file must NOT declare MODULES. MODULES on disk come from
# nyxus-hwdetect → 20-nyxus-hardware.conf (generated on the TARGET).
HOOKS=(base udev autodetect microcode modconf kms plymouth keyboard keymap consolefont block filesystems resume fsck)
