#
# Replaces /etc/pacman.conf on the LIVE ISO and the INSTALLED system.
# Key change vs Arch default: [multilib] is enabled by default — required
# for Steam, Wine, lib32-* gaming packages, and lib32-nvidia-utils.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
Color
ILoveCandy
VerbosePkgLists

# ── Session entries: only NYXUS (Hyprland) is a supported session ──────────
# G-08/G-09 (2026-07-31 VM audit): the greeter offered three sessions —
# `Hyprland`, `Hyprland (uwsm-managed)` and `NYXUS (Hyprland)` — and
# preselected one of the upstream two. A first-time user who just typed their
# password got a bare upstream compositor with no bars, no stations and no
# theming, and no way to tell that was not NYXUS.
#
# The two upstream entries ship inside the `hyprland` package. Deleting them
# in customize_airootfs.sh would work on the read-only live image but the next
# `pacman -Syu` on an installed system puts them straight back. NoExtract is
# the durable form: pacman never writes those paths, on install or on upgrade.
NoExtract = usr/share/wayland-sessions/hyprland.desktop
NoExtract = usr/share/wayland-sessions/hyprland-uwsm.desktop

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ── [nyxus] — the NYXUS Suxyn package channel (TRK-1281) ──────────────────
# nyxus-shell, nyxus-scripts, nyxus-theme, nyxus-system — built by
# scripts/build-packages.sh, signed with the key in packaging/KEY. This is how
# an INSTALLED machine receives a newer shell / app / theme through `nyxus
# update` instead of a re-install (CS-1050). COMMENTED until the owner decides
# where the channel is hosted: uncommenting the header + SigLevel + the https
# Server line IS the hosting decision, and it is his. Signatures stay Required
# (never TrustAll on an installed box); the public key is trusted with
#   pacman-key --add nyxus-pubkey.asc && pacman-key --lsign-key <id>
# (or a future nyxus-keyring package). The file:// line is for a box that
# carries the channel directory itself (a USB copy; `nyxus update --from <dir>`
# is the simpler route for that and needs no repo at all).
#[nyxus]
#SigLevel = Required DatabaseOptional
#Server = file:///opt/nyxus-channel/$arch
#Server = https://<OWNER-HOST>/nyxus/$arch      # ← OWNER: hosting decision; replace the placeholder

# [nyxus-testing] — same shape, second directory, for builds that are not yet
# the release. Listed AFTER [nyxus] so a same-name tie goes to the release.
#[nyxus-testing]
#SigLevel = Required DatabaseOptional
#Server = https://<OWNER-HOST>/nyxus-testing/$arch
