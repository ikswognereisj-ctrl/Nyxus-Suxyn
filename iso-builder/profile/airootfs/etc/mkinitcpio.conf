# NYXUS — installed-system initramfs config
# LIVE ISO uses /etc/mkinitcpio.conf.d/archiso.conf (linux.preset).
#
# HARD RULE (any-machine ISO):
#   MODULES is a COMMON GPU set so unknown PCs can early-KMS.
#   It is NOT the baker's Alienware drop-in (amdgpu + nvidia only).
#   Do NOT ship /etc/mkinitcpio.conf.d/20-nyxus-hardware.conf in this
#   profile — nyxus-hwdetect writes that on the TARGET from its PCI bus
#   (Calamares shellprocess@initramfs, or firstboot 03-hardware-initramfs.sh).
#   Do not localmodconfig. Do not strip firmware.

MODULES=(i915 amdgpu nvidia nvidia_modeset nvidia_drm)
BINARIES=()
FILES=()
HOOKS=(base udev plymouth autodetect microcode modconf kms keyboard keymap consolefont block filesystems resume fsck)
COMPRESSION="zstd"
